name: Fix main lessons list v2

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/fix-main-lessons-v2.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch main lessons rendering
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          marker = '<script id="main-lessons-list-v2">'
          if marker not in s:
              patch = r'''<script id="main-lessons-list-v2">function renderMainLessonsListV2(){const root=document.getElementById('tab-calendar');if(!root||!Array.isArray(lessons))return;const past=lessons.filter(l=>['conducted','cancelled_charge'].includes(String(l.status||'').toLowerCase())).sort((a,b)=>((b.date||'')+' '+(b.time||'')).localeCompare((a.date||'')+' '+(a.time||'')));const planned=lessons.filter(l=>String(l.status||'').toLowerCase()==='pending').sort((a,b)=>((a.date||'')+' '+(a.time||'')).localeCompare((b.date||'')+' '+(b.time||'')));const fmt=d=>d?new Date(d+'T00:00:00').toLocaleDateString('ru-RU'):'';const row=l=>`<div onclick="openLessonModal(${Number(l.id)})" class="flex items-center justify-between gap-3 p-4 border rounded-xl hover:bg-slate-50 cursor-pointer"><div class="min-w-0"><div class="font-semibold">${esc(l.student||'')}</div><div class="text-sm text-slate-500">${fmt(l.date)}${l.time?' · '+esc(l.time):''}</div></div><div class="text-right shrink-0"><div class="font-semibold">${money(l.price)}</div><span class="inline-block mt-1 text-xs px-2 py-1 rounded-full border ${statusClasses[l.status]||''}">${esc(statusLabels[l.status]||l.status||'')}</span></div></div>`;root.innerHTML=`<div class="space-y-5"><div class="grid grid-cols-1 md:grid-cols-4 gap-3"><div class="bg-white border rounded-2xl p-4"><p class="text-xs text-slate-500">Баланс учеников</p><p class="text-2xl font-bold mt-1">${money(students.reduce((a,s)=>a+balance(s.name),0))}</p></div><div class="bg-white border rounded-2xl p-4"><p class="text-xs text-slate-500">Проведено занятий</p><p class="text-2xl font-bold mt-1">${past.filter(l=>l.status==='conducted').length}</p></div><div class="bg-white border rounded-2xl p-4"><p class="text-xs text-slate-500">Получено платежей</p><p class="text-2xl font-bold mt-1">${money(payments.reduce((a,p)=>a+Number(p.amount||0),0))}</p></div><div class="bg-white border rounded-2xl p-4"><p class="text-xs text-slate-500">К списанию</p><p class="text-2xl font-bold mt-1">${money(past.reduce((a,l)=>a+Number(l.price||0),0))}</p></div></div><div class="bg-white border rounded-2xl shadow-sm p-5"><div class="flex justify-between items-center mb-4"><div><h2 class="text-xl font-bold">Прошедшие занятия</h2><p class="text-sm text-slate-500">Проведенные и отмененные со списанием</p></div><button onclick="openLessonModal()" class="bg-indigo-600 text-white px-4 py-2 rounded-xl font-semibold">＋ Новое занятие</button></div><div class="space-y-2">${past.length?past.map(row).join(''):'<div class="py-8 text-center text-slate-400">Прошедших занятий пока нет</div>'}</div></div><div class="bg-white border rounded-2xl shadow-sm p-5"><h3 class="font-bold mb-3">Запланированные занятия <span class="text-xs text-slate-400">(${planned.length})</span></h3><div class="space-y-2">${planned.length?planned.map(row).join(''):'<div class="text-sm text-slate-400">Нет запланированных занятий</div>'}</div></div></div>`;}setTimeout(renderMainLessonsListV2,100);document.addEventListener('DOMContentLoaded',()=>setTimeout(renderMainLessonsListV2,100));</script>'''
              s=s.replace('</body>',patch+'\n</body>')
              p.write_text(s,encoding='utf-8')
          PY

      - name: Patch Students page
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')

          old='''<section id="tab-students" class="hidden space-y-5"><div class="bg-white border rounded-2xl p-5"><h2 class="font-bold mb-4">Новый ученик</h2><div class="grid grid-cols-1 md:grid-cols-4 gap-3"><input id="new-student-name" class="border rounded-xl px-3 py-2" placeholder="Имя"><input id="new-student-pin" class="border rounded-xl px-3 py-2" placeholder="PIN"><input id="new-student-price" type="number" value="40" class="border rounded-xl px-3 py-2" placeholder="Стоимость"><button onclick="addStudent()" class="bg-indigo-600 text-white rounded-xl font-semibold">Добавить</button></div></div><div id="students-container" class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-4"></div></section>'''
          new='''<section id="tab-students" class="hidden space-y-5"><div class="bg-white border rounded-2xl p-5"><h2 class="font-bold mb-4">Добавление нового ученика</h2><div class="grid grid-cols-1 md:grid-cols-3 gap-3"><input id="new-student-name" class="border rounded-xl px-3 py-2" placeholder="Имя"><input id="new-student-pin" class="border rounded-xl px-3 py-2" placeholder="PIN-код"><button onclick="addStudent()" class="bg-indigo-600 text-white rounded-xl font-semibold">Добавить</button></div></div><div class="bg-white border rounded-2xl p-5"><h2 class="font-bold mb-4">Ученики</h2><div class="overflow-x-auto"><table class="w-full text-sm"><thead><tr class="text-left border-b text-slate-400"><th class="p-3">Имя</th><th class="p-3">PIN-код</th><th class="p-3">Ссылка</th><th class="p-3 text-right">Действие</th></tr></thead><tbody id="students-container"></tbody></table></div></div></section>'''
          if old not in s: raise SystemExit('Students HTML block not found')
          s=s.replace(old,new,1)

          start=s.find('function renderStudents(){')
          end=s.find('\nasync function addStudent',start)
          if start<0 or end<0: raise SystemExit('renderStudents not found')
          render='''function renderStudents(){fillStudentSelects();const box=document.getElementById('students-container');if(!box)return;if(!students.length){box.innerHTML='<tr><td colspan="4" class="p-6 text-center text-slate-400">Учеников пока нет</td></tr>';return;}box.innerHTML=students.map(s=>{const safe=String(s.name??'').replace(/\\\\/g,'\\\\\\\\').replace(/'/g,"\\\\'");return `<tr class="border-b last:border-0 hover:bg-slate-50"><td class="p-3 font-semibold">${esc(s.name)}</td><td class="p-3">${esc(s.pin)}</td><td class="p-3"><button onclick="openStudentCabinetLink('${safe}')" class="text-indigo-600 font-semibold">Скопировать ссылку</button></td><td class="p-3 text-right whitespace-nowrap"><button onclick="editStudent('${safe}')" class="text-indigo-600 font-semibold mr-4">Изменить</button><button onclick="deleteStudent('${safe}')" class="text-red-600 font-semibold">Удалить</button></td></tr>`;}).join('');}\n'''
          s=s[:start]+render+s[end:]

          start=s.find('async function addStudent(){')
          end=s.find('\nasync function editStudent',start)
          if start<0 or end<0: raise SystemExit('addStudent not found')
          add='''async function addStudent(){try{const name=document.getElementById('new-student-name').value.trim(),pin=document.getElementById('new-student-pin').value.trim();if(!name||!pin)return alert('Введите имя и PIN-код');if(students.some(s=>s.name.toLowerCase()===name.toLowerCase()))return alert('Такой ученик уже есть');const rows=await db('/students',{method:'POST',headers:{...headers,Prefer:'return=representation'},body:JSON.stringify({name,pin,price:40})});students.push(...rows);document.getElementById('new-student-name').value='';document.getElementById('new-student-pin').value='';renderStudents();fillStudentSelects();}catch(e){showError(e);}}\n'''
          s=s[:start]+add+s[end:]

          start=s.find('async function editStudent(name){')
          end=s.find('\nasync function deleteStudent',start)
          if start<0 or end<0: raise SystemExit('editStudent not found')
          edit='''async function editStudent(name){const s=students.find(x=>x.name===name);if(!s)return;const n=prompt('Имя ученика:',s.name);if(n===null)return;const p=prompt('PIN-код:',s.pin);if(p===null)return;const newName=n.trim(),newPin=p.trim();if(!newName||!newPin)return alert('Имя и PIN-код обязательны');try{await db('/students?name=eq.'+encodeURIComponent(s.name),{method:'PATCH',body:JSON.stringify({name:newName,pin:newPin})});if(newName!==s.name){await db('/lessons?student=eq.'+encodeURIComponent(s.name),{method:'PATCH',body:JSON.stringify({student:newName})});await db('/payments?student=eq.'+encodeURIComponent(s.name),{method:'PATCH',body:JSON.stringify({student:newName})});}await loadData();renderStudents();fillStudentSelects();}catch(e){showError(e);}}\n'''
          s=s[:start]+edit+s[end:]
          p.write_text(s,encoding='utf-8')
          PY

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Update Students page layout"
          git push
