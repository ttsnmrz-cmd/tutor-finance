name: Fix calendar day click
on:
  push:
    paths:
      - .github/workflows/fix-calendar-day-click.yml
      - fix-calendar-trigger.txt
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch calendar helper
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          old="""    const text=(document.getElementById('week-range')?.textContent||'');
    const m=text.match(/(\\d{1,2})\\.(\\d{1,2})\\.(\\d{4})/);
    if(!m) return null;
    const d=new Date(Number(m[3]),Number(m[2])-1,Number(m[1])+index);"""
          new="""    if(typeof weekAnchor==='undefined'||typeof startOfWeek!=='function') return null;
    const d=startOfWeek(new Date(weekAnchor));
    d.setDate(d.getDate()+index);"""
          if old not in s:
              raise SystemExit('target code not found')
          p.write_text(s.replace(old,new,1),encoding='utf-8')
          PY
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Fix calendar day click date handling'
          git push
