name: Fix calendar click v2
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    if: github.event.head_commit.message != 'Fix calendar empty-day click v2'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch calendar click
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          marker='<script id="calendar-day-click-v2">'
          if marker not in s:
              patch=r'''<script id="calendar-day-click-v2">
          (function(){
            function isoForIndex(i){
              if(typeof weekAnchor==='undefined'||typeof startOfWeek!=='function') return null;
              const d=startOfWeek(new Date(weekAnchor));
              d.setDate(d.getDate()+i);
              return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
            }
            function handle(e){
              const cal=document.getElementById('week-calendar');
              if(!cal) return;
              const day=e.target.closest && e.target.closest('.week-day');
              if(!day || !cal.contains(day)) return;
              if(e.target.closest('.week-lesson')) return;
              if(e.target.closest('button,a,input,select,textarea')) return;
              const days=Array.from(cal.querySelectorAll(':scope > .week-day'));
              const i=days.indexOf(day);
              if(i<0) return;
              const date=isoForIndex(i);
              if(date && typeof window.openNewLessonModal==='function'){
                e.preventDefault();
                e.stopPropagation();
                window.openNewLessonModal(date);
              }
            }
            function bind(){
              const cal=document.getElementById('week-calendar');
              if(!cal || cal.dataset.dayClickV2) return;
              cal.dataset.dayClickV2='1';
              cal.addEventListener('click',handle,true);
            }
            document.addEventListener('DOMContentLoaded',bind);
            new MutationObserver(bind).observe(document.body,{childList:true,subtree:true});
            setTimeout(bind,500);
            setTimeout(bind,1500);
          })();
          </script>
          '''
              s=s.replace('</body>',patch+'</body>',1)
              p.write_text(s,encoding='utf-8')
          PY
      - name: Commit patch and cleanup
        run: |
          rm -f .github/workflows/fix-calendar-click-v2.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html .github/workflows/fix-calendar-click-v2.yml
          git commit -m 'Fix calendar empty-day click v2'
          git push
