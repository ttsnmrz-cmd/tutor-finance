name: Fix identity inserts
on:
  push:
    paths:
      - .github/workflows/fix-identity-inserts.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove explicit generated IDs from inserts
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          # Supabase now generates lessons/payments IDs as GENERATED ALWAYS identity columns.
          # Inserts must therefore omit id entirely and let PostgreSQL generate it.
          s = re.sub(r'id:Date\.now\(\),', '', s)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet || git commit -m 'Fix generated identity inserts'
          git push
