name: Stage compiled Classroom assets
on:
  push:
    branches: [integration/classroom-builder-20261122, refactor-modules]
    paths:
      - 'classroom-app/**'
      - '.github/workflows/stage-classroom-assets.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  stage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: corepack enable && corepack prepare pnpm@10.29.3 --activate
      - run: pnpm install --frozen-lockfile && pnpm build
        working-directory: classroom-app
      - name: Confirm embedded assets
        run: |
          test -s legacy/classroom-assets/classroom.js
          test -s legacy/classroom-assets/classroom.css
      - name: Version embedded assets in production HTML
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          version = '${{ github.sha }}'[:12]
          for filename in ('index.html', '404.html'):
              path = Path(filename)
              if not path.exists():
                  continue
              html = path.read_text()
              updated = re.sub(r'(/legacy/classroom-assets/classroom\.(?:js|css)\?v=)[^"\s<>]+', lambda m: m.group(1) + version, html)
              if updated == html and 'classroom-assets/classroom.' not in html:
                  raise SystemExit(f'Classroom assets not referenced in {filename}')
              path.write_text(updated)
          PY
      - name: Commit staged bundle and HTML asset versions
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f legacy/classroom-assets/classroom.js legacy/classroom-assets/classroom.css
          git add index.html 404.html
          if ! git diff --cached --quiet; then
            git commit -m 'build: stage verified Classroom bundle'
            git pull --rebase origin ${{ github.ref_name }}
            git push origin HEAD:${{ github.ref_name }}
          fi
