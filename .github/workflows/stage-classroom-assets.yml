name: Stage compiled Classroom assets
on:
  push:
    branches: [integration/classroom-builder-20261122, refactor-modules]
    paths:
      - 'classroom-app/**'
      - '.github/workflows/stage-classroom-assets.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  stage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: corepack enable && corepack prepare pnpm@10.29.3 --activate
      - name: Install and build Classroom
        run: cd classroom-app && pnpm install --frozen-lockfile && pnpm build
      - name: Verify shared teacher/student preview architecture
        run: |
          python3 - <<'PY'
          from pathlib import Path
          builder = Path('classroom-app/src/builder')
          teacher = (builder / 'MaterialBuilder.tsx').read_text()
          student = Path('classroom-app/src/embed.tsx').read_text()
          preview = (builder / 'ExercisePreview.tsx').read_text()
          layout = (builder / 'preview-layout.css').read_text()
          assert "import './preview-shared.css'" in teacher
          assert "import './preview-layout.css'" in teacher
          assert 'ExercisePreview' in teacher and 'ExercisePreview' in student
          assert 'studentMode' in student
          assert 'className="mb-builder mb-student-preview"' in preview
          for name in ('preview-shared.css', 'editor-and-role.css', 'builder.css'):
              css = (builder / name).read_text()
              assert '#student-live-material' not in css, f'Student-only preview override in {name}'
              assert '.profiprofit-student-lesson' not in css, f'Student-only preview override in {name}'
          assert layout.count('#student-live-material') == 1, 'Review new student-only preview rules'
          print('Teacher and student share ExercisePreview and its CSS.')
          PY
        working-directory: classroom-app
      - name: Confirm embedded assets
        run: |
          test -s legacy/classroom-assets/classroom.js
          test -s legacy/classroom-assets/classroom.css
      - name: Version embedded assets in production HTML
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          version = '${{ github.sha }}'[:12]
          for filename in ('index.html', '404.html'):
              path = Path(filename)
              if not path.exists():
                  continue
              html = path.read_text()
              updated = re.sub(r'(/legacy/classroom-assets/classroom\.(?:js|css)\?v=)[^"\s<>]+', lambda m: m.group(1) + version, html)
              if updated == html and 'classroom-assets/classroom.' not in html:
                  raise SystemExit(f'Classroom assets not referenced in {filename}')
              path.write_text(updated)
          PY
      - name: Commit staged bundle and HTML asset versions
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f legacy/classroom-assets/classroom.js legacy/classroom-assets/classroom.css
          git add index.html 404.html
          if ! git diff --cached --quiet; then
            git commit -m 'build: stage verified Classroom bundle'
            for attempt in 1 2 3 4 5; do
              git fetch origin ${{ github.ref_name }}
              git rebase origin/${{ github.ref_name }}
              if git push origin HEAD:${{ github.ref_name }}; then
                exit 0
              fi
              echo "Concurrent push detected; retrying ($attempt/5)"
              sleep 2
            done
            echo 'Failed to push staged assets after retries' >&2
            exit 1
          fi
