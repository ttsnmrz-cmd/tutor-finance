name: Fix cabinet navigation
on:
  push:
    paths:
      - .github/workflows/fix-cabinet-navigation.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch navigation and calendar
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          # Current calendar popup bug: week-range is text like "14 сентября — 20 сентября 2026",
          # so parsing dd.mm.yyyy returns null. Use the actual weekAnchor instead.
          old = '''  function isoFromWeekDay(dayEl,index){
    const text=(document.getElementById('week-range')?.textContent||'');
    const m=text.match(/(\\d{1,2})\\.(\\d{1,2})\\.(\\d{4})/);
    if(!m) return null;
    const d=new Date(Number(m[3]),Number(m[2])-1,Number(m[1])+index);
    return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
  }'''
          new = '''  function isoFromWeekDay(dayEl,index){
    if(typeof weekAnchor==='undefined'||typeof startOfWeek!=='function') return null;
    const d=startOfWeek(new Date(weekAnchor));
    d.setDate(d.getDate()+index);
    return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
  }'''
          if old in s:
              s = s.replace(old, new, 1)

          # Ensure the student creation card is visible whenever the Students tab opens.
          marker = "function renderStudents(){"
          inject = "function ensureStudentCreateBlock(){const tab=document.getElementById('tab-students');if(!tab)return;const block=tab.querySelector('.app-card');if(block)block.classList.remove('hidden');}"
          if 'function ensureStudentCreateBlock()' not in s and marker in s:
              s = s.replace(marker, inject + marker, 1)
          s = s.replace("if(t==='students')renderStudents();", "if(t==='students'){renderStudents();ensureStudentCreateBlock();}", 1)

          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet || git commit -m 'Fix calendar day popup and restore student add block'
          git push
