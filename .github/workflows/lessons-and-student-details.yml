name: Add lessons list and student details

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/lessons-and-student-details.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch CRM UI
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          marker = '<!-- lessons-list-v1 -->'
          if marker in s:
              print('Patch already present')
              raise SystemExit(0)

          patch = r'''<!-- lessons-list-v1 -->
          <style>
            .lesson-row{transition:background .15s ease}
            .lesson-row:hover{background:#f8fafc}
          </style>
          <script>
          (function(){
            const oldSwitchTab=window.switchTab;

            function ensureLessonsNav(){
              const nav=document.getElementById('nav');
              const cal=document.getElementById('nav-calendar');
              if(!nav) return;
              if(cal){
                cal.textContent='Занятия';
                cal.onclick=function(){switchTab('lessons')};
                cal.id='nav-lessons';
              }
            }

            function ensureLessonsSection(){
              if(document.getElementById('tab-lessons')) return;
              const main=document.getElementById('teacher-view');
              const studentsTab=document.getElementById('tab-students');
              const sec=document.createElement('section');
              sec.id='tab-lessons';
              sec.className='space-y-5';
              sec.innerHTML=`
                <div class="grid grid-cols-1 md:grid-cols-3 gap-3">
                  <div class="bg-white border rounded-2xl p-4"><p class="text-xs text-slate-500">Проведено занятий</p><p id="lessons-stat-count" class="text-2xl font-bold mt-1">0</p></div>
                  <div class="bg-white border rounded-2xl p-4"><p class="text-xs text-slate-500">Списано</p><p id="lessons-stat-deducted" class="text-2xl font-bold mt-1">0 BYN</p></div>
                  <div class="bg-white border rounded-2xl p-4"><p class="text-xs text-slate-500">Запланировано</p><p id="lessons-stat-planned" class="text-2xl font-bold mt-1">0</p></div>
                </div>
                <div class="bg-white border rounded-2xl p-5">
                  <div class="flex flex-col md:flex-row gap-3 justify-between md:items-center mb-4">
                    <div><h2 class="text-lg font-bold">Проведенные занятия</h2><p class="text-sm text-slate-500">Сначала самые последние</p></div>
                    <button onclick="openLessonModal()" class="bg-indigo-600 text-white px-4 py-2 rounded-xl font-semibold">＋ Новое занятие</button>
                  </div>
                  <div id="lessons-list"></div>
                </div>`;
              if(studentsTab) main.insertBefore(sec,studentsTab); else main.appendChild(sec);
            }

            window.renderLessonsList=function(){
              ensureLessonsSection();
              const done=(lessons||[]).filter(l=>l.status==='conducted').sort((a,b)=>{
                const aa=(a.date||'')+' '+(a.time||''); const bb=(b.date||'')+' '+(b.time||'');
                return bb.localeCompare(aa);
              });
              const planned=(lessons||[]).filter(l=>l.status==='pending');
              const count=document.getElementById('lessons-stat-count');
              const deducted=document.getElementById('lessons-stat-deducted');
              const plannedEl=document.getElementById('lessons-stat-planned');
              if(count) count.textContent=done.length;
              if(deducted) deducted.textContent=money(done.reduce((sum,l)=>sum+Number(l.price||0),0));
              if(plannedEl) plannedEl.textContent=planned.length;
              const box=document.getElementById('lessons-list');
              if(!box) return;
              if(!done.length){
                box.innerHTML='<div class="py-10 text-center text-slate-400">Проведенных занятий пока нет</div>';
                return;
              }
              box.innerHTML=`<div class="divide-y">${done.map(l=>{
                const d=esc(l.date||'');
                const date=d?new Date(d+'T00:00:00').toLocaleDateString('ru-RU',{day:'2-digit',month:'long',year:'numeric'}):'';
                return `<button onclick="openLessonModal('${esc(l.id)}')" class="lesson-row w-full text-left py-4 flex flex-col md:flex-row md:items-center gap-3 md:gap-5">
                  <div class="w-36 shrink-0"><div class="font-semibold">${date}</div><div class="text-sm text-slate-500">${esc(l.time||'')}</div></div>
                  <div class="flex-1"><div class="font-semibold">${esc(l.student||'')}</div><div class="text-sm text-slate-500">${esc(l.note||'')}</div></div>
                  <div class="font-semibold text-emerald-700">${money(l.price)}</div>
                  <div class="text-xs px-2 py-1 rounded-lg bg-emerald-100 text-emerald-800 w-fit">Проведено</div>
                </button>`;
              }).join('')}</div>`;
            };

            window.openTeacherStudentDetail=function(name){
              ensureStudentDetailSection();
              document.getElementById('teacher-view').classList.add('hidden');
              document.getElementById('teacher-student-detail').classList.remove('hidden');
              renderTeacherStudentDetail(name);
            };

            function ensureStudentDetailSection(){
              if(document.getElementById('teacher-student-detail')) return;
              const main=document.getElementById('teacher-view');
              const sec=document.createElement('section');
              sec.id='teacher-student-detail';
              sec.className='hidden space-y-5';
              sec.innerHTML=`<div id="teacher-student-detail-content"></div>`;
              main.parentNode.insertBefore(sec,main.nextSibling);
            }

            window.renderTeacherStudentDetail=function(name){
              const s=getStudent(name); if(!s) return;
              const ps=(payments||[]).filter(p=>p.student===name).sort((a,b)=>(b.date||'').localeCompare(a.date||''));
              const ls=(lessons||[]).filter(l=>l.student===name).sort((a,b)=>{
                const aa=(a.date||'')+' '+(a.time||''); const bb=(b.date||'')+' '+(b.time||''); return bb.localeCompare(aa);
              });
              const past=ls.filter(l=>l.status!=='pending');
              const planned=ls.filter(l=>l.status==='pending');
              const income=ps.reduce((sum,p)=>sum+Number(p.amount||0),0);
              const expense=ls.filter(l=>chargeStatuses.has(l.status)).reduce((sum,l)=>sum+Number(l.price||0),0);
              const balanceValue=income-expense;
              const content=document.getElementById('teacher-student-detail-content');
              content.innerHTML=`
                <div class="flex flex-col md:flex-row gap-3 justify-between md:items-center">
                  <button onclick="closeTeacherStudentDetail()" class="px-4 py-2 rounded-xl bg-slate-100 font-semibold">← К ученикам</button>
                  <button onclick="openLessonModal()" class="bg-indigo-600 text-white px-4 py-2 rounded-xl font-semibold">＋ Новое занятие</button>
                </div>
                <div class="bg-white border rounded-2xl p-5"><div class="flex flex-col md:flex-row justify-between gap-3"><div><h2 class="text-2xl font-bold">${esc(name)}</h2><p class="text-sm text-slate-500">Стоимость занятия: ${money(s.price)}</p></div><div class="text-right"><div class="text-sm text-slate-500">Баланс</div><div class="text-2xl font-bold ${balanceValue<0?'text-red-600':'text-emerald-600'}">${money(balanceValue)}</div></div></div></div>
                <div class="grid grid-cols-1 md:grid-cols-3 gap-3">
                  <div class="bg-white border rounded-2xl p-4"><p class="text-xs text-slate-500">Приходы</p><p class="text-xl font-bold text-emerald-700">${money(income)}</p></div>
                  <div class="bg-white border rounded-2xl p-4"><p class="text-xs text-slate-500">Расходы / списания</p><p class="text-xl font-bold text-red-600">${money(expense)}</p></div>
                  <div class="bg-white border rounded-2xl p-4"><p class="text-xs text-slate-500">Занятий проведено</p><p class="text-xl font-bold">${past.filter(l=>l.status==='conducted').length}</p></div>
                </div>
                <div class="grid grid-cols-1 lg:grid-cols-2 gap-5">
                  <div class="bg-white border rounded-2xl p-5"><h3 class="font-bold mb-3">Приходы</h3>${ps.length?`<div class="divide-y">${ps.map(p=>`<div class="py-3 flex justify-between gap-3"><div><div class="font-medium">${esc(p.date||'')}</div><div class="text-sm text-slate-500">${esc(p.note||'')}</div></div><div class="font-semibold text-emerald-700">+${money(p.amount)}</div></div>`).join('')}</div>`:'<p class="text-slate-400">Платежей пока нет</p>'}</div>
                  <div class="bg-white border rounded-2xl p-5"><h3 class="font-bold mb-3">Расходы / списания</h3>${ls.filter(l=>chargeStatuses.has(l.status)).length?`<div class="divide-y">${ls.filter(l=>chargeStatuses.has(l.status)).map(l=>`<div class="py-3 flex justify-between gap-3"><div><div class="font-medium">${esc(l.date||'')} ${esc(l.time||'')}</div><div class="text-sm text-slate-500">${esc(statusLabels[l.status]||l.status)}</div></div><div class="font-semibold text-red-600">-${money(l.price)}</div></div>`).join('')}</div>`:'<p class="text-slate-400">Списаний пока нет</p>'}</div>
                </div>
                <div class="bg-white border rounded-2xl p-5"><h3 class="font-bold mb-3">Прошлые занятия</h3>${past.length?`<div class="divide-y">${past.map(l=>teacherLessonRow(l)).join('')}</div>`:'<p class="text-slate-400">Прошлых занятий пока нет</p>'}</div>
                <div class="bg-white border rounded-2xl p-5"><h3 class="font-bold mb-3">Запланированные занятия</h3>${planned.length?`<div class="divide-y">${planned.map(l=>teacherLessonRow(l)).join('')}</div>`:'<p class="text-slate-400">Запланированных занятий нет</p>'}</div>`;
              function teacherLessonRow(l){
                return `<button onclick="openLessonModal('${esc(l.id)}')" class="w-full text-left py-3 flex flex-col md:flex-row md:items-center gap-2 md:gap-5 hover:bg-slate-50 rounded-xl px-2"><div class="w-40 font-medium">${esc(l.date||'')} ${esc(l.time||'')}</div><div class="flex-1 text-sm text-slate-600">${esc(l.note||'')}</div><span class="text-xs px-2 py-1 rounded-lg border ${statusClasses[l.status]||'bg-slate-100'}">${esc(statusLabels[l.status]||l.status)}</span><div class="font-semibold">${money(l.price)}</div></button>`;
              }
            };

            window.closeTeacherStudentDetail=function(){
              document.getElementById('teacher-student-detail')?.classList.add('hidden');
              document.getElementById('teacher-view')?.classList.remove('hidden');
              switchTab('students');
            };

            window.openStudentCabinetLink=function(name){openTeacherStudentDetail(name);};

            window.switchTab=function(t){
              ensureLessonsNav(); ensureLessonsSection();
              const detail=document.getElementById('teacher-student-detail');
              if(detail) detail.classList.add('hidden');
              const teacher=document.getElementById('teacher-view'); if(teacher) teacher.classList.remove('hidden');
              ['lessons','students','finance'].forEach(x=>{
                const el=document.getElementById('tab-'+x); if(el) el.classList.toggle('hidden',x!==t);
                const nav=document.getElementById('nav-'+x); if(nav) nav.className=x===t?'px-4 py-2 rounded-xl text-sm font-semibold bg-indigo-600 text-white':'px-4 py-2 rounded-xl text-sm font-semibold bg-slate-100 text-slate-600';
              });
              const oldNav=document.getElementById('nav-calendar'); if(oldNav) oldNav.className='hidden';
              if(t==='lessons') renderLessonsList();
              if(t==='students') renderStudents();
              if(t==='finance') renderFinance();
            };

            function bootNewUi(){
              ensureLessonsNav(); ensureLessonsSection();
              const oldCal=document.getElementById('tab-calendar'); if(oldCal) oldCal.classList.add('hidden');
              const oldStudentBtn=document.getElementById('nav-students'); if(oldStudentBtn) oldStudentBtn.textContent='Ученики';
              if(document.getElementById('teacher-view') && !document.getElementById('teacher-view').classList.contains('hidden')) switchTab('lessons');
            }
            setTimeout(bootNewUi,0);
          })();
          </script>
          '''
          s=s.replace('</body>', patch+'\n</body>', 1)
          p.write_text(s,encoding='utf-8')
          PY

      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then
            echo 'No changes to commit'
            exit 0
          fi
          git commit -m 'Replace calendar with chronological lessons and student details'
          git push