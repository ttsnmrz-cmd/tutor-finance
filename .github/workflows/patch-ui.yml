name: Patch UI
on:
  push:
    paths:
      - 'ui-patch-trigger.txt'
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Patch index
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          s=s.replace('''<label class="text-sm font-semibold block">Повторять до<input id="recurring-end" type="date" class="soft-input mt-1 w-full rounded-xl px-3 py-2"></label>''','')
          s=s.replace('''<label class="text-sm font-semibold block">Повторять до<input id="recurring-end" type="date" class="soft-input mt-1 w-full rounded-xl px-3 py-2"></label>''','')
          # Remove any remaining recurring-end UI generated by the older script.
          s=s.replace(''';const end=document.getElementById('recurring-end'); if(end)end.value='';''','')
          s=s.replace('''const end=document.getElementById('recurring-end'); if(end)end.value='';''','')
          s=s.replace(''';const end=document.getElementById('recurring-end');if(end)end.value='';''','')
          # Add a final override script so the old recurring wrapper no longer requires an end date.
          marker='</body>'
          patch=r'''<script id="ui-final-patch-v1">
(function(){
  function hideRecurringEnd(){
    const e=document.getElementById('recurring-end');
    if(e){const p=e.closest('label');if(p)p.remove();else e.remove();}
  }
  function patchRecurringSave(){
    const btn=document.getElementById('lesson-save-btn');
    if(!btn||btn.dataset.recPatched)return;
    btn.dataset.recPatched='1';
    const old=window.saveEditedLesson;
    window.saveEditedLesson=async function(){
      const id=document.getElementById('edit-id')?.value;
      if(id)return old();
      const recurring=document.getElementById('lesson-recurring')?.checked;
      if(!recurring)return old();
      const student=document.getElementById('edit-student')?.value;
      const date=document.getElementById('edit-date')?.value;
      const time=typeof requireValidTime==='function'?requireValidTime(document.getElementById('edit-time')?.value):null;
      const price=Number(document.getElementById('edit-price')?.value||0);
      const status=document.getElementById('edit-status')?.value||'pending';
      if(!student||!date||!time)return;
      const selected=[...document.querySelectorAll('.rec-day:checked')].map(x=>Number(x.value));
      const freq=Number(document.getElementById('recurring-frequency')?.value||1);
      if(!selected.length){showError(new Error('Выберите хотя бы один день недели'));return;}
      const start=new Date(date+'T12:00:00');
      const last=new Date(start);last.setFullYear(last.getFullYear()+1);
      const monday=d=>{const x=new Date(d);const day=x.getDay();x.setDate(x.getDate()+(day===0?-6:1-day));x.setHours(12,0,0,0);return x;};
      const firstMonday=monday(start),dates=[];
      for(let d=new Date(start);d<=last;d.setDate(d.getDate()+1)){
        const weeks=Math.round((monday(d)-firstMonday)/604800000);
        if(weeks%freq===0&&selected.includes(d.getDay()))dates.push(d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'));
      }
      try{
        const rows=dates.map(d=>({student,date:d,time,price,status}));
        await db('/lessons',{method:'POST',headers:{'Prefer':'return=minimal'},body:JSON.stringify(rows)});
        await loadData();renderMain();renderWeek();if(typeof renderFinance==='function')renderFinance();closeLessonModal();
      }catch(e){showError(e);}
    };
  }
  function patchSchedule(){
    const body=document.getElementById('main-lessons');
    if(!body||body.dataset.scrollPatched)return;
    body.dataset.scrollPatched='1';
    const table=body.closest('table');
    const wrap=table?.parentElement;
    if(wrap){wrap.classList.add('schedule-scroll');}
    function positionToday(){
      const rows=[...body.querySelectorAll('tr[data-lesson-date]')];
      if(!rows.length)return;
      const today=new Date();
      const key=today.getFullYear()+'-'+String(today.getMonth()+1).padStart(2,'0')+'-'+String(today.getDate()).padStart(2,'0');
      const firstFuture=rows.find(r=>r.dataset.lessonDate>=key);
      if(firstFuture&&wrap){wrap.scrollTop=Math.max(0,firstFuture.offsetTop-wrap.offsetTop);}
    }
    const observer=new MutationObserver(()=>{setTimeout(positionToday,0);});
    observer.observe(body,{childList:true});
    window.addEventListener('resize',positionToday);
    setTimeout(positionToday,100);
  }
  function patchRenderMain(){
    const old=window.renderMain;
    if(!old||old.__uiPatched)return;
    function render(){
      old.apply(this,arguments);
      const body=document.getElementById('main-lessons');
      if(!body)return;
      const rows=[...body.querySelectorAll('tr')];
      rows.forEach(r=>{const cell=r.querySelector('td');if(cell)r.dataset.lessonDate=cell.textContent.trim();});
      const today=new Date();
      const key=today.getFullYear()+'-'+String(today.getMonth()+1).padStart(2,'0')+'-'+String(today.getDate()).padStart(2,'0');
      const sorted=[...rows].filter(r=>r.dataset.lessonDate).sort((a,b)=>a.dataset.lessonDate.localeCompare(b.dataset.lessonDate));
      sorted.forEach(r=>body.appendChild(r));
      setTimeout(()=>{const wrap=body.closest('table')?.parentElement;const target=sorted.find(r=>r.dataset.lessonDate>=key);if(wrap&&target)wrap.scrollTop=Math.max(0,target.offsetTop-wrap.offsetTop);},0);
    }
    render.__uiPatched=true;
    window.renderMain=render;
  }
  function css(){if(document.getElementById('ui-final-style'))return;const st=document.createElement('style');st.id='ui-final-style';st.textContent='.schedule-scroll{max-height:calc(20 * 49px + 1px);overflow-y:auto;padding-right:4px}.schedule-scroll table{min-width:900px}.schedule-scroll thead{position:sticky;top:0;z-index:2;background:#fff}';document.head.appendChild(st);}
  function run(){css();hideRecurringEnd();patchRenderMain();patchSchedule();}
  document.addEventListener('DOMContentLoaded',run);new MutationObserver(run).observe(document.body,{childList:true,subtree:true});setTimeout(run,300);setTimeout(run,1000);
})();
</script>'''
          if 'id="ui-final-patch-v1"' not in s:
              s=s.replace(marker,patch+'\n'+marker)
          p.write_text(s)
          PY
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m 'Update schedule scrolling and recurring lessons'
          git push
