name: Patch UI
on:
  push:
    paths:
      - 'ui-patch-trigger.txt'
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Patch index
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          # Remove the visible end-date control.
          s=s.replace('''<label class="text-sm font-semibold block">Повторять до<input id="recurring-end" type="date" class="soft-input mt-1 w-full rounded-xl px-3 py-2"></label>''','')
          # Append a final UI override. Recurring lessons are generated one year ahead;
          # future lessons can be removed from the student's page when needed.
          if 'id="ui-final-patch-v2"' not in s:
              patch=r'''<script id="ui-final-patch-v2">
(function(){
  function removeEnd(){const e=document.getElementById('recurring-end');if(e){const p=e.closest('label');if(p)p.remove();else e.remove();}}
  function patchSave(){
    const old=window.saveEditedLesson;if(!old||old.__uiV2)return;
    async function save(){
      const id=document.getElementById('edit-id')?.value;
      if(id)return old();
      const recurring=document.getElementById('lesson-recurring')?.checked;
      if(!recurring)return old();
      const student=document.getElementById('edit-student')?.value,date=document.getElementById('edit-date')?.value;
      const time=typeof requireValidTime==='function'?requireValidTime(document.getElementById('edit-time')?.value):null;
      const price=Number(document.getElementById('edit-price')?.value||0),status=document.getElementById('edit-status')?.value||'pending';
      if(!student||!date||!time)return;
      const selected=[...document.querySelectorAll('.rec-day:checked')].map(x=>Number(x.value));
      const freq=Number(document.getElementById('recurring-frequency')?.value||1);
      if(!selected.length){showError(new Error('Выберите хотя бы один день недели'));return;}
      const start=new Date(date+'T12:00:00'),last=new Date(start);last.setFullYear(last.getFullYear()+1);
      const monday=d=>{const x=new Date(d),day=x.getDay();x.setDate(x.getDate()+(day===0?-6:1-day));x.setHours(12,0,0,0);return x;};
      const firstMonday=monday(start),dates=[];
      for(let d=new Date(start);d<=last;d.setDate(d.getDate()+1)){const weeks=Math.round((monday(d)-firstMonday)/604800000);if(weeks%freq===0&&selected.includes(d.getDay()))dates.push(d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'));}
      try{await db('/lessons',{method:'POST',headers:{'Prefer':'return=minimal'},body:JSON.stringify(dates.map(d=>({student,date:d,time,price,status})))});await loadData();renderMain();renderWeek();if(typeof renderFinance==='function')renderFinance();closeLessonModal();}catch(e){showError(e);}
    }
    save.__uiV2=true;window.saveEditedLesson=save;
  }
  function patchSchedule(){
    const body=document.getElementById('main-lessons');if(!body)return;
    const wrap=body.closest('table')?.parentElement;if(!wrap)return;
    wrap.classList.add('schedule-scroll');
    const rows=[...body.querySelectorAll('tr')].filter(r=>r.querySelector('td'));
    rows.forEach(r=>{const c=r.querySelector('td');if(c)r.dataset.lessonDate=c.textContent.trim();});
    if(!body.dataset.sorted){body.dataset.sorted='1';rows.sort((a,b)=>a.dataset.lessonDate.localeCompare(b.dataset.lessonDate));rows.forEach(r=>body.appendChild(r));}
    const today=new Date(),key=today.getFullYear()+'-'+String(today.getMonth()+1).padStart(2,'0')+'-'+String(today.getDate()).padStart(2,'0');
    const target=[...body.querySelectorAll('tr[data-lesson-date]')].find(r=>r.dataset.lessonDate>=key);
    if(target)requestAnimationFrame(()=>{wrap.scrollTop=Math.max(0,target.offsetTop-wrap.offsetTop);});
  }
  function css(){if(document.getElementById('ui-v2-style'))return;const st=document.createElement('style');st.id='ui-v2-style';st.textContent='.schedule-scroll{max-height:calc(20 * 49px + 1px);overflow-y:auto;padding-right:4px}.schedule-scroll table{min-width:900px}.schedule-scroll thead{position:sticky;top:0;z-index:2;background:#fff}';document.head.appendChild(st);}
  function run(){removeEnd();patchSave();patchSchedule();css();}
  document.addEventListener('DOMContentLoaded',run);new MutationObserver(run).observe(document.body,{childList:true,subtree:true});setTimeout(run,300);setTimeout(run,1000);
})();
</script>'''
              s=s.replace('</body>',patch+'\n</body>')
          p.write_text(s)
          PY
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m 'Update schedule scrolling and recurring lessons'
          git push
