name: Calendar date fix
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    if: github.event.head_commit.message != '[calendar-popup] Fix day date calculation'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix date calculation
        run: |
          python3 <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          old="""function isoFromWeekDay(dayEl,index){\n              const text=(document.getElementById('week-range')?.textContent||'');\n              const m=text.match(/(\\d{1,2})\\.(\\d{1,2})\\.(\\d{4})/);\n              if(!m) return null;\n              const d=new Date(Number(m[3]),Number(m[2])-1,Number(m[1])+index);\n              return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');\n            }"""
          new="""function isoFromWeekDay(dayEl,index){\n              if(typeof weekAnchor==='undefined'||typeof startOfWeek!=='function') return null;\n              const d=startOfWeek(new Date(weekAnchor));\n              d.setDate(d.getDate()+index);\n              return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');\n            }"""
          if old not in s:
              raise SystemExit('Old calendar date function not found')
          s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit patch and remove workflow
        run: |
          rm -f .github/workflows/one-time-calendar-date-fix.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html .github/workflows/one-time-calendar-date-fix.yml
          git commit -m '[calendar-popup] Fix day date calculation'
          git push
