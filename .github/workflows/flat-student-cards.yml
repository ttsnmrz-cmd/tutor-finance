name: Flat student cards

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/flat-student-cards.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch index.html
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          marker = '<script id="flat-student-cards-v1">'
          if marker in s:
              raise SystemExit('Patch already present')
          patch = r'''<script id="flat-student-cards-v1">
          // Final CRM layout: no separate teacher/student cabinet.
          function hideStudentCabinetUi(){
            const sv=document.getElementById('student-view');
            const pm=document.getElementById('student-pin-modal');
            if(sv) sv.classList.add('hidden');
            if(pm) pm.classList.add('hidden');
          }

          function renderStudents(){
            const box=document.getElementById('students-container');
            if(!box)return;
            if(!students.length){
              box.innerHTML='<div class="col-span-full text-sm text-slate-500">Пока нет учеников.</div>';
              return;
            }
            const escName=(name)=>String(name??'').replace(/\\/g,'\\\\').replace(/'/g,"\\'");
            box.innerHTML=students.map(s=>{
              const name=s.name;
              const price=studentPrice(name);
              const bal=balance(name);
              const paid=totalPaid(name);
              const spent=totalSpent(name);
              const past=lessons.filter(l=>l.student===name&&l.status!=='pending').sort((a,b)=>((b.date||'')+' '+(b.time||'')).localeCompare((a.date||'')+' '+(a.time||'')));
              const planned=lessons.filter(l=>l.student===name&&l.status==='pending').sort((a,b)=>((a.date||'')+' '+(a.time||'')).localeCompare((b.date||'')+' '+(b.time||'')));
              const pays=payments.filter(p=>p.student===name).sort((a,b)=>(b.date||'').localeCompare(a.date||''));
              const fmt=(d)=>d?new Date(d+'T00:00:00').toLocaleDateString('ru-RU'):'';
              const lessonRow=(l)=>`<div class="flex items-center justify-between gap-2 py-2 border-b last:border-0 cursor-pointer hover:bg-slate-50" onclick="openLessonModal(${Number(l.id)})">
                <div class="min-w-0"><div class="font-medium text-sm">${fmt(l.date)}${l.time?' · '+esc(l.time):''}</div><div class="text-xs text-slate-500 truncate">${esc(l.note||'')}</div></div>
                <div class="text-right shrink-0"><div class="text-sm font-semibold">${money(l.price)}</div><span class="text-[11px] px-2 py-0.5 rounded-full border ${statusClasses[l.status]||''}">${esc(statusLabels[l.status]||l.status)}</span></div>
              </div>`;
              const payRow=(p)=>`<div class="flex items-center justify-between gap-2 py-2 border-b last:border-0"><div><div class="font-medium text-sm">${fmt(p.date)}</div><div class="text-xs text-slate-500">${esc(p.note||'')}</div></div><div class="font-semibold text-emerald-600">+${money(p.amount)}</div></div>`;
              return `<div class="border rounded-2xl p-5 bg-white shadow-sm ${bal<0?'border-red-200 bg-red-50/30':''}">
                <div class="flex justify-between gap-3 items-start">
                  <div><h3 class="font-bold text-xl text-slate-900">${esc(name)}</h3><p class="text-sm text-slate-500 mt-1">Занятие: <b>${money(price)}</b></p></div>
                  <div class="flex gap-1"><button onclick="editStudent('${escName(name)}')" class="px-2 py-1 text-xs rounded-lg bg-slate-100">Изменить</button><button onclick="deleteStudent('${escName(name)}')" class="px-2 py-1 text-xs rounded-lg bg-red-50 text-red-600">Удалить</button></div>
                </div>
                <div class="grid grid-cols-2 gap-2 mt-4">
                  <div class="rounded-xl bg-slate-50 p-3"><div class="text-xs text-slate-500">Баланс</div><div class="text-xl font-bold ${bal<0?'text-red-600':'text-slate-900'}">${money(bal)}</div></div>
                  <div class="rounded-xl bg-slate-50 p-3"><div class="text-xs text-slate-500">Занятий проведено</div><div class="text-xl font-bold">${past.filter(l=>l.status==='conducted').length}</div></div>
                  <div class="rounded-xl bg-slate-50 p-3"><div class="text-xs text-slate-500">Приходы</div><div class="font-bold text-emerald-600">${money(paid)}</div></div>
                  <div class="rounded-xl bg-slate-50 p-3"><div class="text-xs text-slate-500">Списания</div><div class="font-bold">${money(spent)}</div></div>
                </div>
                <div class="mt-5"><h4 class="font-semibold mb-2">Запланировано <span class="text-xs text-slate-400">(${planned.length})</span></h4><div class="text-sm">${planned.length?planned.map(lessonRow).join(''):'<div class="text-slate-400 text-sm">Нет запланированных занятий</div>'}</div></div>
                <div class="mt-5"><h4 class="font-semibold mb-2">Прошедшие занятия <span class="text-xs text-slate-400">(${past.length})</span></h4><div>${past.length?past.map(lessonRow).join(''):'<div class="text-slate-400 text-sm">Нет занятий</div>'}</div></div>
                <div class="mt-5"><h4 class="font-semibold mb-2">Приходы <span class="text-xs text-slate-400">(${pays.length})</span></h4><div>${pays.length?pays.map(payRow).join(''):'<div class="text-slate-400 text-sm">Нет платежей</div>'}</div></div>
              </div>`;
            }).join('');
          }

          function openStudentCabinetLink(name){
            // Student cards now contain all teacher information on the same page.
            switchTab('students');
          }

          function bootFlatStudentCards(){
            hideStudentCabinetUi();
            const nav=document.getElementById('nav-calendar');
            if(nav){nav.textContent='Занятия';}
            // Keep teacher CRM as the only visible workspace.
            const sv=document.getElementById('student-view');
            if(sv)sv.remove();
            const pm=document.getElementById('student-pin-modal');
            if(pm)pm.remove();
            try{renderStudents();}catch(e){console.error(e);}
          }

          const _oldAddLesson=window.addLesson;
          // Make lesson creation show the actual RLS error without leaving a stale modal state.
          const _oldSaveLesson=window.saveLesson;
          if(typeof _oldSaveLesson==='function'){
            window.saveLesson=async function(){
              try{return await _oldSaveLesson.apply(this,arguments);}
              catch(e){showError(e);throw e;}
            };
          }

          const _oldSwitchTab=window.switchTab;
          window.switchTab=function(t){
            hideStudentCabinetUi();
            if(typeof _oldSwitchTab==='function')_oldSwitchTab(t);
            if(t==='students')setTimeout(renderStudents,0);
          };

          document.addEventListener('DOMContentLoaded',()=>setTimeout(bootFlatStudentCards,0));
          setTimeout(bootFlatStudentCards,300);
          </script>'''
          s=s.replace('</body>',patch+'\n</body>')
          p.write_text(s,encoding='utf-8')
          PY

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Replace student cabinet with full student cards"
          git push
