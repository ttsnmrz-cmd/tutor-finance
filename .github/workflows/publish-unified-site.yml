name: Publish unified Classroom to ProfiProfit
on:
  push:
    branches: [refactor-modules]
    paths: ['.github/workflows/publish-unified-site.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Pages repository
        uses: actions/checkout@v4
        with:
          ref: refactor-modules
          fetch-depth: 0
      - name: Preserve current finance app as legacy
        run: |
          rm -rf /tmp/legacy
          mkdir -p /tmp/legacy
          rsync -a --exclude='.git' --exclude='.github' --exclude='legacy' ./ /tmp/legacy/
      - name: Checkout Classroom source
        uses: actions/checkout@v4
        with:
          repository: ttsnmrz-cmd/my-english-classroom
          ref: feature/unified-student-platform-2026-11-22
          path: _classroom
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build Classroom against ProfiProfit Supabase
        working-directory: _classroom/source/app
        env:
          VITE_SUPABASE_URL: https://dmasuczggcxzrxasgoov.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_nXL_z4-dtwKcGXmMAXgJSg_v1Op_W1q
          VITE_LEARNING_BACKEND: finance
        run: |
          npm install --no-package-lock
          npm run build
      - name: Replace public site and restore finance widgets under legacy
        run: |
          find . -mindepth 1 -maxdepth 1 ! -name .git ! -name .github -exec rm -rf {} +
          cp -a _classroom/source/app/dist/. ./
          mkdir -p legacy
          cp -a /tmp/legacy/. legacy/
          printf 'profiprofit.com\n' > CNAME
          cp index.html 404.html
          sed -i 's|href="/|href="/legacy/|g; s|src="/|src="/legacy/|g' legacy/classroom.html
      - name: Commit unified production site
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "deploy: make Classroom the main ProfiProfit app"
          git push origin refactor-modules
