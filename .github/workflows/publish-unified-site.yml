name: Publish unified Classroom to ProfiProfit
on:
  push:
    branches: [refactor-modules]
    paths: ['.github/workflows/publish-unified-site.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor-modules
          fetch-depth: 0
      - name: Download verified unified build
        run: |
          curl -fL 'https://sdmntprnortheu.oaiusercontent.com/files/00000000-90ec-81f4-b967-c7c1212cf147/raw?se=2026-11-22T17%3A33%3A52Z&sp=r&sv=2026-06-06&sr=b&scid=918dae2b-181c-5504-9615-d7406979473f&skoid=e32cbaad-a1eb-4299-9f16-1b364ab43781&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-11-22T08%3A21%3A33Z&ske=2026-11-23T08%3A21%3A33Z&sks=b&skv=2026-06-06&sig=yPapeHkRZo4dXfIcwqLAScMvXX1V/fEAfIv7vbyndCc%3D' -o /tmp/site.zip
          rm -rf /tmp/site && mkdir /tmp/site
          unzip -q /tmp/site.zip -d /tmp/site
          test -f /tmp/site/index.html
          test -f /tmp/site/legacy/classroom.html
      - name: Replace production site atomically
        run: |
          find . -mindepth 1 -maxdepth 1 ! -name .git ! -name .github -exec rm -rf {} +
          cp -a /tmp/site/. ./
          printf 'profiprofit.com\n' > CNAME
          cp index.html 404.html
          rm -f legacy/CNAME
      - name: Commit production site
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "deploy: make Classroom the main ProfiProfit app"
          git push origin refactor-modules
