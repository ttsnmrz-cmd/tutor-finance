name: One-time lesson time format
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  update-time-format:
    if: ${{ !startsWith(github.event.head_commit.message, '[time-format]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update lesson time UI
        run: |
          python3 <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          s=s.replace('type="time" step="1800" class="soft-input mt-1 w-full rounded-xl px-3 py-2"','type="text" inputmode="numeric" maxlength="5" autocomplete="off" placeholder="15.00" onblur="formatTimeField(this)" class="soft-input mt-1 w-full rounded-xl px-3 py-2"')
          s=s.replace('type="time" step="1800" class="soft-input rounded-xl px-3 py-2"','type="text" inputmode="numeric" maxlength="5" autocomplete="off" placeholder="15.00" onblur="formatTimeField(this)" class="soft-input rounded-xl px-3 py-2"')
          marker="function showError(e){console.error(e);const b=document.getElementById('error-box');b.textContent='Ошибка: '+(e.message||e);b.classList.remove('hidden');setTimeout(()=>b.classList.add('hidden'),5000);}\n"
          helpers="""function normalizeTimeInput(value){const v=String(value||'').trim().replace(':','.');if(!v)return null;const m=v.match(/^(\\d{1,2})\\.(\\d{2})$/);if(!m)return null;const h=Number(m[1]),min=Number(m[2]);if(h<7||h>23||min<0||min>59||min%5!==0||(h===23&&min>0))return null;return String(h).padStart(2,'0')+':'+String(min).padStart(2,'0');}\nfunction displayTime(value){if(!value)return '';const v=String(value).trim().replace(':','.');const m=v.match(/^(\\d{1,2})\\.(\\d{2})$/);if(!m)return value;return String(Number(m[1])).padStart(2,'0')+'.'+m[2];}\nfunction formatTimeField(el){const v=String(el.value||'').trim().replace(':','.');if(!v){el.value='';return;}const m=v.match(/^(\\d{1,2})[.:]?(\\d{2})$/);if(m)el.value=String(Number(m[1])).padStart(2,'0')+'.'+m[2];}\nfunction requireValidTime(value){const normalized=normalizeTimeInput(value);if(value&&!normalized){showError(new Error('Время должно быть от 07.00 до 23.00 с шагом 5 минут, например 15.05'));return null;}return normalized;}\n"""
          if marker not in s: raise SystemExit('marker not found')
          if 'function normalizeTimeInput' not in s: s=s.replace(marker,marker+helpers,1)
          old="""async function addLessonFromPanel(){try{const student=document.getElementById('new-lesson-student').value,date=document.getElementById('new-lesson-date').value,time=document.getElementById('new-lesson-time').value,price=Number(document.getElementById('new-lesson-price').value);if(!student||!date){showError(new Error('Выберите ученика и дату'));return;}await db('/lessons',{method:'POST',headers:{...headers,Prefer:'return=minimal'},body:JSON.stringify({student,date,time:time||null,price,status:'pending'})});await loadData();renderMain();renderWeek();document.getElementById('new-lesson-date').value='';document.getElementById('new-lesson-time').value='';}catch(e){showError(e);}}"""
          new="""async function addLessonFromPanel(){try{const student=document.getElementById('new-lesson-student').value,date=document.getElementById('new-lesson-date').value,rawTime=document.getElementById('new-lesson-time').value,price=Number(document.getElementById('new-lesson-price').value),time=requireValidTime(rawTime);if(rawTime&&!time)return;if(!student||!date){showError(new Error('Выберите ученика и дату'));return;}await db('/lessons',{method:'POST',headers:{...headers,Prefer:'return=minimal'},body:JSON.stringify({student,date,time,price,status:'pending'})});await loadData();renderMain();renderWeek();document.getElementById('new-lesson-date').value='';document.getElementById('new-lesson-time').value='';}catch(e){showError(e);}}"""
          if old not in s: raise SystemExit('add function not found')
          s=s.replace(old,new,1)
          s=s.replace("document.getElementById('edit-time').value=l.time||'';","document.getElementById('edit-time').value=displayTime(l.time||'');",1)
          old="time:document.getElementById('edit-time').value||null,price:Number(document.getElementById('edit-price').value),status:document.getElementById('edit-status').value"
          if old not in s: raise SystemExit('edit payload not found')
          s=s.replace("async function saveEditedLesson(){try{const id=document.getElementById('edit-id').value;await db('/lessons?id=eq.'+encodeURIComponent(id),{", "async function saveEditedLesson(){try{const id=document.getElementById('edit-id').value,rawTime=document.getElementById('edit-time').value,time=requireValidTime(rawTime);if(rawTime&&!time)return;await db('/lessons?id=eq.'+encodeURIComponent(id),{",1)
          s=s.replace(old,"time,price:Number(document.getElementById('edit-price').value),status:document.getElementById('edit-status').value",1)
          s=s.replace('${esc(l.time||\'—\')}','${esc(displayTime(l.time)||\'—\')}',2)
          s=s.replace("${esc(l.date)}${l.time?' · '+esc(l.time):''}","${esc(l.date)}${l.time?' · '+esc(displayTime(l.time)):''}",2)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit and remove one-time workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/one-time-time-format.yml
          git add index.html .github/workflows/one-time-time-format.yml
          git diff --cached --quiet && exit 0
          git commit -m "[time-format] Use 5-minute lesson time increments"
          git push
