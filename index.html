<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Учет занятий и финансов репетитора</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- Supabase JS Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-gray-50 min-h-screen text-gray-800 flex flex-col items-center justify-start p-4 md:p-8">

    <div class="max-w-4xl w-full bg-white rounded-2xl shadow-xl p-6 md:p-8 border border-gray-100">
        
        <!-- Заголовок -->
        <header class="flex justify-between items-center mb-8 border-b pb-4">
            <div>
                <h1 class="text-2xl font-bold text-indigo-600">📚 Tutor Finance</h1>
                <p id="subtitle" class="text-sm text-gray-500">Загрузка данных...</p>
            </div>
            <div id="auth-status"></div>
        </header>

        <!-- Контент для преподавателя (скрыт по умолчанию, пока не вошли) -->
        <div id="teacher-view" class="hidden space-y-6">
            <div class="bg-indigo-50 p-4 rounded-xl border border-indigo-100 flex justify-between items-center">
                <div>
                    <h2 class="font-semibold text-indigo-900">Режим преподавателя</h2>
                    <p class="text-xs text-indigo-700">Вы управляете балансами и уроками всех учеников</p>
                </div>
                <button onclick="logoutTeacher()" class="bg-white border border-indigo-200 text-indigo-600 px-3 py-1.5 rounded-lg text-sm font-medium hover:bg-indigo-100 transition">Выйти</button>
            </div>

            <!-- Блок добавления баланса / урока -->
            <div class="bg-gray-50 p-5 rounded-xl border border-gray-200">
                <h3 class="font-semibold text-lg mb-3">Добавить занятие / оплату</h3>
                <div class="grid grid-cols-1 md:grid-cols-3 gap-3">
                    <input type="text" id="student-name" placeholder="Имя ученика (например, Мария)" class="border rounded-lg px-3 py-2 bg-white text-sm">
                    <input type="number" id="lesson-amount" placeholder="Сумма (например, -1500 или +5000)" class="border rounded-lg px-3 py-2 bg-white text-sm">
                    <input type="text" id="lesson-desc" placeholder="Описание (Урок №1 / Предоплата)" class="border rounded-lg px-3 py-2 bg-white text-sm">
                </div>
                <button onclick="addTransaction()" class="mt-3 bg-indigo-600 hover:bg-indigo-700 text-white font-medium px-4 py-2 rounded-lg text-sm transition">Сохранить в базу</button>
            </div>

            <!-- Список всех учеников -->
            <div>
                <h3 class="font-semibold text-lg mb-3">Список учеников и ссылки</h3>
                <div id="students-list" class="space-y-2">
                    <!-- Заполняется через JS -->
                </div>
            </div>
        </div>

        <!-- Контент для ученика (если открыто по ссылке ?student=...) -->
        <div id="student-view" class="hidden space-y-6">
            <div class="bg-emerald-50 p-6 rounded-2xl border border-emerald-100 flex flex-col md:flex-row justify-between items-center gap-4">
                <div>
                    <h2 class="text-xl font-bold text-emerald-900" id="student-greeting">Привет!</h2>
                    <p class="text-sm text-emerald-700">Твой текущий баланс занятий</p>
                </div>
                <div class="text-3xl font-black text-emerald-600 bg-white px-6 py-3 rounded-xl shadow-sm border border-emerald-200" id="student-balance">
                    0 ₽
                </div>
            </div>

            <div>
                <h3 class="font-semibold text-lg mb-3">История занятий и пополнений</h3>
                <div id="student-history" class="space-y-2">
                    <!-- Заполняется через JS -->
                </div>
            </div>
        </div>

        <!-- Кнопка входа для преподавателя (если нет параметров в ссылке) -->
        <div id="login-container" class="text-center py-12">
            <p class="text-gray-500 mb-4">Вы ученик или преподаватель?</p>
            <button onclick="showTeacherLogin()" class="bg-gray-800 hover:bg-gray-900 text-white font-medium px-6 py-2.5 rounded-xl transition text-sm">Войти как преподаватель</button>
        </div>

    </div>

    <!-- Модальное окно входа преподавателя -->
    <div id="teacher-modal" class="fixed inset-0 bg-black/50 hidden items-center justify-center p-4">
        <div class="bg-white rounded-2xl max-w-sm w-full p-6 shadow-2xl">
            <h3 class="text-lg font-bold mb-4">Вход для преподавателя</h3>
            <input type="password" id="teacher-pin" placeholder="Введите пин-код (по умолчанию: 1234)" class="w-full border rounded-lg px-3 py-2 mb-4 text-sm">
            <div class="flex justify-end gap-2">
                <button onclick="closeTeacherLogin()" class="px-4 py-2 text-sm text-gray-500 hover:bg-gray-100 rounded-lg">Отмена</button>
                <button onclick="verifyTeacherPin()" class="px-4 py-2 text-sm bg-indigo-600 text-white font-medium rounded-lg hover:bg-indigo-700">Войти</button>
            </div>
        </div>
    </div>

    <!-- Скрипты инициализации Supabase и логики -->
    <script>
        // Инициализация Supabase с вашими ключами
        const SUPABASE_URL = 'https://dmasuczggcxzrxasgoov.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_nXL_z4-dtwKcGXmMAXgJSg_v1Op_W1q';
        const { createClient } = supabase;
        const _supabase = createClient(SUPABASE_URL, SUPABASE_KEY);

        // Читаем параметры из ссылки (например, ?student=Мария)
        const urlParams = new URLSearchParams(window.location.search);
        const studentName = urlParams.get('student');

        document.addEventListener('DOMContentLoaded', async () => {
            if (studentName) {
                // Если открыл ученик
                document.getElementById('login-container').classList.add('hidden');
                document.getElementById('student-view').classList.remove('hidden');
                document.getElementById('subtitle').textContent = `Кабинет ученика: ${studentName}`;
                document.getElementById('student-greeting').textContent = `Привет, ${studentName}!`;
                await loadStudentData(studentName);
            } else if (localStorage.getItem('is_teacher') === 'true') {
                // Если преподаватель уже залогинен в этом браузере
                openTeacherDashboard();
            }
        });

        // Загрузка данных ученика
        async function loadStudentData(name) {
            const { data, error } = await _supabase
                .from('transactions')
                .select('*')
                .ilike('student', name)
                .order('created_at', { ascending: false });

            if (error) {
                console.error('Ошибка загрузки:', error);
                return;
            }

            let balance = 0;
            const historyContainer = document.getElementById('student-history');
            historyContainer.innerHTML = '';

            if (data.length === 0) {
                historyContainer.innerHTML = '<p class="text-sm text-gray-400">Пока нет записей о занятиях.</p>';
            }

            data.forEach(item => {
                balance += Number(item.amount);
                const dateStr = new Date(item.created_at).toLocaleDateString('ru-RU');
                
                const div = document.createElement('div');
                div.className = "flex justify-between items-center bg-gray-50 p-3 rounded-xl border border-gray-100 text-sm";
                div.innerHTML = `
                    <div>
                        <span class="font-medium">${item.description || 'Занятие'}</span>
                        <span class="text-xs text-gray-400 block">${dateStr}</span>
                    </div>
                    <span class="font-semibold ${item.amount > 0 ? 'text-emerald-600' : 'text-gray-700'}">${item.amount > 0 ? '+' + item.amount : item.amount} ₽</span>
                `;
                historyContainer.appendChild(div);
            });

            document.getElementById('student-balance').textContent = `${balance} ₽`;
        }

        // Функции модального окна преподавателя
        function showTeacherLogin() {
            document.getElementById('teacher-modal').classList.remove('hidden');
            document.getElementById('teacher-modal').classList.add('flex');
        }

        function closeTeacherLogin() {
            document.getElementById('teacher-modal').classList.add('hidden');
            document.getElementById('teacher-modal').classList.remove('flex');
        }

        function verifyTeacherPin() {
            const pin = document.getElementById('teacher-pin').value;
            if (pin === '1234') { // Пин-код можно поменять здесь
                localStorage.setItem('is_teacher', 'true');
                closeTeacherLogin();
                openTeacherDashboard();
            } else {
                alert('Неверный пин-код!');
            }
        }

        function logoutTeacher() {
            localStorage.removeItem('is_teacher');
            location.reload();
        }

        async function openTeacherDashboard() {
            document.getElementById('login-container').classList.add('hidden');
            document.getElementById('teacher-view').classList.remove('hidden');
            document.getElementById('subtitle').textContent = 'Панель управления преподавателя';
            await loadTeacherDashboard();
        }

        // Загрузка панели преподавателя (список всех учеников)
        async function loadTeacherDashboard() {
            const { data, error } = await _supabase
                .from('transactions')
                .select('*')
                .order('created_at', { ascending: false });

            if (error) return;

            // Группируем по ученикам
            const studentsMap = {};
            data.forEach(item => {
                if (!studentsMap[item.student]) studentsMap[item.student] = 0;
                studentsMap[item.student] += Number(item.amount);
            });

            const listContainer = document.getElementById('students-list');
            listContainer.innerHTML = '';

            const keys = Object.keys(studentsMap);
            if (keys.length === 0) {
                listContainer.innerHTML = '<p class="text-sm text-gray-400">Пока нет ни одного ученика. Добавьте первую запись выше.</p>';
                return;
            }

            keys.forEach(student => {
                const balance = studentsMap[student];
                const currentUrl = window.location.href.split('?')[0];
                const studentLink = `${currentUrl}?student=${encodeURIComponent(student)}`;

                const div = document.createElement('div');
                div.className = "flex flex-col md:flex-row justify-between items-start md:items-center bg-gray-50 p-4 rounded-xl border border-gray-200 gap-3";
                div.innerHTML = `
                    <div>
                        <span class="font-bold text-gray-900">${student}</span>
                        <span class="text-xs block text-gray-500">Баланс: <strong class="${balance >= 0 ? 'text-emerald-600' : 'text-red-600'}">${balance} ₽</strong></span>
                    </div>
                    <div class="flex items-center gap-2 w-full md:w-auto">
                        <input type="text" readonly value="${studentLink}" class="bg-white border rounded px-2 py-1 text-xs w-full md:w-64 text-gray-500 select-all">
                        <button onclick="navigator.clipboard.writeText('${studentLink}'); alert('Ссылка скопирована!');" class="bg-indigo-50 text-indigo-600 border border-indigo-200 px-3 py-1 rounded text-xs font-medium hover:bg-indigo-100 transition whitespace-nowrap">Копировать</button>
                    </div>
                `;
                listContainer.appendChild(div);
            });
        }

        // Добавление новой транзакции (урока или оплаты) в базу
        async function addTransaction() {
            const student = document.getElementById('student-name').value.trim();
            const amount = document.getElementById('lesson-amount').value.trim();
            const description = document.getElementById('lesson-desc').value.trim();

            if (!student || !amount) {
                alert('Заполните имя ученика и сумму!');
                return;
            }

            const { error } = await _supabase
                .from('transactions')
                .insert([{ student, amount: Number(amount), description }]);

            if (error) {
                alert('Ошибка при сохранении: ' + error.message);
            } else {
                document.getElementById('student-name').value = '';
                document.getElementById('lesson-amount').value = '';
                document.getElementById('lesson-desc').value = '';
                await loadTeacherDashboard();
                alert('Успешно сохранено!');
            }
        }
    </script>
</body>
</html>
