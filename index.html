<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ProfiProfit</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <!-- Babel для компиляции JSX прямо в браузере -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-gray-50 text-gray-900 font-sans pb-24">

    <div id="root"></div>

    <script type="text/babel">
        function App() {
            const [activeTab, setActiveTab] = React.useState('calendar');

            return (
                <div className="min-h-screen bg-gray-50 text-gray-900 font-sans pb-24">
                    {/* Шапка */}
                    <header className="bg-white border-b border-gray-100 px-6 py-4 flex justify-between items-center sticky top-0 z-40">
                        <div className="flex items-center space-x-3">
                            <div className="w-10 h-10 rounded-full bg-indigo-900 flex items-center justify-center text-white font-bold shadow-sm">
                                PP
                            </div>
                            <span className="text-xl font-bold tracking-tight text-indigo-950">ProfiProfit</span>
                        </div>

                        <nav className="flex space-x-2 bg-gray-100 p-1 rounded-xl">
                            <button
                                onClick={() => setActiveTab('calendar')}
                                className={`px-4 py-1.5 rounded-lg text-sm font-medium transition ${
                                    activeTab === 'calendar' ? 'bg-white text-indigo-600 shadow-sm' : 'text-gray-600 hover:text-gray-900'
                                }`}
                            >
                                Занятия
                            </button>
                            <button
                                onClick={() => setActiveTab('students')}
                                className={`px-4 py-1.5 rounded-lg text-sm font-medium transition ${
                                    activeTab === 'students' ? 'bg-white text-indigo-600 shadow-sm' : 'text-gray-600 hover:text-gray-900'
                                }`}
                            >
                                Ученики & Финансы
                            </button>
                        </nav>
                    </header>

                    {/* Контент */}
                    <main className="max-w-xl mx-auto p-4 sm:p-6">
                        {activeTab === 'calendar' ? <LessonsCalendar /> : <StudentsFinances />}
                    </main>

                    {/* Плавающая кнопка */}
                    <FloatingAddMenu />
                </div>
            );
        }

        function LessonsCalendar() {
            const [selectedDate, setSelectedDate] = React.useState('2026-09-23');
            const [viewMode, setViewMode] = React.useState('day');

            const weekDays = [
                { date: '2026-09-21', day: 'ПН', num: '21', hasDot: false },
                { date: '2026-09-22', day: 'ВТ', num: '22', hasDot: false },
                { date: '2026-09-23', day: 'СР', num: '23', hasDot: true },
                { date: '2026-09-24', day: 'ЧТ', num: '24', hasDot: true },
                { date: '2026-09-25', day: 'ПТ', num: '25', hasDot: false },
                { date: '2026-09-26', day: 'СБ', num: '26', hasDot: false },
                { date: '2026-09-27', day: 'ВС', num: '27', hasDot: false },
            ];

            return (
                <div>
                    <div className="flex justify-between items-center mb-6">
                        <div>
                            <h1 className="text-2xl font-bold text-gray-900">Занятия</h1>
                            <p className="text-sm text-gray-500">Сентябрь 2026</p>
                        </div>
                        <div className="bg-gray-200 p-1 rounded-full flex">
                            <button 
                                onClick={() => setViewMode('day')}
                                className={`px-4 py-1.5 rounded-full text-sm font-medium transition ${viewMode === 'day' ? 'bg-indigo-600 text-white shadow' : 'text-gray-600'}`}
                            >
                                День
                            </button>
                            <button 
                                onClick={() => setViewMode('all')}
                                className={`px-4 py-1.5 rounded-full text-sm font-medium transition ${viewMode === 'all' ? 'bg-indigo-600 text-white shadow' : 'text-gray-600'}`}
                            >
                                Все
                            </button>
                        </div>
                    </div>

                    <div className="flex justify-between items-center text-xs text-gray-500 mb-3 px-1">
                        <button className="hover:text-gray-800">← Неделя</button>
                        <span className="font-semibold text-indigo-600">Сегодня</span>
                        <button className="hover:text-gray-800">Неделя →</button>
                    </div>

                    <div className="flex justify-between mb-8">
                        {weekDays.map((item) => {
                            const isSelected = selectedDate === item.date;
                            return (
                                <button
                                    key={item.date}
                                    onClick={() => setSelectedDate(item.date)}
                                    className={`flex flex-col items-center justify-center w-12 h-16 rounded-full transition ${
                                        isSelected ? 'bg-indigo-600 text-white shadow-lg' : 'bg-white text-gray-800 hover:bg-gray-100 border border-gray-100'
                                    }`}
                                >
                                    <span className={`text-[10px] mb-0.5 ${isSelected ? 'text-indigo-200' : 'text-gray-400'}`}>{item.day}</span>
                                    <span className="text-base font-bold">{item.num}</span>
                                    <span className="h-1 w-1 mt-1">
                                        {item.hasDot && (
                                            <span className={`block h-1 w-1 rounded-full ${isSelected ? 'bg-white' : 'bg-indigo-600'}`}></span>
                                        )}
                                    </span>
                                </button>
                            );
                        })}
                    </div>

                    <div className="space-y-4">
                        <div className="bg-white p-5 rounded-2xl shadow-sm border border-gray-100 cursor-pointer hover:shadow-md transition">
                            <div className="flex justify-between items-start mb-2">
                                <h3 className="text-lg font-bold text-gray-900">Денис М.</h3>
                                <span className="text-base font-semibold text-gray-900">40.00 BYN</span>
                            </div>
                            <div className="flex justify-between items-center">
                                <div className="flex items-center space-x-2 text-sm text-gray-500">
                                    <span>11:00</span>
                                    <span>•</span>
                                    <span className="bg-gray-100 px-2 py-0.5 rounded text-xs">60 мин</span>
                                </div>
                                <span className="text-sm font-medium text-emerald-600">Проведено</span>
                            </div>
                        </div>

                        <div className="bg-white p-5 rounded-2xl shadow-sm border border-gray-100 cursor-pointer hover:shadow-md transition">
                            <div className="flex justify-between items-start mb-2">
                                <h3 className="text-lg font-bold text-gray-900">Группа "Intermediate B2"</h3>
                                <span className="text-base font-semibold text-gray-900">65.00 BYN</span>
                            </div>
                            <div className="flex justify-between items-center mb-4">
                                <div className="flex items-center space-x-2 text-sm text-gray-500">
                                    <span>15:30</span>
                                    <span>•</span>
                                    <span className="bg-gray-100 px-2 py-0.5 rounded text-xs">45 мин</span>
                                    <span className="bg-indigo-50 text-indigo-600 px-2 py-0.5 rounded text-xs font-semibold">ГРУППА</span>
                                </div>
                                <span className="text-sm font-medium text-gray-400 italic">Запланировано</span>
                            </div>

                            <div className="border-t border-gray-100 pt-3 space-y-2">
                                <div className="flex justify-between items-center text-sm">
                                    <div className="flex items-center space-x-2">
                                        <input type="checkbox" defaultChecked className="rounded text-indigo-600 focus:ring-indigo-500" />
                                        <span className="text-gray-800">Алексей Р.</span>
                                    </div>
                                    <span className="text-gray-600 font-medium">35.00 BYN</span>
                                </div>
                                <div className="flex justify-between items-center text-sm">
                                    <div className="flex items-center space-x-2">
                                        <input type="checkbox" defaultChecked className="rounded text-indigo-600 focus:ring-indigo-500" />
                                        <span className="text-gray-800">Марина В.</span>
                                    </div>
                                    <span className="text-gray-600 font-medium">30.00 BYN</span>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            );
        }

        function StudentsFinances() {
            return (
                <div className="space-y-3">
                    <h1 className="text-2xl font-bold text-gray-900 mb-4">Ученики и финансы</h1>

                    <div className="bg-white rounded-2xl p-4 shadow-sm border border-gray-100">
                        <div className="flex items-center justify-between mb-4">
                            <div className="flex items-center space-x-3">
                                <div className="w-10 h-10 rounded-full bg-gray-900 text-white flex items-center justify-center font-bold">M</div>
                                <div>
                                    <h2 className="text-lg font-bold text-gray-900">Maria</h2>
                                    <span className="text-xs text-indigo-600 font-medium">Группа: Speaking Club Saturday</span>
                                </div>
                            </div>
                            <div className="flex items-center space-x-3">
                                <span className="px-3 py-1 bg-emerald-100 text-emerald-700 font-bold rounded-lg text-sm">120</span>
                                <button className="text-gray-400 hover:text-gray-600 font-bold">⋮</button>
                            </div>
                        </div>

                        <div className="bg-gray-50 rounded-xl p-4 text-sm space-y-2 border border-gray-100">
                            <div className="flex justify-between text-gray-600"><span>Проведенных занятий:</span><span className="font-semibold text-gray-900">15</span></div>
                            <div className="flex justify-between text-gray-600"><span>Стоимость за занятие:</span><span className="font-semibold text-gray-900">40 BYN</span></div>
                            <div className="flex justify-between text-gray-600"><span>Внесенных средств:</span><span className="font-semibold text-gray-900">400 BYN</span></div>
                            <div className="flex justify-between text-gray-600"><span>Списано:</span><span className="font-semibold text-pink-600">280 BYN</span></div>
                            <div className="flex justify-between text-gray-800 font-bold border-t border-gray-200 pt-2"><span>Баланс:</span><span className="text-emerald-600">120 BYN</span></div>

                            <div className="pt-3">
                                <p className="text-xs font-semibold text-gray-500 mb-2">Списания за занятия</p>
                                <div className="space-y-1 max-h-32 overflow-y-auto pr-1">
                                    {['2026-09-17', '2026-09-15', '2026-09-14'].map((date, idx) => (
                                        <div key={idx} className="flex justify-between text-xs py-1 border-b border-gray-100 text-gray-600">
                                            <span>{date}</span>
                                            <span className="font-medium text-gray-800">-40 BYN</span>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        </div>
                    </div>

                    <div className="bg-white rounded-2xl p-4 shadow-sm border border-gray-100 flex items-center justify-between">
                        <div className="flex items-center space-x-3">
                            <div className="w-10 h-10 rounded-full bg-emerald-600 text-white flex items-center justify-center font-bold">S</div>
                            <div>
                                <h2 className="text-lg font-bold text-gray-900">Stas</h2>
                                <span className="text-xs text-gray-400">Без группы</span>
                            </div>
                        </div>
                        <div className="flex items-center space-x-3">
                            <span className="px-3 py-1 bg-emerald-100 text-emerald-700 font-bold rounded-lg text-sm">240</span>
                            <button className="text-gray-400 hover:text-gray-600 font-bold">⋮</button>
                        </div>
                    </div>

                    <div className="bg-white rounded-2xl p-4 shadow-sm border border-gray-100 flex items-center justify-between">
                        <div className="flex items-center space-x-3">
                            <div className="w-10 h-10 rounded-full bg-rose-500 text-white flex items-center justify-center font-bold">D</div>
                            <div>
                                <h2 className="text-lg font-bold text-gray-900">Denis</h2>
                                <span className="text-xs text-gray-400">Без группы</span>
                            </div>
                        </div>
                        <div className="flex items-center space-x-3">
                            <span className="px-3 py-1 bg-rose-100 text-rose-700 font-bold rounded-lg text-sm">-60</span>
                            <button className="text-gray-400 hover:text-gray-600 font-bold">⋮</button>
                        </div>
                    </div>
                </div>
            );
        }

        function FloatingAddMenu() {
            const [isOpen, setIsOpen] = React.useState(false);
            const [activeSubMenu, setActiveSubMenu] = React.useState(null);

            return (
                <div className="fixed bottom-6 right-6 z-50">
                    {isOpen && (
                        <div className="absolute bottom-16 right-0 bg-white rounded-2xl shadow-xl border border-gray-100 p-2 w-64 mb-2 space-y-1">
                            <div>
                                <button 
                                    onClick={() => setActiveSubMenu(activeSubMenu === 'student' ? null : 'student')}
                                    className="w-full text-left px-4 py-2.5 rounded-xl hover:bg-gray-50 font-medium text-gray-800 flex justify-between items-center"
                                >
                                    <span>Ученика</span>
                                    <span className="text-xs text-gray-400">→</span>
                                </button>
                                {activeSubMenu === 'student' && (
                                    <div className="pl-4 pr-2 py-2 space-y-2 bg-gray-50 rounded-xl my-1">
                                        <input type="text" placeholder="Имя" className="w-full px-3 py-1.5 text-sm bg-white border border-gray-200 rounded-lg outline-none focus:border-indigo-500" />
                                        <input type="text" placeholder="PIN" className="w-full px-3 py-1.5 text-sm bg-white border border-gray-200 rounded-lg outline-none focus:border-indigo-500" />
                                        <input type="text" placeholder="Группа" className="w-full px-3 py-1.5 text-sm bg-white border border-gray-200 rounded-lg outline-none focus:border-indigo-500" />
                                    </div>
                                )}
                            </div>

                            <div>
                                <button 
                                    onClick={() => setActiveSubMenu(activeSubMenu === 'group' ? null : 'group')}
                                    className="w-full text-left px-4 py-2.5 rounded-xl hover:bg-gray-50 font-medium text-gray-800 flex justify-between items-center"
                                >
                                    <span>Группу</span>
                                    <span className="text-xs text-gray-400">→</span>
                                </button>
                                {activeSubMenu === 'group' && (
                                    <div className="pl-4 pr-2 py-2 space-y-2 bg-gray-50 rounded-xl my-1">
                                        <input type="text" placeholder="Название группы" className="w-full px-3 py-1.5 text-sm bg-white border border-gray-200 rounded-lg outline-none focus:border-indigo-500" />
                                    </div>
                                )}
                            </div>

                            <div>
                                <button 
                                    onClick={() => setActiveSubMenu(activeSubMenu === 'payment' ? null : 'payment')}
                                    className="w-full text-left px-4 py-2.5 rounded-xl hover:bg-gray-50 font-medium text-gray-800 flex justify-between items-center"
                                >
                                    <span>Платеж</span>
                                    <span className="text-xs text-gray-400">→</span>
                                </button>
                                {activeSubMenu === 'payment' && (
                                    <div className="pl-4 pr-2 py-2 space-y-2 bg-gray-50 rounded-xl my-1">
                                        <select className="w-full px-3 py-1.5 text-sm bg-white border border-gray-200 rounded-lg text-gray-600 outline-none">
                                            <option>Выбрать ученика</option>
                                        </select>
                                        <input type="number" placeholder="Сумма" className="w-full px-3 py-1.5 text-sm bg-white border border-gray-200 rounded-lg outline-none focus:border-indigo-500" />
                                        <input type="date" className="w-full px-3 py-1.5 text-sm bg-white border border-gray-200 rounded-lg text-gray-600 outline-none" />
                                    </div>
                                )}
                            </div>
                        </div>
                    )}

                    <button 
                        onClick={() => setIsOpen(!isOpen)}
                        className="w-14 h-14 bg-indigo-600 text-white rounded-full flex items-center justify-center shadow-lg hover:bg-indigo-700 transition transform hover:scale-105 focus:outline-none"
                    >
                        <span className={`text-2xl transition-transform duration-200 ${isOpen ? 'rotate-45' : ''}`}>+</span>
                    </button>
                </div>
            );
        }

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
