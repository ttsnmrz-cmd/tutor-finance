<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Tutor Finance — CRM репетитора</title>
<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  body{background:radial-gradient(circle at top left,#eef2ff 0,#f8fafc 35%,#f8fafc 100%)}
  .app-card{background:rgba(255,255,255,.92);border:1px solid rgba(148,163,184,.20);box-shadow:0 10px 35px rgba(15,23,42,.06);backdrop-filter:blur(10px)}
  .soft-input{border:1px solid #e2e8f0;background:#fff;transition:.18s;outline:none}
  .soft-input:focus{border-color:#818cf8;box-shadow:0 0 0 4px rgba(99,102,241,.10)}
  .primary-btn{background:linear-gradient(135deg,#6366f1,#4f46e5);box-shadow:0 7px 18px rgba(79,70,229,.20);transition:.18s}
  .primary-btn:hover{transform:translateY(-1px);box-shadow:0 10px 22px rgba(79,70,229,.25)}
  .student-card{transition:.18s;border:1px solid rgba(148,163,184,.20);box-shadow:0 8px 24px rgba(15,23,42,.055)}
  .student-card:hover{transform:translateY(-2px);box-shadow:0 14px 30px rgba(15,23,42,.09)}
  .lesson-scroll{max-height:220px;overflow-y:auto;padding-right:5px}
  .lesson-scroll::-webkit-scrollbar{width:6px}.lesson-scroll::-webkit-scrollbar-track{background:#f1f5f9;border-radius:99px}.lesson-scroll::-webkit-scrollbar-thumb{background:#c7d2fe;border-radius:99px}.lesson-scroll::-webkit-scrollbar-thumb:hover{background:#a5b4fc}
</style>
</head>
<body class="text-slate-800 min-h-screen">
<div class="max-w-7xl mx-auto p-4 md:p-6">
<header class="app-card rounded-3xl p-4 md:p-5 flex flex-wrap gap-3 justify-between items-center mb-6">
<div class="flex items-center gap-3"><div class="w-11 h-11 rounded-2xl bg-gradient-to-br from-indigo-500 to-violet-600 text-white flex items-center justify-center text-xl shadow-lg shadow-indigo-200">📚</div><div><h1 class="text-2xl font-bold tracking-tight">Tutor Finance</h1><p class="text-sm text-slate-500">CRM для занятий, учеников и оплат</p></div></div>
<nav class="flex flex-wrap gap-2"><button id="nav-calendar" onclick="switchTab('calendar')" class="px-4 py-2 rounded-xl bg-indigo-600 text-white font-semibold shadow-sm">Занятия</button><button id="nav-students" onclick="switchTab('students')" class="px-4 py-2 rounded-xl bg-slate-100 hover:bg-slate-200 font-semibold transition">Ученики</button><button id="nav-finance" onclick="switchTab('finance')" class="px-4 py-2 rounded-xl bg-slate-100 hover:bg-slate-200 font-semibold transition">Финансы</button><button onclick="teacherLogout()" class="px-4 py-2 rounded-xl bg-red-50 hover:bg-red-100 text-red-600 font-semibold transition">Выйти</button></nav>
</header>
<div id="teacher-login-modal" class="hidden fixed inset-0 bg-slate-950/40 backdrop-blur-sm z-50 items-center justify-center p-4"><div class="app-card rounded-3xl p-6 w-full max-w-sm space-y-3"><h2 class="text-xl font-bold">Вход преподавателя</h2><input id="teacher-email-input" type="email" value="ttsnmrz@gmail.com" class="soft-input w-full rounded-xl px-3 py-2"><input id="teacher-password-input" type="password" class="soft-input w-full rounded-xl px-3 py-2" placeholder="Пароль" onkeydown="if(event.key==='Enter')loginTeacher()"><button onclick="loginTeacher()" class="primary-btn w-full text-white rounded-xl py-2 font-semibold">Войти</button><p id="teacher-login-error" class="text-sm text-red-600"></p></div></div>
<div id="lesson-modal" class="hidden fixed inset-0 bg-slate-950/40 backdrop-blur-sm z-50 items-center justify-center p-4"><div class="app-card rounded-3xl p-6 w-full max-w-md space-y-3"><div class="flex justify-between"><h2 class="text-xl font-bold">Редактировать занятие</h2><button onclick="closeLessonModal()" class="text-2xl text-slate-400 hover:text-slate-700">×</button></div><input type="hidden" id="edit-id"><label class="text-sm font-semibold">Ученик<select id="edit-student" class="soft-input mt-1 w-full rounded-xl px-3 py-2"></select></label><label class="text-sm font-semibold block">Дата<input id="edit-date" type="date" class="soft-input mt-1 w-full rounded-xl px-3 py-2"></label><label class="text-sm font-semibold block">Стоимость<select id="edit-price" class="soft-input mt-1 w-full rounded-xl px-3 py-2"><option value="40">40 BYN</option><option value="20">20 BYN</option><option value="0">0 BYN</option></select></label><label class="text-sm font-semibold block">Статус<select id="edit-status" class="soft-input mt-1 w-full rounded-xl px-3 py-2"></select></label><div class="flex justify-between pt-2"><button onclick="deleteLessonFromModal()" class="px-4 py-2 rounded-xl bg-red-50 text-red-600 font-semibold">Удалить</button><button onclick="saveEditedLesson()" class="primary-btn px-5 py-2 rounded-xl text-white font-semibold">Сохранить</button></div></div></div>
<main id="teacher-view" class="hidden">
<section id="tab-calendar" class="space-y-5">
<div class="app-card rounded-3xl p-5"><div class="flex items-center gap-2 mb-4"><span class="text-xl">✨</span><h2 class="text-lg font-bold">Добавить занятие</h2></div><div class="grid grid-cols-1 md:grid-cols-4 gap-3"><select id="new-lesson-student" class="soft-input rounded-xl px-3 py-2"></select><input id="new-lesson-date" type="date" class="soft-input rounded-xl px-3 py-2"><select id="new-lesson-price" class="soft-input rounded-xl px-3 py-2"><option value="40">40 BYN</option><option value="20">20 BYN</option><option value="0">0 BYN</option></select><button onclick="addLessonFromPanel()" class="primary-btn text-white rounded-xl font-semibold">＋ Добавить занятие</button></div></div>
<div class="app-card rounded-3xl p-5"><div class="flex justify-between items-center mb-4"><div><h2 class="text-lg font-bold">Расписание</h2><p class="text-xs text-slate-400 mt-0.5">Все занятия и их текущие статусы</p></div><button onclick="loadData().then(renderMain)" class="px-3 py-2 rounded-xl bg-slate-100 hover:bg-slate-200 text-sm transition">Обновить</button></div><div class="overflow-x-auto"><table class="w-full text-sm"><thead><tr class="text-left border-b text-slate-400"><th class="p-3">Дата занятия</th><th class="p-3">Имя ученика</th><th class="p-3">Стоимость</th><th class="p-3">Статус</th><th class="p-3 text-right">Действие</th></tr></thead><tbody id="main-lessons"></tbody></table></div></div>
</section>
<section id="tab-students" class="hidden space-y-5"><div class="app-card rounded-3xl p-5"><div class="flex items-center gap-2 mb-4"><span class="text-xl">👤</span><h2 class="font-bold">Новый ученик</h2></div><div class="grid grid-cols-1 md:grid-cols-3 gap-3"><input id="new-student-name" class="soft-input rounded-xl px-3 py-2" placeholder="Имя"><input id="new-student-pin" class="soft-input rounded-xl px-3 py-2" placeholder="PIN"><button onclick="addStudent()" class="primary-btn text-white rounded-xl font-semibold">Добавить</button></div></div><div id="students-container" class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-4"></div></section>
<section id="tab-finance" class="hidden space-y-5">
<div class="app-card rounded-3xl p-5"><div class="flex items-center gap-2 mb-4"><span class="text-xl">💰</span><h2 class="font-bold">Внести платеж от ученика</h2></div><div class="grid grid-cols-1 md:grid-cols-4 gap-3"><select id="payment-student" class="soft-input rounded-xl px-3 py-2 text-sm"></select><input id="payment-amount" type="number" min="0" step="0.01" class="soft-input rounded-xl px-3 py-2 text-sm" placeholder="Сумма"><input id="payment-date" type="date" class="soft-input rounded-xl px-3 py-2 text-sm"><button onclick="addPayment()" class="bg-emerald-600 hover:bg-emerald-700 text-white text-sm font-semibold rounded-xl transition shadow-sm">Внести оплату</button></div></div>
<div class="app-card rounded-3xl p-5"><div class="flex items-center gap-2 mb-4"><span class="text-xl">📊</span><h2 class="font-bold">Финансовый баланс учеников</h2></div><div id="finance-balances" class="grid grid-cols-1 md:grid-cols-2 gap-4"></div></div>
</section>
</main><div id="error-box" class="hidden fixed bottom-4 right-4 max-w-md bg-red-50 border border-red-200 text-red-700 p-4 rounded-xl shadow-lg"></div></div>
<script>
const SUPABASE_URL='https://dmasuczggcxzrxasgoov.supabase.co';const SUPABASE_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRtYXN1Y3pnZ2N4enJ4YXNnb292Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODk1NjcwODcsImV4cCI6MjEwNTE0MzA4N30.TQNP0LkzDQpysj3gvSz7w57cr0PaY1oVjyXpm9fsutI';const API=SUPABASE_URL+'/rest/v1';const headers={apikey:SUPABASE_KEY,Authorization:'Bearer '+SUPABASE_KEY,'Content-Type':'application/json'};const {createClient}=supabase;const supabaseClient=createClient(SUPABASE_URL,SUPABASE_KEY);let students=[],lessons=[],payments=[];const statusLabels={pending:'Запланировано',conducted:'Проведено',rescheduled:'Перенесено',cancelled_charge:'Отменено — списать',cancelled_free:'Отменено — не списывать'};const statusClass={pending:'bg-amber-100 text-amber-800',conducted:'bg-emerald-100 text-emerald-800',rescheduled:'bg-blue-100 text-blue-800',cancelled_charge:'bg-red-100 text-red-800',cancelled_free:'bg-slate-100 text-slate-700'};const charge=new Set(['conducted','cancelled_charge']);
function esc(v){return String(v??'').replace(/[&<>'\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));}function money(n){return Number(n||0).toLocaleString('ru-RU',{maximumFractionDigits:2})+' BYN';}function showError(e){console.error(e);const b=document.getElementById('error-box');b.textContent='Ошибка: '+(e.message||e);b.classList.remove('hidden');setTimeout(()=>b.classList.add('hidden'),5000);}
async function db(path,opt={}){const r=await fetch(API+path,{...opt,headers:{...headers,...(opt.headers||{})}});const text=await r.text();if(!r.ok)throw new Error(text||r.statusText);if(!text.trim())return null;try{return JSON.parse(text);}catch(e){throw new Error('Сервер вернул некорректный JSON: '+text.slice(0,200));}}
async function loadData(){[students,lessons,payments]=await Promise.all([db('/students?select=*'),db('/lessons?select=*'),db('/payments?select=*')]);students=students||[];lessons=lessons||[];payments=payments||[];}
function switchTab(t){['calendar','students','finance'].forEach(x=>{document.getElementById('tab-'+x).classList.toggle('hidden',x!==t);document.getElementById('nav-'+x).className='px-4 py-2 rounded-xl font-semibold transition '+(x===t?'bg-indigo-600 text-white shadow-sm':'bg-slate-100 hover:bg-slate-200');});if(t==='calendar')renderMain();if(t==='students')renderStudents();if(t==='finance')renderFinance();}function fillStudentSelects(){['new-lesson-student','edit-student','payment-student'].forEach(id=>{const el=document.getElementById(id);if(!el)return;el.innerHTML=students.map(s=>`<option value="${esc(s.name)}">${esc(s.name)}</option>`).join('');});}
function renderMain(){fillStudentSelects();const rows=[...lessons].sort((a,b)=>String(b.date).localeCompare(String(a.date)));const body=document.getElementById('main-lessons');if(!body)return;body.innerHTML=rows.length?rows.map(l=>`<tr class="border-b hover:bg-slate-50 transition"><td class="p-3">${esc(l.date)}</td><td class="p-3 font-medium">${esc(l.student)}</td><td class="p-3">${money(l.price)}</td><td class="p-3"><span class="px-2 py-1 rounded-lg text-xs font-semibold ${statusClass[l.status]||'bg-slate-100'}">${statusLabels[l.status]||esc(l.status)}</span></td><td class="p-3 text-right"><button onclick="openEditLesson('${esc(l.id)}')" class="text-indigo-600 hover:text-indigo-800 font-semibold mr-3">Редактировать</button><button onclick="deleteLesson('${esc(l.id)}')" class="text-red-600 hover:text-red-800 font-semibold">Удалить</button></td></tr>`).join(''):`<tr><td colspan="5" class="p-8 text-center text-slate-400">Занятий пока нет</td></tr>`;}
async function addLessonFromPanel(){try{const student=document.getElementById('new-lesson-student').value,date=document.getElementById('new-lesson-date').value,price=Number(document.getElementById('new-lesson-price').value);if(!student||!date){showError(new Error('Выберите ученика и дату'));return;}await db('/lessons',{method:'POST',headers:{...headers,Prefer:'return=minimal'},body:JSON.stringify({student,date,price,status:'pending'})});await loadData();renderMain();document.getElementById('new-lesson-date').value='';}catch(e){showError(e);}}
function openEditLesson(id){const l=lessons.find(x=>String(x.id)===String(id));if(!l)return;fillStudentSelects();document.getElementById('edit-id').value=l.id;document.getElementById('edit-student').value=l.student;document.getElementById('edit-date').value=l.date;document.getElementById('edit-price').value=String(Number(l.price));document.getElementById('edit-status').innerHTML=Object.entries(statusLabels).map(([k,v])=>`<option value="${k}">${v}</option>`).join('');document.getElementById('edit-status').value=l.status;document.getElementById('lesson-modal').classList.remove('hidden');document.getElementById('lesson-modal').classList.add('flex');}function closeLessonModal(){document.getElementById('lesson-modal').classList.add('hidden');document.getElementById('lesson-modal').classList.remove('flex');}async function saveEditedLesson(){try{const id=document.getElementById('edit-id').value;await db('/lessons?id=eq.'+encodeURIComponent(id),{method:'PATCH',headers:{...headers,Prefer:'return=minimal'},body:JSON.stringify({student:document.getElementById('edit-student').value,date:document.getElementById('edit-date').value,price:Number(document.getElementById('edit-price').value),status:document.getElementById('edit-status').value})});closeLessonModal();await loadData();renderMain();}catch(e){showError(e);}}async function deleteLesson(id){if(!confirm('Удалить занятие?'))return;try{await db('/lessons?id=eq.'+encodeURIComponent(id),{method:'DELETE',headers});await loadData();renderMain();}catch(e){showError(e);}}async function deleteLessonFromModal(){await deleteLesson(document.getElementById('edit-id').value);closeLessonModal();}
function renderStudents(){fillStudentSelects();const c=document.getElementById('students-container');c.innerHTML=students.map(s=>{const ls=lessons.filter(l=>l.student===s.name),income=payments.filter(p=>p.student===s.name).reduce((a,p)=>a+Number(p.amount||0),0),expenses=ls.filter(l=>charge.has(l.status)).reduce((a,l)=>a+Number(l.price||0),0),bal=income-expenses;const recent=[...ls].sort((a,b)=>String(b.date).localeCompare(String(a.date))).slice(0,8);return `<div class="student-card bg-white rounded-3xl p-5 overflow-hidden"><div class="flex justify-between items-start gap-3"><div><div class="flex items-center gap-2"><div class="w-9 h-9 rounded-xl bg-indigo-50 text-indigo-600 flex items-center justify-center font-bold">${esc(String(s.name).charAt(0).toUpperCase())}</div><h3 class="text-lg font-bold">${esc(s.name)}</h3></div><p class="text-sm text-slate-500 mt-2">Стоимость занятия: <span class="font-semibold text-slate-700">${money(s.price)}</span></p></div><span class="px-2.5 py-1 rounded-full text-xs font-bold ${bal>=0?'bg-emerald-50 text-emerald-700':'bg-red-50 text-red-700'}">${money(bal)}</span></div><div class="grid grid-cols-2 gap-2 mt-4 text-sm"><div class="rounded-2xl bg-slate-50 p-3"><span class="text-xs text-slate-400">Проведено</span><br><b>${ls.filter(l=>l.status==='conducted').length}</b></div><div class="rounded-2xl bg-slate-50 p-3"><span class="text-xs text-slate-400">Приход</span><br><b>${money(income)}</b></div><div class="rounded-2xl bg-slate-50 p-3"><span class="text-xs text-slate-400">Списано</span><br><b>${money(expenses)}</b></div><div class="rounded-2xl bg-indigo-50 p-3"><span class="text-xs text-indigo-400">Баланс</span><br><b class="text-indigo-700">${money(bal)}</b></div></div><div class="mt-4 pt-3 border-t border-slate-100"><div class="flex justify-between items-center mb-2"><span class="text-xs font-bold uppercase tracking-wide text-slate-400">Последние занятия</span><span class="text-xs text-slate-400">${ls.length} всего</span></div><div class="lesson-scroll">${recent.map(l=>`<div class="flex justify-between items-center gap-2 py-2 border-b border-slate-100 last:border-0 text-sm"><span class="text-slate-600">${esc(l.date)}</span><span class="text-right"><b class="text-slate-700">${money(l.price)}</b><span class="block text-[11px] text-slate-400">${statusLabels[l.status]}</span></span></div>`).join('')||'<span class="text-slate-400 text-sm">Занятий нет</span>'}</div></div></div>`}).join('')||'<div class="text-slate-400">Учеников пока нет</div>';}
async function addStudent(){try{const name=document.getElementById('new-student-name').value.trim();const pin=document.getElementById('new-student-pin').value.trim();if(!name||!pin){showError(new Error('Введите имя и PIN-код'));return;}await db('/students',{method:'POST',headers:{...headers,Prefer:'return=minimal'},body:JSON.stringify({name,pin,price:40})});await loadData();renderStudents();document.getElementById('new-student-name').value='';document.getElementById('new-student-pin').value='';}catch(e){showError(e);}}
function renderFinance(){fillStudentSelects();const c=document.getElementById('finance-balances');c.innerHTML=students.map(s=>{const totalPaid=payments.filter(p=>p.student===s.name).reduce((a,p)=>a+Number(p.amount||0),0);const spent=lessons.filter(l=>l.student===s.name&&charge.has(l.status)).reduce((a,l)=>a+Number(l.price||0),0);const balance=totalPaid-spent;return `<div class="p-4 bg-slate-50 rounded-2xl border border-slate-100 flex flex-col justify-between"><div><h4 class="font-bold text-base text-indigo-900">${esc(s.name)}</h4><div class="text-xs text-slate-500 mt-1">Всего внесено: <span class="font-semibold text-slate-700">${money(totalPaid)}</span></div><div class="text-xs text-slate-500">Списано за уроки: <span class="font-semibold text-slate-700">${money(spent)}</span></div></div><div class="mt-4 pt-3 border-t border-slate-200 flex justify-between items-center"><span class="text-xs font-medium text-slate-500">Баланс:</span><span class="text-lg font-bold ${balance>=0?'text-emerald-600':'text-red-600'}">${money(balance)}</span></div></div>`}).join('')||'<div class="text-slate-400">Учеников пока нет</div>';}
async function addPayment(){try{const student=document.getElementById('payment-student').value;const amount=Number(document.getElementById('payment-amount').value);const date=document.getElementById('payment-date').value;if(!student||!Number.isFinite(amount)||amount<=0||!date){showError(new Error('Выберите ученика, укажите сумму и дату'));return;}await db('/payments',{method:'POST',headers:{...headers,Prefer:'return=minimal'},body:JSON.stringify({student,amount,date})});document.getElementById('payment-amount').value='';await loadData();renderFinance();}catch(e){showError(e);}}
async function loginTeacher(){try{const {error}=await supabaseClient.auth.signInWithPassword({email:document.getElementById('teacher-email-input').value,password:document.getElementById('teacher-password-input').value});if(error)throw error;sessionStorage.setItem('auth_teacher','1');document.getElementById('teacher-login-modal').classList.add('hidden');document.getElementById('teacher-view').classList.remove('hidden');await loadData();switchTab('calendar');}catch(e){document.getElementById('teacher-login-error').textContent=e.message||'Ошибка входа';}}async function teacherLogout(){try{await supabaseClient.auth.signOut();}catch(e){}sessionStorage.removeItem('auth_teacher');location.reload();}
async function boot(){const {data}=await supabaseClient.auth.getSession();if(data.session||sessionStorage.getItem('auth_teacher')){document.getElementById('teacher-view').classList.remove('hidden');try{await loadData();switchTab('calendar');}catch(e){showError(e);}}else{document.getElementById('teacher-login-modal').classList.remove('hidden');document.getElementById('teacher-login-modal').classList.add('flex');}}document.addEventListener('DOMContentLoaded',boot);
</script>
<script id="hide-student-lessons-block-v1">(function(){function hideLessonsBlock(){const el=document.getElementById('tab-lessons');if(el)el.classList.add('hidden');}hideLessonsBlock();document.addEventListener('DOMContentLoaded',hideLessonsBlock);setTimeout(hideLessonsBlock,100);setTimeout(hideLessonsBlock,500);setTimeout(hideLessonsBlock,1000);})();</script>
</body></html>
