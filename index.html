<script id="clean-fixes-v1">
(function(){
  'use strict';

  function localISO(d){
    return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
  }

  /* ---------- Calendar: click empty day ---------- */
  function bindCalendarClicks(){
    const cal=document.getElementById('week-calendar');
    if(!cal || cal.dataset.cleanClicks==='1') return;
    cal.dataset.cleanClicks='1';

    cal.addEventListener('click',function(e){
      if(e.target.closest('.week-lesson')) return;
      const day=e.target.closest('.week-day');
      if(!day || !cal.contains(day)) return;

      const days=[...cal.children];
      const index=days.indexOf(day);
      if(index<0 || typeof startOfWeek!=='function') return;

      const d=startOfWeek(new Date(weekAnchor));
      d.setDate(d.getDate()+index);
      openNewLessonModal(localISO(d));
    });
  }

  /* ---------- Recurring lessons (без поля "Повторять до") ---------- */
  function ensureRecurringUI(){
    const modal=document.querySelector('#lesson-modal .app-card');
    const status=document.getElementById('edit-status');
    if(!modal || !status) return null;

    let box=document.getElementById('recurring-options');
    if(box) return box;

    box=document.createElement('div');
    box.id='recurring-options';
    box.className='hidden rounded-2xl border border-indigo-100 bg-indigo-50/60 p-3 space-y-3';
    box.innerHTML=
      '<label class="flex items-center gap-2 text-sm font-semibold cursor-pointer">'+
        '<input id="lesson-recurring" type="checkbox" class="w-4 h-4">'+
        '<span>Повторять занятие регулярно</span>'+
      '</label>'+
      '<div id="recurring-fields" class="hidden space-y-3">'+
        '<label class="text-sm font-semibold block">Как часто'+
          '<select id="recurring-frequency" class="soft-input mt-1 w-full rounded-xl px-3 py-2">'+
            '<option value="1">Каждую неделю</option>'+
            '<option value="2">Раз в 2 недели</option>'+
            '<option value="3">Раз в 3 недели</option>'+
            '<option value="4">Раз в 4 недели</option>'+
          '</select>'+
        '</label>'+
        '<div>'+
          '<div class="text-xs font-semibold text-slate-500 mb-2">По каким дням</div>'+
          '<div class="grid grid-cols-7 gap-1">'+
            [['1','Пн'],['2','Вт'],['3','Ср'],['4','Чт'],['5','Пт'],['6','Сб'],['0','Вс']]
              .map(x=>'<label class="flex flex-col items-center gap-1 text-[11px] text-slate-600"><input type="checkbox" class="rec-day" value="'+x[0]+'">'+x[1]+'</label>')
              .join('')+
          '</div>'+
        '</div>'+
        '<div class="text-[11px] text-slate-400">Занятия будут создаваться автоматически на год вперед (вы сможете удалить их в любой момент).</div>'+
      '</div>';

    status.parentElement.insertAdjacentElement('afterend',box);

    document.getElementById('lesson-recurring').addEventListener('change',function(){
      document.getElementById('recurring-fields').classList.toggle('hidden',!this.checked);
    });
    return box;
  }

  function resetRecurring(date){
    const box=ensureRecurringUI();
    if(!box) return;
    box.classList.remove('hidden');

    const cb=document.getElementById('lesson-recurring');
    const fields=document.getElementById('recurring-fields');
    const freq=document.getElementById('recurring-frequency');

    if(cb) cb.checked=false;
    if(fields) fields.classList.add('hidden');
    if(freq) freq.value='1';
    document.querySelectorAll('.rec-day').forEach(x=>x.checked=false);

    if(date){
      const d=new Date(date+'T12:00:00');
      const day=document.querySelector('.rec-day[value="'+d.getDay()+'"]');
      if(day) day.checked=true;
    }
  }

  window.openNewLessonModal=function(date){
    ensureRecurringUI();
    fillStudentSelects();

    document.getElementById('edit-id').value='';
    document.getElementById('edit-student').value='';
    document.getElementById('edit-date').value=date||'';
    document.getElementById('edit-time').value='';
    document.getElementById('edit-price').value='40';
    document.getElementById('edit-status').innerHTML=Object.entries(statusLabels)
      .map(([k,v])=>'<option value="'+k+'">'+v+'</option>').join('');
    document.getElementById('edit-status').value='pending';
    document.getElementById('lesson-modal-title').textContent='Добавить занятие';
    document.getElementById('lesson-save-btn').textContent='Добавить';

    resetRecurring(date);

    const modal=document.getElementById('lesson-modal');
    modal.classList.remove('hidden');
    modal.classList.add('flex');
  };

  const baseOpenEdit=window.openEditLesson;
  window.openEditLesson=function(id){
    ensureRecurringUI();
    baseOpenEdit(id);
    const box=document.getElementById('recurring-options');
    if(box) box.classList.add('hidden');
    const cb=document.getElementById('lesson-recurring');
    const fields=document.getElementById('recurring-fields');
    if(cb) cb.checked=false;
    if(fields) fields.classList.add('hidden');
  };

  const baseSave=window.saveEditedLesson;
  window.saveEditedLesson=async function(){
    const id=document.getElementById('edit-id').value;

    if(id) return baseSave();

    const student=document.getElementById('edit-student').value;
    const date=document.getElementById('edit-date').value;
    const rawTime=document.getElementById('edit-time').value;
    const time=requireValidTime(rawTime);
    const price=Number(document.getElementById('edit-price').value||0);
    const status=document.getElementById('edit-status').value||'pending';

    if(rawTime && !time) return;
    if(!student || !date){
      showError(new Error('Выберите ученика и дату'));
      return;
    }
    if(!time){
      showError(new Error('Укажите время занятия'));
      return;
    }

    const recurring=document.getElementById('lesson-recurring')?.checked;
    let dates=[date];

    if(recurring){
      const selected=[...document.querySelectorAll('.rec-day:checked')].map(x=>Number(x.value));
      const freq=Number(document.getElementById('recurring-frequency')?.value||1);

      if(!selected.length){
        showError(new Error('Выберите хотя бы один день недели'));
        return;
      }

      const start=new Date(date+'T12:00:00');
      const last=new Date(start);
      last.setFullYear(last.getFullYear() + 1);

      const monday=function(d){
        const x=new Date(d);
        const day=x.getDay();
        x.setDate(x.getDate()+(day===0?-6:1-day));
        x.setHours(12,0,0,0);
        return x;
      };

      const firstMonday=monday(start);
      dates=[];

      for(let d=new Date(start);d<=last;d.setDate(d.getDate()+1)){
        const weeks=Math.round((monday(d)-firstMonday)/604800000);
        if(weeks%freq===0 && selected.includes(d.getDay())){
          dates.push(localISO(d));
        }
      }
    }

    try{
      await db('/lessons',{
        method:'POST',
        headers:{'Prefer':'return=minimal'},
        body:JSON.stringify(dates.map(d=>({student,date:d,time,price,status})))
      });
      await loadData();
      renderMain();
      renderWeek();
      if(typeof renderFinance==='function') renderFinance();
      closeLessonModal();
    }catch(e){
      showError(e);
    }
  };

  /* ---------- Student menus ---------- */
  function prepareStudentMenus(){
    const c=document.getElementById('students-container');
    if(!c || c.dataset.cleanMenus==='1') return;
    c.dataset.cleanMenus='1';

    c.addEventListener('click',function(e){
      const trigger=e.target.closest('[data-student-menu-trigger]');
      if(trigger){
        e.preventDefault();
        e.stopPropagation();
        toggleStudentMenu(trigger.dataset.studentId);
        return;
      }

      const action=e.target.closest('[data-student-action]');
      if(action){
        e.preventDefault();
        e.stopPropagation();
        const id=action.dataset.studentId;
        const type=action.dataset.studentAction;
        if(type==='copy') copyStudentLink(id);
        else if(type==='edit') openStudentEdit(id);
        else if(type==='delete') deleteStudent(id);
        return;
      }
    });

    document.addEventListener('click',function(e){
      if(!e.target.closest('#students-container [data-student-actions]')){
        document.querySelectorAll('[data-student-menu]').forEach(el=>el.classList.add('hidden'));
      }
    });
  }

  const baseRenderStudents=window.renderStudents;
  window.renderStudents=function(){
    baseRenderStudents.apply(this,arguments);

    const c=document.getElementById('students-container');
    if(!c) return;

    c.querySelectorAll('[data-student-actions]').forEach(wrap=>{
      const button=wrap.querySelector('button');
      const menu=wrap.querySelector('[data-student-menu]');
      if(!button || !menu) return;

      const match=(menu.id||'').match(/^student-menu-(.*)$/);
      if(!match) return;
      const id=match[1];

      button.removeAttribute('onclick');
      button.dataset.studentMenuTrigger='1';
      button.dataset.studentId=id;

      menu.querySelectorAll('button').forEach((b,i)=>{
        b.removeAttribute('onclick');
        b.dataset.studentAction=['copy','edit','delete'][i]||'';
        b.dataset.studentId=id;
      });
    });

    c.querySelectorAll('.student-card').forEach(card=>{
      if(card.querySelector('[data-delete-future]')) return;
      const menu=card.querySelector('[data-student-menu]');
      const id=menu?.id?.replace(/^student-menu-/,'');
      if(!id) return;

      const wrap=document.createElement('div');
      wrap.className='mt-3 pt-3 border-t border-slate-100';
      wrap.innerHTML='<button type="button" data-delete-future class="w-full text-left text-sm font-semibold text-red-600 hover:text-red-700 py-1">Удалить все будущие занятия</button>';
      wrap.firstElementChild.addEventListener('click',function(e){
        e.stopPropagation();
        deleteFutureLessonsForStudent(id);
      });
      card.appendChild(wrap);
    });
  };

  window.deleteFutureLessonsForStudent=async function(studentId){
    const st=(students||[]).find(s=>String(s.id)===String(studentId));
    if(!st)return;

    const today=new Date();
    const iso=localISO(today);
    const count=(lessons||[]).filter(l=>String(l.student)===String(st.name)&&l.date>=iso&&l.status==='pending').length;

    if(!count){
      alert('У этого ученика нет будущих запланированных занятий.');
      return;
    }

    if(!confirm('Удалить все будущие запланированные занятия ученика «'+st.name+'»?\n\nБудут удалены '+count+' занятий. Проведённые и уже отменённые занятия не изменятся.')) return;

    try{
      await db('/lessons?student=eq.'+encodeURIComponent(st.name)+'&date=gte.'+iso+'&status=eq.pending',{
        method:'DELETE',
        headers:{'Prefer':'return=minimal'}
      });
      await loadData();
      renderMain();
      renderWeek();
      renderStudents();
      if(typeof renderFinance==='function') renderFinance();
    }catch(e){
      showError(e);
    }
  };

  function addStyles(){
    if(document.getElementById('clean-fixes-style')) return;
    const st=document.createElement('style');
    st.id='clean-fixes-style';
    st.textContent=
      '.schedule-scroll-v3{max-height:1010px;overflow-y:auto;padding-right:4px}'+
      '.schedule-scroll-v3 thead{position:sticky;top:0;z-index:3;background:#fff}'+
      '.schedule-scroll-v3 table{min-width:900px}';
    document.head.appendChild(st);
    const wrap=document.getElementById('schedule-scroll-wrap');
    if(wrap) wrap.classList.add('schedule-scroll-v3');
  }

  function init(){
    ensureRecurringUI();
    bindCalendarClicks();
    prepareStudentMenus();
    addStyles();
  }

  document.addEventListener('DOMContentLoaded',function(){
    init();
    setTimeout(init,300);
  });
})();
</script>
