<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Tutor Finance — CRM репетитора</title>
<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen">
<div class="max-w-7xl mx-auto p-4 md:p-6">
<header class="bg-white rounded-2xl border shadow-sm p-4 flex flex-wrap gap-2 justify-between items-center mb-5">
<div><h1 class="text-2xl font-bold">📚 Tutor Finance</h1><p class="text-sm text-slate-500">CRM для занятий, учеников и оплат</p></div>
<nav class="flex gap-2"><button id="nav-calendar" onclick="switchTab('calendar')" class="px-4 py-2 rounded-xl bg-indigo-600 text-white font-semibold">Занятия</button><button id="nav-students" onclick="switchTab('students')" class="px-4 py-2 rounded-xl bg-slate-100 font-semibold">Ученики</button><button id="nav-finance" onclick="switchTab('finance')" class="px-4 py-2 rounded-xl bg-slate-100 font-semibold">Финансы</button><button onclick="teacherLogout()" class="px-4 py-2 rounded-xl bg-red-50 text-red-600 font-semibold">Выйти</button></nav>
</header>
<div id="teacher-login-modal" class="hidden fixed inset-0 bg-black/40 z-50 items-center justify-center p-4"><div class="bg-white rounded-2xl p-6 w-full max-w-sm space-y-3"><h2 class="text-xl font-bold">Вход преподавателя</h2><input id="teacher-email-input" type="email" value="ttsnmrz@gmail.com" class="w-full border rounded-xl px-3 py-2"><input id="teacher-password-input" type="password" class="w-full border rounded-xl px-3 py-2" placeholder="Пароль" onkeydown="if(event.key==='Enter')loginTeacher()"><button onclick="loginTeacher()" class="w-full bg-indigo-600 text-white rounded-xl py-2 font-semibold">Войти</button><p id="teacher-login-error" class="text-sm text-red-600"></p></div></div>
<div id="lesson-modal" class="hidden fixed inset-0 bg-black/40 z-50 items-center justify-center p-4"><div class="bg-white rounded-2xl p-6 w-full max-w-md space-y-3"><div class="flex justify-between"><h2 class="text-xl font-bold">Редактировать занятие</h2><button onclick="closeLessonModal()" class="text-2xl">×</button></div><input type="hidden" id="edit-id"><label class="text-sm font-semibold">Ученик<select id="edit-student" class="mt-1 w-full border rounded-xl px-3 py-2"></select></label><label class="text-sm font-semibold block">Дата<input id="edit-date" type="date" class="mt-1 w-full border rounded-xl px-3 py-2"></label><label class="text-sm font-semibold block">Стоимость<select id="edit-price" class="mt-1 w-full border rounded-xl px-3 py-2"><option value="40">40 BYN</option><option value="20">20 BYN</option><option value="0">0 BYN</option></select></label><label class="text-sm font-semibold block">Статус<select id="edit-status" class="mt-1 w-full border rounded-xl px-3 py-2"></select></label><div class="flex justify-between pt-2"><button onclick="deleteLessonFromModal()" class="px-4 py-2 rounded-xl bg-red-50 text-red-600 font-semibold">Удалить</button><button onclick="saveEditedLesson()" class="px-5 py-2 rounded-xl bg-indigo-600 text-white font-semibold">Сохранить</button></div></div></div>
<main id="teacher-view" class="hidden">
<section id="tab-calendar" class="space-y-5">
<div class="bg-white border rounded-2xl p-5"><h2 class="text-lg font-bold mb-4">Добавить занятие</h2><div class="grid grid-cols-1 md:grid-cols-4 gap-3"><select id="new-lesson-student" class="border rounded-xl px-3 py-2"></select><input id="new-lesson-date" type="date" class="border rounded-xl px-3 py-2"><select id="new-lesson-price" class="border rounded-xl px-3 py-2"><option value="40">40 BYN</option><option value="20">20 BYN</option><option value="0">0 BYN</option></select><button onclick="addLessonFromPanel()" class="bg-indigo-600 text-white rounded-xl font-semibold">＋ Добавить занятие</button></div></div>
<div class="bg-white border rounded-2xl p-5"><div class="flex justify-between items-center mb-4"><h2 class="text-lg font-bold">Расписание</h2><button onclick="loadData().then(renderMain)" class="px-3 py-2 rounded-xl bg-slate-100 text-sm">Обновить</button></div><div class="overflow-x-auto"><table class="w-full text-sm"><thead><tr class="text-left border-b text-slate-400"><th class="p-3">Дата занятия</th><th class="p-3">Имя ученика</th><th class="p-3">Стоимость</th><th class="p-3">Статус</th><th class="p-3 text-right">Действие</th></tr></thead><tbody id="main-lessons"></tbody></table></div></div>
</section>
<section id="tab-students" class="hidden space-y-5"><div class="bg-white border rounded-2xl p-5"><h2 class="font-bold mb-4">Новый ученик</h2><div class="grid grid-cols-1 md:grid-cols-3 gap-3"><input id="new-student-name" class="border rounded-xl px-3 py-2" placeholder="Имя"><input id="new-student-pin" class="border rounded-xl px-3 py-2" placeholder="PIN"><button onclick="addStudent()" class="bg-indigo-600 text-white rounded-xl font-semibold">Добавить</button></div></div><div id="students-container" class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-4"></div></section>
<section id="tab-finance" class="hidden space-y-5">
<div class="bg-white border rounded-2xl p-5"><h2 class="font-bold mb-4">💰 Внести платеж от ученика</h2><div class="grid grid-cols-1 md:grid-cols-4 gap-3"><select id="payment-student" class="border border-gray-300 rounded-xl px-3 py-2 text-sm bg-white"></select><input id="payment-amount" type="number" min="0" step="0.01" class="border border-gray-300 rounded-xl px-3 py-2 text-sm" placeholder="Сумма"><input id="payment-date" type="date" class="border border-gray-300 rounded-xl px-3 py-2 text-sm"><button onclick="addPayment()" class="bg-emerald-600 hover:bg-emerald-700 text-white text-sm font-semibold rounded-xl transition">Внести оплату</button></div></div>
<div class="bg-white border rounded-2xl p-5"><h2 class="font-bold mb-4">👤 Финансовый баланс учеников</h2><div id="finance-balances" class="grid grid-cols-1 md:grid-cols-2 gap-4"></div></div>
</section>
</main><div id="error-box" class="hidden fixed bottom-4 right-4 max-w-md bg-red-50 border border-red-200 text-red-700 p-4 rounded-xl"></div></div>
<script>
const SUPABASE_URL='https://dmasuczggcxzrxasgoov.supabase.co';const SUPABASE_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRtYXN1Y3pnZ2N4enJ4YXNnb292Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODk1NjcwODcsImV4cCI6MjEwNTE0MzA4N30.TQNP0LkzDQpysj3gvSz7w57cr0PaY1oVjyXpm9fsutI';const API=SUPABASE_URL+'/rest/v1';const headers={apikey:SUPABASE_KEY,Authorization:'Bearer '+SUPABASE_KEY,'Content-Type':'application/json'};const {createClient}=supabase;const supabaseClient=createClient(SUPABASE_URL,SUPABASE_KEY);let students=[],lessons=[],payments=[];const statusLabels={pending:'Запланировано',conducted:'Проведено',rescheduled:'Перенесено',cancelled_charge:'Отменено — списать',cancelled_free:'Отменено — не списывать'};const statusClass={pending:'bg-amber-100 text-amber-800',conducted:'bg-emerald-100 text-emerald-800',rescheduled:'bg-blue-100 text-blue-800',cancelled_charge:'bg-red-100 text-red-800',cancelled_free:'bg-slate-100 text-slate-700'};const charge=new Set(['conducted','cancelled_charge']);
function esc(v){return String(v??'').replace(/[&<>'\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));}function money(n){return Number(n||0).toLocaleString('ru-RU',{maximumFractionDigits:2})+' BYN';}function showError(e){console.error(e);const b=document.getElementById('error-box');b.textContent='Ошибка: '+(e.message||e);b.classList.remove('hidden');setTimeout(()=>b.classList.add('hidden'),5000);}async function db(path,opt={}){const r=await fetch(API+path,{...opt,headers:{...headers,...(opt.headers||{})}});if(!r.ok)throw new Error(await r.text()||r.statusText);return r.status===204?null:r.json();}async function loadData(){[students,lessons,payments]=await Promise.all([db('/students?select=*'),db('/lessons?select=*'),db('/payments?select=*')]);}
function switchTab(t){['calendar','students','finance'].forEach(x=>{document.getElementById('tab-'+x).classList.toggle('hidden',x!==t);document.getElementById('nav-'+x).className='px-4 py-2 rounded-xl font-semibold '+(x===t?'bg-indigo-600 text-white':'bg-slate-100');});if(t==='calendar')renderMain();if(t==='students')renderStudents();if(t==='finance')renderFinance();}function fillStudentSelects(){['new-lesson-student','edit-student','payment-student'].forEach(id=>{const el=document.getElementById(id);if(!el)return;el.innerHTML=students.map(s=>`<option value="${esc(s.name)}">${esc(s.name)}</option>`).join('');});}
function renderMain(){fillStudentSelects();const rows=[...lessons].sort((a,b)=>String(b.date).localeCompare(String(a.date)));const body=document.getElementById('main-lessons');if(!body)return;body.innerHTML=rows.length?rows.map(l=>`<tr class="border-b"><td class="p-3">${esc(l.date)}</td><td class="p-3">${esc(l.student)}</td><td class="p-3">${money(l.price)}</td><td class="p-3"><span class="px-2 py-1 rounded-lg text-xs font-semibold ${statusClass[l.status]||'bg-slate-100'}">${statusLabels[l.status]||esc(l.status)}</span></td><td class="p-3 text-right"><button onclick="openEditLesson('${esc(l.id)}')" class="text-indigo-600 font-semibold mr-3">Редактировать</button><button onclick="deleteLesson('${esc(l.id)}')" class="text-red-600 font-semibold">Удалить</button></td></tr>`).join(''):`<tr><td colspan="5" class="p-8 text-center text-slate-400">Занятий пока нет</td></tr>`;}
async function addLessonFromPanel(){try{const student=document.getElementById('new-lesson-student').value,date=document.getElementById('new-lesson-date').value,price=Number(document.getElementById('new-lesson-price').value);if(!student||!date){showError(new Error('Выберите ученика и дату'));return;}await db('/lessons',{method:'POST',headers:{...headers,Prefer:'return=minimal'},body:JSON.stringify({student,date,price,status:'pending'})});await loadData();renderMain();document.getElementById('new-lesson-date').value='';}catch(e){showError(e);}}
function openEditLesson(id){const l=lessons.find(x=>String(x.id)===String(id));if(!l)return;fillStudentSelects();document.getElementById('edit-id').value=l.id;document.getElementById('edit-student').value=l.student;document.getElementById('edit-date').value=l.date;document.getElementById('edit-price').value=String(Number(l.price));document.getElementById('edit-status').innerHTML=Object.entries(statusLabels).map(([k,v])=>`<option value="${k}">${v}</option>`).join('');document.getElementById('edit-status').value=l.status;document.getElementById('lesson-modal').classList.remove('hidden');document.getElementById('lesson-modal').classList.add('flex');}function closeLessonModal(){document.getElementById('lesson-modal').classList.add('hidden');document.getElementById('lesson-modal').classList.remove('flex');}async function saveEditedLesson(){try{const id=document.getElementById('edit-id').value;await db('/lessons?id=eq.'+encodeURIComponent(id),{method:'PATCH',headers:{...headers,Prefer:'return=minimal'},body:JSON.stringify({student:document.getElementById('edit-student').value,date:document.getElementById('edit-date').value,price:Number(document.getElementById('edit-price').value),status:document.getElementById('edit-status').value})});closeLessonModal();await loadData();renderMain();}catch(e){showError(e);}}async function deleteLesson(id){if(!confirm('Удалить занятие?'))return;try{await db('/lessons?id=eq.'+encodeURIComponent(id),{method:'DELETE',headers});await loadData();renderMain();}catch(e){showError(e);}}async function deleteLessonFromModal(){await deleteLesson(document.getElementById('edit-id').value);closeLessonModal();}
function renderStudents(){fillStudentSelects();const c=document.getElementById('students-container');c.innerHTML=students.map(s=>{const ls=lessons.filter(l=>l.student===s.name),income=payments.filter(p=>p.student===s.name).reduce((a,p)=>a+Number(p.amount||0),0),expenses=ls.filter(l=>charge.has(l.status)).reduce((a,l)=>a+Number(l.price||0),0),bal=income-expenses;return `<div class="bg-white border rounded-2xl p-5"><h3 class="text-lg font-bold">${esc(s.name)}</h3><p class="text-sm text-slate-500">Стоимость: ${money(s.price)}</p><div class="grid grid-cols-2 gap-2 mt-4 text-sm"><div>Баланс<br><b>${money(bal)}</b></div><div>Проведено<br><b>${ls.filter(l=>l.status==='conducted').length}</b></div><div>Приход<br><b>${money(income)}</b></div><div>Списано<br><b>${money(expenses)}</b></div></div><div class="mt-4 border-t pt-3 text-sm">${ls.sort((a,b)=>String(b.date).localeCompare(String(a.date))).slice(0,8).map(l=>`<div class="flex justify-between py-1"><span>${esc(l.date)}</span><span>${money(l.price)} · ${statusLabels[l.status]}</span></div>`).join('')||'<span class="text-slate-400">Занятий нет</span>'}</div></div>`}).join('')||'<div class="text-slate-400">Учеников пока нет</div>';}
async function addStudent(){try{const name=document.getElementById('new-student-name').value.trim();const pin=document.getElementById('new-student-pin').value.trim();if(!name||!pin){showError(new Error('Введите имя и PIN-код'));return;}await db('/students',{method:'POST',headers:{...headers,Prefer:'return=minimal'},body:JSON.stringify({name,pin,price:40})});await loadData();renderStudents();document.getElementById('new-student-name').value='';document.getElementById('new-student-pin').value='';}catch(e){showError(e);}}
function renderFinance(){fillStudentSelects();const c=document.getElementById('finance-balances');c.innerHTML=students.map(s=>{const totalPaid=payments.filter(p=>p.student===s.name).reduce((a,p)=>a+Number(p.amount||0),0);const spent=lessons.filter(l=>l.student===s.name&&charge.has(l.status)).reduce((a,l)=>a+Number(l.price||0),0);const balance=totalPaid-spent;return `<div class="p-4 bg-gray-50 rounded-xl border border-gray-100 flex flex-col justify-between"><div><h4 class="font-bold text-base text-indigo-900">${esc(s.name)}</h4><div class="text-xs text-gray-500 mt-1">Всего внесено: <span class="font-semibold text-gray-700">${money(totalPaid)}</span></div><div class="text-xs text-gray-500">Списано за уроки: <span class="font-semibold text-gray-700">${money(spent)}</span></div></div><div class="mt-4 pt-3 border-t border-gray-200 flex justify-between items-center"><span class="text-xs font-medium text-gray-500">Баланс:</span><span class="text-lg font-bold ${balance>=0?'text-emerald-600':'text-red-600'}">${money(balance)}</span></div></div>`}).join('')||'<div class="text-slate-400">Учеников пока нет</div>';}
async function addPayment(){try{const student=document.getElementById('payment-student').value;const amount=Number(document.getElementById('payment-amount').value);const date=document.getElementById('payment-date').value;if(!student||!Number.isFinite(amount)||amount<=0||!date){showError(new Error('Выберите ученика, укажите сумму и дату'));return;}await db('/payments',{method:'POST',headers:{...headers,Prefer:'return=minimal'},body:JSON.stringify({student,amount,date})});document.getElementById('payment-amount').value='';await loadData();renderFinance();}catch(e){showError(e);}}
async function loginTeacher(){try{const {error}=await supabaseClient.auth.signInWithPassword({email:document.getElementById('teacher-email-input').value,password:document.getElementById('teacher-password-input').value});if(error)throw error;sessionStorage.setItem('auth_teacher','1');document.getElementById('teacher-login-modal').classList.add('hidden');document.getElementById('teacher-view').classList.remove('hidden');await loadData();switchTab('calendar');}catch(e){document.getElementById('teacher-login-error').textContent=e.message||'Ошибка входа';}}async function teacherLogout(){try{await supabaseClient.auth.signOut();}catch(e){}sessionStorage.removeItem('auth_teacher');location.reload();}
async function boot(){const {data}=await supabaseClient.auth.getSession();if(data.session||sessionStorage.getItem('auth_teacher')){document.getElementById('teacher-view').classList.remove('hidden');try{await loadData();switchTab('calendar');}catch(e){showError(e);}}else{document.getElementById('teacher-login-modal').classList.remove('hidden');document.getElementById('teacher-login-modal').classList.add('flex');}}document.addEventListener('DOMContentLoaded',boot);
</script>
</body></html>
