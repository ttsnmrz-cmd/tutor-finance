<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tutor Finance</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-50 min-h-screen flex flex-col items-center justify-center p-4 font-sans">

    <div id="app" class="max-w-4xl w-full">
        <!-- Контент рендерится динамически -->
    </div>

    <script>
        const SUPABASE_URL = 'https://dmasuczggcxzrxasgoov.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_9XV4TmmWv1OHVvbdei2jhA__Bu4FsQG';
        const { createClient } = supabase;
        const supabaseClient = createClient(SUPABASE_URL, SUPABASE_KEY);

        let currentUser = JSON.parse(sessionStorage.getItem('auth_user')) || null;
        let students = [], lessons = [], payments = [];
        let activeTab = 'students'; // 'students', 'lessons', 'finance'

        const urlParams = new URLSearchParams(window.location.search);
        const studentParam = urlParams.get('student');

        async function init() {
            if (studentParam) {
                await renderStudentPortal(studentParam);
                return;
            }
            await loadData();
        }

        async function loadData() {
            try {
                const [sRes, lRes, pRes] = await Promise.all([
                    supabaseClient.from('students').select('*'),
                    supabaseClient.from('lessons').select('*'),
                    supabaseClient.from('payments').select('*')
                ]);
                students = sRes.data || [];
                lessons = lRes.data || [];
                payments = pRes.data || [];
            } catch (err) {
                console.error("Ошибка загрузки данных из базы:", err);
            }
            render();
        }

        function render() {
            const app = document.getElementById('app');
            
            if (!currentUser) {
                app.className = "max-w-md w-full";
                app.innerHTML = `
                    <div class="bg-white p-8 rounded-3xl shadow-sm border border-slate-100">
                        <div class="text-center mb-6">
                            <h1 class="text-2xl font-bold text-slate-800">Tutor Finance</h1>
                            <p class="text-slate-400 text-sm">Система учета занятий</p>
                        </div>
                        <form onsubmit="handleLogin(event)" class="space-y-4">
                            <div>
                                <label class="block text-xs font-semibold text-slate-500 uppercase tracking-wider mb-1">Email</label>
                                <input type="email" id="emailInput" required 
                                    class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-indigo-500 text-slate-800 text-sm"
                                    placeholder="teacher@example.com">
                            </div>
                            <div>
                                <label class="block text-xs font-semibold text-slate-500 uppercase tracking-wider mb-1">Пароль</label>
                                <input type="password" id="passwordInput" required 
                                    class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-indigo-500 text-slate-800 text-sm"
                                    placeholder="••••••••">
                            </div>
                            <button type="submit" 
                                class="w-full py-3 bg-indigo-600 text-white font-semibold rounded-xl hover:bg-indigo-700 transition cursor-pointer mt-2">
                                Войти
                            </button>
                        </form>
                    </div>
                `;
                return;
            }

            app.className = "max-w-4xl w-full";
            app.innerHTML = `
                <div class="bg-white p-6 sm:p-8 rounded-3xl shadow-sm border border-slate-100 mb-6">
                    <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 mb-6">
                        <div>
                            <h1 class="text-xl font-bold text-slate-800">Кабинет преподавателя</h1>
                            <p class="text-slate-400 text-sm">Добро пожаловать, ${currentUser.name}</p>
                        </div>
                        <div class="flex items-center gap-2">
                            <button onclick="loadData()" class="px-3 py-2 bg-slate-100 text-slate-600 rounded-xl text-sm font-medium hover:bg-slate-200 transition cursor-pointer">Обновить</button>
                            <button onclick="logout()" class="px-3 py-2 bg-rose-50 text-rose-600 rounded-xl text-sm font-medium hover:bg-rose-100 transition cursor-pointer">Выйти</button>
                        </div>
                    </div>

                    <!-- Календарь занятий -->
                    <div class="bg-indigo-50/50 p-4 rounded-2xl border border-indigo-100 mb-6">
                        <h3 class="font-semibold text-indigo-900 mb-3 text-sm">📅 Календарь занятий</h3>
                        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-3 mb-4">
                            ${lessons.length === 0 ? '<p class="text-slate-400 text-xs col-span-full py-2">Занятий в календаре пока нет</p>' : lessons.slice(-6).reverse().map(l => `
                                <div class="bg-white p-3 rounded-xl border border-indigo-100 shadow-xs flex justify-between items-center">
                                    <div>
                                        <p class="font-semibold text-slate-800 text-sm">${l.student_name || l.student_id}</p>
                                        <p class="text-xs text-slate-400">${l.date} • <span class="text-slate-600 font-medium">-${l.price} руб.</span></p>
                                    </div>
                                    <button onclick="deleteLesson('${l.id}', '${l.student_name || l.student_id}', ${l.price})" class="text-rose-400 hover:text-rose-600 text-xs font-medium cursor-pointer p-1">✕</button>
                                </div>
                            `).join('')}
                        </div>

                        <!-- Полный список занятий прямо под календарём -->
                        <div class="border-t border-indigo-100 pt-3">
                            <h4 class="font-medium text-indigo-800 text-xs uppercase tracking-wider mb-2">Все проведенные занятия</h4>
                            <div class="divide-y divide-indigo-100/60 max-h-48 overflow-y-auto">
                                ${lessons.length === 0 ? '<p class="text-slate-400 text-xs text-center py-2">Список пуст</p>' : lessons.map(l => `
                                    <div class="py-2 flex justify-between items-center text-sm">
                                        <div>
                                            <span class="font-semibold text-slate-800">${l.student_name || l.student_id}</span>
                                            <span class="text-slate-400 text-xs ml-2">${l.date}</span>
                                        </div>
                                        <div class="flex items-center gap-3">
                                            <span class="font-medium text-slate-700">-${l.price} руб.</span>
                                            <button onclick="deleteLesson('${l.id}', '${l.student_name || l.student_id}', ${l.price})" class="text-rose-400 hover:text-rose-600 text-xs font-medium cursor-pointer">Удалить</button>
                                        </div>
                                    </div>
                                `).join('')}
                            </div>
                        </div>
                    </div>

                    <!-- Навигация по вкладкам -->
                    <div class="flex gap-2 border-b border-slate-100 pb-4 mb-6 overflow-x-auto">
                        <button onclick="switchTab('students')" class="px-4 py-2 rounded-xl text-sm font-medium transition cursor-pointer whitespace-nowrap ${activeTab === 'students' ? 'bg-indigo-600 text-white' : 'bg-slate-100 text-slate-600 hover:bg-slate-200'}">Ученики (${students.length})</button>
                        <button onclick="switchTab('lessons')" class="px-4 py-2 rounded-xl text-sm font-medium transition cursor-pointer whitespace-nowrap ${activeTab === 'lessons' ? 'bg-indigo-600 text-white' : 'bg-slate-100 text-slate-600 hover:bg-slate-200'}">Занятия (${lessons.length})</button>
                        <button onclick="switchTab('finance')" class="px-4 py-2 rounded-xl text-sm font-medium transition cursor-pointer whitespace-nowrap ${activeTab === 'finance' ? 'bg-indigo-600 text-white' : 'bg-slate-100 text-slate-600 hover:bg-slate-200'}">Финансы (${payments.length})</button>
                    </div>

                    <!-- Содержимое активной вкладки -->
                    <div id="tab-content">
                        ${activeTab === 'students' ? renderStudentsTab() : activeTab === 'lessons' ? renderLessonsTab() : renderFinanceTab()}
                    </div>
                </div>
            `;
        }

        function switchTab(tab) {
            activeTab = tab;
            render();
        }

        function renderStudentsTab() {
            return `
                <div class="space-y-6">
                    <div class="bg-slate-50 p-4 rounded-2xl border border-slate-100">
                        <h3 class="font-semibold text-slate-700 mb-3 text-sm">Добавить нового ученика</h3>
                        <form onsubmit="addStudent(event)" class="grid grid-cols-1 sm:grid-cols-3 gap-3">
                            <input type="text" id="newName" placeholder="Имя ученика" required class="px-3 py-2 bg-white rounded-xl border border-slate-200 text-sm">
                            <input type="text" id="newSubject" placeholder="Предмет / Примечание" class="px-3 py-2 bg-white rounded-xl border border-slate-200 text-sm">
                            <button type="submit" class="py-2 bg-indigo-600 text-white font-medium rounded-xl hover:bg-indigo-700 transition text-sm cursor-pointer">Добавить</button>
                        </form>
                    </div>

                    <div class="divide-y divide-slate-100">
                        ${students.length === 0 ? '<p class="text-slate-400 text-center py-6 text-sm">Учеников пока нет</p>' : students.map(s => `
                            <div class="py-4 flex flex-col sm:flex-row justify-between items-start sm:items-center gap-3">
                                <div>
                                    <h4 class="font-semibold text-slate-800">${s.name}</h4>
                                    <p class="text-xs text-slate-400">Инфо: ${s.subject || 'Нет'} | Баланс: <span class="${(s.balance || 0) < 0 ? 'text-rose-500 font-bold' : 'text-emerald-600 font-bold'}">${s.balance || 0} руб.</span></p>
                                </div>
                                <div class="flex items-center gap-2 w-full sm:w-auto">
                                    <button onclick="copyStudentLink('${s.name}')" class="px-3 py-1.5 bg-slate-100 text-slate-600 rounded-lg text-xs font-medium hover:bg-slate-200 transition cursor-pointer">Ссылка</button>
                                    <button onclick="deleteStudent('${s.name}')" class="px-3 py-1.5 bg-rose-50 text-rose-600 rounded-lg text-xs font-medium hover:bg-rose-100 transition cursor-pointer">Удалить</button>
                                </div>
                            </div>
                        `).join('')}
                    </div>
                </div>
            `;
        }

        function renderLessonsTab() {
            return `
                <div class="space-y-6">
                    <div class="bg-slate-50 p-4 rounded-2xl border border-slate-100">
                        <h3 class="font-semibold text-slate-700 mb-3 text-sm">Добавить / Отметить занятие</h3>
                        <form onsubmit="addLesson(event)" class="grid grid-cols-1 sm:grid-cols-4 gap-3">
                            <select id="lessonStudentName" required class="px-3 py-2 bg-white rounded-xl border border-slate-200 text-sm">
                                <option value="">Выберите ученика</option>
                                ${students.map(s => `<option value="${s.name}">${s.name}</option>`).join('')}
                            </select>
                            <input type="date" id="lessonDate" required value="${new Date().toISOString().split('T')[0]}" class="px-3 py-2 bg-white rounded-xl border border-slate-200 text-sm">
                            <input type="number" id="lessonPrice" placeholder="Стоимость (руб)" required value="40" class="px-3 py-2 bg-white rounded-xl border border-slate-200 text-sm">
                            <button type="submit" class="py-2 bg-indigo-600 text-white font-medium rounded-xl hover:bg-indigo-700 transition text-sm cursor-pointer">Добавить</button>
                        </form>
                    </div>

                    <div class="divide-y divide-slate-100">
                        ${lessons.length === 0 ? '<p class="text-slate-400 text-center py-6 text-sm">Занятий пока нет</p>' : lessons.map(l => `
                            <div class="py-3 flex justify-between items-center text-sm">
                                <div>
                                    <span class="font-semibold text-slate-800">${l.student_name || l.student_id}</span>
                                    <span class="text-slate-400 text-xs ml-2">${l.date}</span>
                                </div>
                                <div class="flex items-center gap-3">
                                    <span class="font-medium text-slate-700">-${l.price} руб.</span>
                                    <button onclick="deleteLesson('${l.id}', '${l.student_name || l.student_id}', ${l.price})" class="text-rose-400 hover:text-rose-600 text-xs font-medium cursor-pointer">Удалить</button>
                                </div>
                            </div>
                        `).join('')}
                    </div>
                </div>
            `;
        }

        function renderFinanceTab() {
            return `
                <div class="space-y-6">
                    <div class="bg-slate-50 p-4 rounded-2xl border border-slate-100">
                        <h3 class="font-semibold text-slate-700 mb-3 text-sm">Внести оплату от ученика</h3>
                        <form onsubmit="addPayment(event)" class="grid grid-cols-1 sm:grid-cols-4 gap-3">
                            <select id="paymentStudentName" required class="px-3 py-2 bg-white rounded-xl border border-slate-200 text-sm">
                                <option value="">Выберите ученика</option>
                                ${students.map(s => `<option value="${s.name}">${s.name}</option>`).join('')}
                            </select>
                            <input type="date" id="paymentDate" required value="${new Date().toISOString().split('T')[0]}" class="px-3 py-2 bg-white rounded-xl border border-slate-200 text-sm">
                            <input type="number" id="paymentAmount" placeholder="Сумма (руб)" required class="px-3 py-2 bg-white rounded-xl border border-slate-200 text-sm">
                            <button type="submit" class="py-2 bg-emerald-600 text-white font-medium rounded-xl hover:bg-emerald-700 transition text-sm cursor-pointer">Внести</button>
                        </form>
                    </div>

                    <div class="divide-y divide-slate-100">
                        ${payments.length === 0 ? '<p class="text-slate-400 text-center py-6 text-sm">Платежей пока нет</p>' : payments.map(p => `
                            <div class="py-3 flex justify-between items-center text-sm">
                                <div>
                                    <span class="font-semibold text-slate-800">${p.student_name || p.student_id}</span>
                                    <span class="text-slate-400 text-xs ml-2">${p.date}</span>
                                </div>
                                <div class="font-bold text-emerald-600">+${p.amount} руб.</div>
                            </div>
                        `).join('')}
                    </div>
                </div>
            `;
        }

        async function addStudent(e) {
            e.preventDefault();
            const name = document.getElementById('newName').value.trim();
            const subject = document.getElementById('newSubject').value.trim();
            
            const { error } = await supabaseClient.from('students').insert([{ name, subject, balance: 0 }]);
            if (error) {
                alert("Ошибка при добавлении ученика");
            } else {
                await loadData();
            }
        }

        async function deleteStudent(name) {
            if (!confirm(`Удалить ученика ${name}?`)) return;
            await supabaseClient.from('students').delete().eq('name', name);
            await loadData();
        }

        async function addLesson(e) {
            e.preventDefault();
            const student_name = document.getElementById('lessonStudentName').value;
            const date = document.getElementById('lessonDate').value;
            const price = parseFloat(document.getElementById('lessonPrice').value);

            const { error } = await supabaseClient.from('lessons').insert([{ student_name, student_id: student_name, date, price }]);
            if (error) {
                alert("Ошибка при добавлении занятия");
            } else {
                const student = students.find(s => s.name === student_name);
                if (student) {
                    const newBalance = (student.balance || 0) - price;
                    await supabaseClient.from('students').update({ balance: newBalance }).eq('name', student_name);
                }
                await loadData();
            }
        }

        async function deleteLesson(lessonId, studentName, price) {
            if (!confirm("Удалить это занятие? Баланс ученика будет пересчитан.")) return;
            
            const { error } = await supabaseClient.from('lessons').delete().eq('id', lessonId);
            if (error) {
                alert("Ошибка при удалении занятия");
                return;
            }

            const student = students.find(s => s.name === studentName);
            if (student) {
                const newBalance = (student.balance || 0) + price;
                await supabaseClient.from('students').update({ balance: newBalance }).eq('name', studentName);
            }

            await loadData();
        }

        async function addPayment(e) {
            e.preventDefault();
            const student_name = document.getElementById('paymentStudentName').value;
            const date = document.getElementById('paymentDate').value;
            const amount = parseFloat(document.getElementById('paymentAmount').value);

            const { error } = await supabaseClient.from('payments').insert([{ student_name, student_id: student_name, date, amount }]);
            if (error) {
                alert("Ошибка при внесении платежа");
            } else {
                const student = students.find(s => s.name === student_name);
                if (student) {
                    const newBalance = (student.balance || 0) + amount;
                    await supabaseClient.from('students').update({ balance: newBalance }).eq('name', student_name);
                }
                await loadData();
            }
        }

        function copyStudentLink(studentName) {
            const url = `${window.location.origin}${window.location.pathname}?student=${encodeURIComponent(studentName)}`;
            navigator.clipboard.writeText(url);
            alert(`Ссылка для ученика ${studentName} скопирована!`);
        }

        async function renderStudentPortal(studentName) {
            const app = document.getElementById('app');
            app.className = "max-w-md w-full";
            
            const decodedName = decodeURIComponent(studentName);
            const { data, error } = await supabaseClient.from('students').select('*').eq('name', decodedName).single();
            
            if (error || !data) {
                app.innerHTML = `<div class="bg-white p-8 rounded-3xl text-center shadow-sm"><h2 class="text-xl font-bold text-slate-800">Ученик не найден</h2><p class="text-slate-400 text-sm mt-2">Проверьте правильность ссылки.</p></div>`;
                return;
            }

            const studentLessons = lessons.filter(l => (l.student_name === decodedName || l.student_id === decodedName));
            const studentPayments = payments.filter(p => (p.student_name === decodedName || p.student_id === decodedName));

            app.innerHTML = `
                <div class="bg-white p-8 rounded-3xl shadow-sm border border-slate-100">
                    <div class="text-center mb-6">
                        <h1 class="text-xl font-bold text-slate-800">Кабинет ученика</h1>
                        <p class="text-indigo-600 font-semibold mt-1">${data.name}</p>
                    </div>
                    <div class="bg-slate-50 p-4 rounded-2xl border border-slate-100 text-center mb-6">
                        <span class="text-xs text-slate-400 uppercase tracking-wider">Ваш баланс</span>
                        <div class="text-2xl font-bold ${(data.balance || 0) < 0 ? 'text-rose-500' : 'text-emerald-600'} mt-1">${data.balance || 0} руб.</div>
                    </div>
                    <h3 class="font-semibold text-slate-700 text-sm mb-3">История занятий</h3>
                    <div class="space-y-2 mb-6 max-h-40 overflow-y-auto">
                        ${studentLessons.length === 0 ? '<p class="text-slate-400 text-xs text-center py-2">Занятий пока нет</p>' : studentLessons.map(l => `
                            <div class="py-2 px-3 bg-slate-50 rounded-xl flex justify-between items-center text-sm">
                                <span class="text-slate-600">${l.date}</span>
                                <span class="font-medium text-slate-800">-${l.price} руб.</span>
                            </div>
                        `).join('')}
                    </div>
                    <h3 class="font-semibold text-slate-700 text-sm mb-3">История платежей</h3>
                    <div class="space-y-2 max-h-40 overflow-y-auto">
                        ${studentPayments.length === 0 ? '<p class="text-slate-400 text-xs text-center py-2">Платежей пока нет</p>' : studentPayments.map(p => `
                            <div class="py-2 px-3 bg-slate-50 rounded-xl flex justify-between items-center text-sm">
                                <span class="text-slate-600">${p.date}</span>
                                <span class="font-medium text-emerald-600">+${p.amount} руб.</span>
                            </div>
                        `).join('')}
                    </div>
                </div>
            `;
        }

        async function handleLogin(event) {
            event.preventDefault();
            const email = document.getElementById('emailInput').value.trim();
            const password = document.getElementById('passwordInput').value.trim();

            try {
                const { data, error } = await supabaseClient
                    .from('tutors')
                    .select('*')
                    .eq('email', email)
                    .eq('password', password);

                if (error) throw error;

                if (data && data.length > 0) {
                    currentUser = { role: 'tutor', name: data[0].name || 'Преподаватель' };
                    sessionStorage.setItem('auth_user', JSON.stringify(currentUser));
                    await loadData();
                } else {
                    alert("Неверный email или пароль!");
                }
            } catch (err) {
                console.error("Ошибка авторизации:", err);
                alert("Ошибка при проверке данных.");
            }
        }

        function logout() { 
            currentUser = null; 
            sessionStorage.removeItem('auth_user');
            render(); 
        }

        init();
    </script>
</body>
</html>
