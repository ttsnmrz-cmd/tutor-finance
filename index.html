<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tutor Finance</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-50 min-h-screen flex flex-col items-center justify-center p-4 font-sans">

    <div id="app" class="max-w-4xl w-full">
        <!-- Контент рендерится динамически -->
    </div>

    <script>
        const SUPABASE_URL = 'https://dmasuczggcxzrxasgoov.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_9XV4TmmWv1OHVvbdei2jhA__Bu4FsQG';
        const { createClient } = supabase;
        const supabaseClient = createClient(SUPABASE_URL, SUPABASE_KEY);

        let currentUser = JSON.parse(sessionStorage.getItem('auth_user')) || null;
        let students = [], lessons = [], payments = [];

        const statusLabels = {
            pending: '⏳ Запланировано',
            conducted: 'Проведено',
            rescheduled: 'Перенесено',
            cancelled_charge: 'Отменено — списать',
            cancelled_free: 'Отменено — не списывать'
        };

        const statusClass = {
            pending: 'bg-amber-100 text-amber-800',
            conducted: 'bg-emerald-100 text-emerald-800',
            rescheduled: 'bg-blue-100 text-blue-800',
            cancelled_charge: 'bg-rose-100 text-rose-800',
            cancelled_free: 'bg-slate-100 text-slate-700'
        };

        const charge = new Set(['conducted', 'cancelled_charge']);

        async function loadData() {
            try {
                const [sRes, lRes, pRes] = await Promise.all([
                    supabaseClient.from('students').select('*'),
                    supabaseClient.from('lessons').select('*'),
                    supabaseClient.from('payments').select('*')
                ]);
                students = sRes.data || [];
                lessons = lRes.data || [];
                payments = pRes.data || [];
            } catch (err) {
                console.error("Ошибка загрузки данных из базы:", err);
            }
            render();
        }

        function render() {
            const app = document.getElementById('app');
            
            // Если никто не вошел — показываем экран авторизации
            if (!currentUser) {
                app.innerHTML = `
                    <div class="bg-white p-8 rounded-3xl shadow-sm border border-slate-100 text-center max-w-md mx-auto">
                        <h1 class="text-2xl font-bold mb-2 text-slate-800">Tutor Finance</h1>
                        <p class="text-slate-400 text-sm mb-6">Система учета занятий</p>
                        <div class="space-y-3">
                            <button onclick="loginAsTutor()" class="w-full py-3 bg-indigo-600 text-white font-semibold rounded-xl hover:bg-indigo-700 transition cursor-pointer">Вход для преподавателя</button>
                        </div>
                    </div>
                `;
                return;
            }

            // Если вошел преподаватель
            if (currentUser.role === 'tutor') {
                app.innerHTML = `
                    <div class="bg-white p-8 rounded-3xl shadow-sm border border-slate-100">
                        <div class="flex justify-between items-center mb-8">
                            <div>
                                <h1 class="text-xl font-bold text-slate-800">Кабинет преподавателя</h1>
                                <p class="text-slate-400 text-sm">Добро пожаловать, ${currentUser.name}</p>
                            </div>
                            <button onclick="logout()" class="px-4 py-2 bg-slate-100 text-slate-600 rounded-xl text-sm font-medium hover:bg-slate-200 transition cursor-pointer">Выйти</button>
                        </div>
                        <div class="space-y-4">
                            <p class="text-slate-600">Панель управления активна. База данных подключена успешно.</p>
                            <div class="p-4 bg-slate-50 rounded-2xl border border-slate-100">
                                <span class="text-xs text-slate-400 uppercase tracking-wider">Статистика</span>
                                <div class="grid grid-cols-2 gap-4 mt-2">
                                    <div>Учеников в базе: <b>${students.length}</b></div>
                                    <div>Всего занятий: <b>${lessons.length}</b></div>
                                </div>
                            </div>
                        </div>
                    </div>
                `;
            }
        }

        async function loginAsTutor() {
            const emailInput = prompt("Введите email преподавателя:");
            if (!emailInput) return;

            const passwordInput = prompt("Введите пароль преподавателя:");
            if (!passwordInput) return;

            try {
                // Проверяем данные по таблице tutors в Supabase
                const { data, error } = await supabaseClient
                    .from('tutors')
                    .select('*')
                    .eq('email', emailInput.trim())
                    .eq('password', passwordInput.trim());

                if (error) throw error;

                if (data && data.length > 0) {
                    currentUser = { role: 'tutor', name: data[0].name || 'Преподаватель' };
                    sessionStorage.setItem('auth_user', JSON.stringify(currentUser));
                    render();
                } else {
                    alert("Неверный email или пароль!");
                }
            } catch (err) {
                console.error("Ошибка авторизации:", err);
                alert("Ошибка при проверке данных. Проверьте подключение к базе.");
            }
        }

        function logout() { 
            currentUser = null; 
            sessionStorage.removeItem('auth_user');
            render(); 
        }

        loadData();
    </script>
</body>
</html>
