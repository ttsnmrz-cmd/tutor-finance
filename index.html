<head>

<style>
body{background:#f7f8fc;-webkit-tap-highlight-color:transparent}.app-card{background:#fff;border:1px solid #e8eaf0;box-shadow:0 8px 30px rgba(15,23,42,.05)}.soft-input{border:1px solid #dfe3eb;background:#fff;outline:none}.soft-input:focus{border-color:#818cf8;box-shadow:0 0 0 3px rgba(99,102,241,.1)}.primary-btn{background:#4f46e5;color:#fff}.primary-btn:hover{background:#4338ca}.day-dot{width:7px;height:7px;border-radius:50%;background:#4f46e5;margin:auto}.day-circle{width:42px;height:42px;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center}.day-circle.selected{background:#4f46e5;color:#fff}.day-circle.today{box-shadow:0 0 0 2px #c7d2fe}.day-circle.selected .day-dot{background:#fff}.balance-green{background:#dcfce7}.balance-orange{background:#ffedd5}.balance-red{background:#fee2e2}.modal-bg{background:rgba(15,23,42,.45)}.status{font-size:11px;font-weight:600;padding:4px 8px;border-radius:8px;white-space:nowrap}
@media(max-width:640px){.day-circle{width:38px;height:38px}.status{font-size:10px;padding:3px 6px}.app-card{border-radius:20px}header{align-items:flex-start!important;flex-direction:column!important}header nav{width:100%;display:grid!important;grid-template-columns:1fr 1fr auto}header nav button{padding:.65rem .7rem!important}.fixed.right-6{right:1rem;bottom:1rem}.modal-bg{align-items:flex-end!important}.modal-bg>.app-card{border-radius:24px 24px 0 0;max-height:92vh;overflow:auto}}</style>
</head>
<body class="text-slate-800 min-h-screen">
<div id="student-public-view" class="hidden max-w-3xl mx-auto p-4"><div class="app-card rounded-3xl p-6">
<h1 class="text-2xl font-bold mb-1">ProfiProfit</h1><p class="text-sm text-slate-500 mb-6">Личный кабинет ученика</p>
<div id="student-public-login"><p id="student-public-name" class="mb-3"></p><div class="flex gap-2"><input id="student-public-pin" type="password" class="soft-input rounded-xl px-3 py-2 flex-1" placeholder="PIN" onkeydown="if(event.key==='Enter')openStudentCabinet()"><button onclick="openStudentCabinet()" class="primary-btn rounded-xl px-5">Войти</button></div><p id="student-public-error" class="text-sm text-red-600 mt-2"></p></div>
<div id="student-public-content" class="hidden"><div class="flex justify-between mb-5"><h2 id="public-student-title" class="text-2xl font-bold"></h2><button onclick="location.href=location.pathname" class="px-3 py-2 rounded-xl bg-slate-100">Выйти</button></div>
<div class="grid grid-cols-3 gap-3 mb-5"><div class="rounded-2xl bg-emerald-50 p-4"><span class="text-xs">Внесено</span><div id="public-paid" class="font-bold text-lg"></div></div><div class="rounded-2xl bg-red-50 p-4"><span class="text-xs">Списано</span><div id="public-spent" class="font-bold text-lg"></div></div><div class="rounded-2xl bg-indigo-50 p-4"><span class="text-xs">Баланс</span><div id="public-balance" class="font-bold text-lg"></div></div></div>
<div><h3 class="font-bold mb-2">Занятия</h3><div class="overflow-auto"><table class="w-full text-sm"><tbody id="public-lessons"></tbody></table></div></div></div></div></div>

<div id="teacher-app" class="hidden"><div class="max-w-5xl mx-auto p-4 md:p-6">
<header class="app-card rounded-3xl p-4 mb-5 flex justify-between items-center gap-3"><div><h1 class="text-2xl font-bold">ProfiProfit</h1><p class="text-sm text-slate-500">Занятия, ученики и оплаты</p></div><nav class="flex gap-2"><button id="nav-calendar" onclick="switchTab('calendar')" class="px-4 py-2 rounded-xl bg-indigo-600 text-white font-semibold">Календарь</button><button id="nav-students" onclick="switchTab('students')" class="px-4 py-2 rounded-xl bg-slate-100 font-semibold">Финансы</button><button onclick="teacherLogout()" class="px-3 py-2 rounded-xl bg-red-50 text-red-600">Выйти</button></nav></header>

<div id="teacher-login-modal" class="hidden fixed inset-0 modal-bg z-50 items-center justify-center p-4"><div class="app-card rounded-3xl p-6 w-full max-w-sm space-y-3"><h2 class="text-xl font-bold">Вход преподавателя</h2><input id="teacher-password-input" type="password" class="soft-input w-full rounded-xl px-3 py-2" placeholder="Пароль" onkeydown="if(event.key==='Enter')loginTeacher()"><button onclick="loginTeacher()" class="primary-btn w-full rounded-xl py-2 font-semibold">Войти</button><p id="teacher-login-error" class="text-sm text-red-600"></p></div></div>

<div id="lesson-modal" class="hidden fixed inset-0 modal-bg z-50 items-center justify-center p-4"><div class="app-card rounded-3xl p-6 w-full max-w-md space-y-3">
<div class="flex justify-between"><h2 id="lesson-modal-title" class="text-xl font-bold">Новое занятие</h2><button onclick="closeLessonModal()" class="text-2xl text-slate-400">×</button></div><input type="hidden" id="edit-id">
<label class="text-sm font-semibold">Ученик<select id="edit-student" class="soft-input mt-1 w-full rounded-xl px-3 py-2"></select></label>
<div class="grid grid-cols-2 gap-3"><label class="text-sm font-semibold">Дата<input id="edit-date" type="date" class="soft-input mt-1 w-full rounded-xl px-3 py-2"></label><label class="text-sm font-semibold">Длительность<select id="edit-duration" class="soft-input mt-1 w-full rounded-xl px-3 py-2"><option value="60">60 минут</option><option value="45">45 минут</option></select></label></div>
<div><label class="text-sm font-semibold">Время</label><div class="grid grid-cols-2 gap-2 mt-1"><select id="edit-hour" class="soft-input rounded-xl px-3 py-2"></select><select id="edit-minute" class="soft-input rounded-xl px-3 py-2"></select></div></div>
<label class="text-sm font-semibold">Стоимость<select id="edit-price" class="soft-input mt-1 w-full rounded-xl px-3 py-2"></select></label>
<label class="text-sm font-semibold">Статус<select id="edit-status" class="soft-input mt-1 w-full rounded-xl px-3 py-2"></select></label>
<div id="recurring-box" class="rounded-2xl bg-indigo-50 p-3 space-y-3"><label class="flex items-center gap-2 text-sm font-semibold"><input id="edit-recurring" type="checkbox" onchange="toggleRecurring()"> Повторять еженедельно</label><div id="recurring-days" class="hidden grid grid-cols-4 sm:grid-cols-7 gap-2 text-xs"><label><input type="checkbox" value="1" class="rec-day"> Пн</label><label><input type="checkbox" value="2" class="rec-day"> Вт</label><label><input type="checkbox" value="3" class="rec-day"> Ср</label><label><input type="checkbox" value="4" class="rec-day"> Чт</label><label><input type="checkbox" value="5" class="rec-day"> Пт</label><label><input type="checkbox" value="6" class="rec-day"> Сб</label><label><input type="checkbox" value="0" class="rec-day"> Вс</label></div></div>
<div class="flex justify-between pt-2"><div class="flex gap-2"><button id="delete-one-btn" onclick="deleteLessonFromModal()" class="hidden px-3 py-2 rounded-xl bg-red-50 text-red-600 text-xs font-semibold">Удалить</button><button id="delete-follow-btn" onclick="deleteThisAndFollowingFromModal()" class="hidden px-3 py-2 rounded-xl bg-red-100 text-red-700 text-xs font-semibold">Удалить это и следующие</button></div><button onclick="saveLesson()" class="primary-btn px-5 py-2 rounded-xl font-semibold">Сохранить</button></div>
</div></div>

<div id="student-modal" class="hidden fixed inset-0 modal-bg z-50 items-center justify-center p-4"><div class="app-card rounded-3xl p-6 w-full max-w-md space-y-3"><div class="flex justify-between"><h2 class="text-xl font-bold">Ученик</h2><button onclick="closeModal('student-modal')" class="text-2xl text-slate-400">×</button></div><input type="hidden" id="student-edit-id"><label class="text-sm font-semibold">Имя<input id="student-edit-name" class="soft-input mt-1 w-full rounded-xl px-3 py-2"></label><label class="text-sm font-semibold">PIN<input id="student-edit-pin" class="soft-input mt-1 w-full rounded-xl px-3 py-2"></label><label class="text-sm font-semibold">Стоимость занятия<select id="student-edit-price" class="soft-input mt-1 w-full rounded-xl px-3 py-2"></select></label><button onclick="saveStudent()" class="primary-btn w-full rounded-xl py-2 font-semibold">Сохранить</button></div></div>

<div id="group-choice-modal" class="hidden fixed inset-0 modal-bg z-50 items-center justify-center p-4"><div class="app-card rounded-3xl p-6 w-full max-w-sm space-y-3"><div class="flex justify-between items-center"><h2 class="text-xl font-bold">Включить в группу</h2><button onclick="closeModal('group-choice-modal')" class="text-2xl text-slate-400">×</button></div><div id="group-choice-form"></div></div></div><div id="add-modal" class="hidden fixed inset-0 modal-bg z-50 items-center justify-center p-4"><div class="app-card rounded-3xl p-6 w-full max-w-md space-y-4"><div class="flex justify-between"><h2 class="text-xl font-bold">Добавить</h2><button onclick="closeModal('add-modal')" class="text-2xl text-slate-400">×</button></div><div class="grid grid-cols-3 gap-2"><button onclick="showAddForm('student')" class="rounded-xl bg-indigo-50 p-3 font-semibold">Ученик</button><button onclick="showAddForm('group')" class="rounded-xl bg-violet-50 p-3 font-semibold">Группа</button><button onclick="showAddForm('payment')" class="rounded-xl bg-emerald-50 p-3 font-semibold">Платёж</button></div><div id="add-form"></div></div></div>

<main>
<section id="tab-calendar">
<div class="app-card rounded-3xl p-5"><div class="flex justify-between items-center mb-4"><div><h2 class="font-bold text-lg">Календарь</h2><p id="week-range" class="text-xs text-slate-400"></p></div><div class="flex gap-2"><button onclick="changeWeek(-1)" class="px-3 py-2 rounded-xl bg-slate-100">←</button><button onclick="goToday()" class="px-3 py-2 rounded-xl bg-indigo-50 text-indigo-700 font-semibold">Сегодня</button><button onclick="changeWeek(1)" class="px-3 py-2 rounded-xl bg-slate-100">→</button></div></div><div id="week-calendar" class="grid grid-cols-7 gap-1"></div></div>
<div class="app-card rounded-3xl p-5 mt-4"><h2 id="selected-day-title" class="font-bold text-lg mb-3"></h2><div id="day-lessons"></div></div>
<button onclick="openNewLessonForDate(selectedDate)" class="fixed right-6 bottom-6 w-14 h-14 rounded-full bg-indigo-600 text-white text-3xl shadow-xl hover:bg-indigo-700">+</button>
</section>

<section id="tab-students" class="hidden"><div class="app-card rounded-3xl p-5">
<div class="flex justify-between items-center mb-4"><h2 class="font-bold text-lg">Группы</h2></div><div id="groups-list" class="space-y-2 mb-6"></div>
<div class="flex justify-between items-center mb-4"><div><h2 class="font-bold text-lg">Ученики</h2><p class="text-xs text-slate-400">Нажмите на ученика, чтобы увидеть детали</p></div><label class="flex items-center gap-2 text-sm"><input id="show-archived" type="checkbox" onchange="renderStudents()"> Показать архив</label></div>
<div id="students-list" class="space-y-2"></div></div>
<button onclick="openAdd()" class="fixed right-6 bottom-6 w-14 h-14 rounded-full bg-indigo-600 text-white text-3xl shadow-xl">+</button></section>
</main><div id="error-box" class="hidden fixed bottom-4 left-4 bg-red-50 border border-red-200 text-red-700 p-3 rounded-xl shadow-lg"></div>
</div></div>

<script>
const SUPABASE_URL='https://dmasuczggcxzrxasgoov.supabase.co',SUPABASE_KEY='sb_publishable_nXL_z4-dtwKcGXmMAXgJSg_v1Op_W1q',API=SUPABASE_URL+'/rest/v1';
const headers={apikey:SUPABASE_KEY,Authorization:'Bearer '+SUPABASE_KEY,'Content-Type':'application/json'};
const {createClient}=supabase; createClient(SUPABASE_URL,SUPABASE_KEY);
let students=[],lessons=[],payments=[],groups=[],selectedDate=localISO(new Date()),weekAnchor=new Date();
const statusLabels={pending:'Запланировано',conducted:'Проведено',rescheduled:'Перенесено',cancelled_charge:'Отменено — списать',cancelled_free:'Отменено — не списывать'};
const charge=new Set(['conducted','cancelled_charge']);
const statusClass={pending:'bg-amber-100 text-amber-800',conducted:'bg-emerald-100 text-emerald-800',rescheduled:'bg-blue-100 text-blue-800',cancelled_charge:'bg-red-100 text-red-800',cancelled_free:'bg-slate-100 text-slate-700'};
const archived=new Set();

function localISO(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function esc(v){return String(v??'').replace(/[&<>'\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
function money(n){return Number(n||0).toLocaleString('ru-RU',{maximumFractionDigits:2})+' BYN'}
function showError(e){console.error(e);const b=document.getElementById('error-box');b.textContent='Ошибка: '+(e.message||e);b.classList.remove('hidden');setTimeout(()=>b.classList.add('hidden'),5000)}
async function db(path,opt={}){const r=await fetch(API+path,{...opt,headers:{...headers,...(opt.headers||{})}}),t=await r.text();if(!r.ok)throw new Error(t||r.statusText);return t.trim()?JSON.parse(t):null}
async function loadData(){[students,lessons,payments,groups]=await Promise.all([db('/students?select=id,name,pin,price,group_id,archived'),db('/lessons?select=id,student,date,time,price,status,duration'),db('/payments?select=id,student,amount,date'),db('/groups?select=id,name')]);students=students||[];lessons=lessons||[];payments=payments||[];groups=groups||[];archived.clear();students.filter(s=>s.archived).forEach(s=>archived.add(String(s.id)));await autoCompletePastLessons()}
async function autoCompletePastLessons(){const now=new Date(),today=localISO(now),nowTime=String(now.getHours()).padStart(2,'0')+':'+String(now.getMinutes()).padStart(2,'0'),due=lessons.filter(l=>l.status==='pending'&&l.date&&((l.date<today)||(l.date===today&&String(l.time||'23:59').slice(0,5)<=nowTime)));if(!due.length)return;for(const l of due)await db('/lessons?id=eq.'+encodeURIComponent(l.id),{method:'PATCH',headers:{...headers,Prefer:'return=minimal'},body:JSON.stringify({status:'conducted'})});due.forEach(l=>l.status='conducted')}
function studentStats(s){const ls=lessons.filter(l=>l.student===s.name),income=payments.filter(p=>p.student===s.name).reduce((a,p)=>a+Number(p.amount||0),0),expenses=ls.filter(l=>charge.has(l.status)).reduce((a,l)=>a+Number(l.price||0),0);return{ls,income,expenses,bal:income-expenses}}
function studentGroup(id){const s=students.find(x=>String(x.id)===String(id));return groups.find(g=>String(g.id)===String(s?.group_id))}
function balanceClass(b){return b>50?'balance-green':b>0?'balance-orange':b<0?'balance-red':'bg-slate-50'}

function switchTab(t){document.getElementById('tab-calendar').classList.toggle('hidden',t!=='calendar');document.getElementById('tab-students').classList.toggle('hidden',t!=='students');document.getElementById('nav-calendar').className='px-4 py-2 rounded-xl font-semibold '+(t==='calendar'?'bg-indigo-600 text-white':'bg-slate-100');document.getElementById('nav-students').className='px-4 py-2 rounded-xl font-semibold '+(t==='students'?'bg-indigo-600 text-white':'bg-slate-100');if(t==='calendar'){renderWeek();renderDay()}else renderStudents()}
function fillStudentSelects(){const active=students.filter(s=>!s.archived);['edit-student','add-payment-student'].forEach(id=>{const e=document.getElementById(id);if(e)e.innerHTML=active.map(s=>`<option value="${esc(s.name)}">${esc(s.name)}</option>`).join('')})}
function priceOptions(value){return [0,20,30,40,45,50,60,80,100].map(v=>`<option value="${v}" ${Number(value)===v?'selected':''}>${v} BYN</option>`).join('')}
function timeOptions(){document.getElementById('edit-hour').innerHTML=Array.from({length:17},(_,i)=>{const h=i+7;return `<option value="${String(h).padStart(2,'0')}">${String(h).padStart(2,'0')}</option>`}).join('');document.getElementById('edit-minute').innerHTML=Array.from({length:12},(_,i)=>{const m=i*5;return `<option value="${String(m).padStart(2,'0')}">${String(m).padStart(2,'0')}</option>`}).join('')}
function setTime(v){let x=String(v||'11:00').replace('.',':').split(':');document.getElementById('edit-hour').value=String(Number(x[0]||11)).padStart(2,'0');document.getElementById('edit-minute').value=String(x[1]||'00').padStart(2,'0')}
function getTime(){return document.getElementById('edit-hour').value+':'+document.getElementById('edit-minute').value}
function displayTime(v){if(!v)return '';const a=String(v).replace('.',':').split(':');return String(Number(a[0])).padStart(2,'0')+'.'+String(a[1]||'00').padStart(2,'0')}
function weekStart(d){const x=new Date(d);x.setHours(0,0,0,0);const day=x.getDay();x.setDate(x.getDate()+(day===0?-6:1-day));return x}
function changeWeek(n){weekAnchor=weekStart(weekAnchor);weekAnchor.setDate(weekAnchor.getDate()+n*7);selectedDate=localISO(weekAnchor);renderWeek();renderDay()}
function goToday(){weekAnchor=new Date();selectedDate=localISO(new Date());renderWeek();renderDay()}
function renderWeek(){const c=document.getElementById('week-calendar'),start=weekStart(weekAnchor),today=localISO(new Date()),days=[];for(let i=0;i<7;i++){const d=new Date(start);d.setDate(d.getDate()+i);days.push(d)}document.getElementById('week-range').textContent=days[0].toLocaleDateString('ru-RU',{day:'2-digit',month:'long'})+' — '+days[6].toLocaleDateString('ru-RU',{day:'2-digit',month:'long',year:'numeric'});c.innerHTML=days.map(d=>{const key=localISO(d),has=lessons.some(l=>l.date===key),sel=key===selectedDate,isToday=key===today;return `<button onclick="selectDay('${key}')" class="flex flex-col items-center py-2"><div class="text-xs text-slate-400 mb-1">${d.toLocaleDateString('ru-RU',{weekday:'short'}).replace('.','')}</div><div class="day-circle ${sel?'selected ':''}${isToday?'today':''}"><span class="font-bold">${d.getDate()}</span>${has?'<span class="day-dot"></span>':'<span class="h-[7px]"></span>'}</div></button>`}).join('')}
function selectDay(k){selectedDate=k;renderWeek();renderDay()}
function renderDay(){const title=document.getElementById('selected-day-title'),d=new Date(selectedDate+'T00:00:00');title.textContent=d.toLocaleDateString('ru-RU',{weekday:'long',day:'numeric',month:'long'});const ls=lessons.filter(l=>l.date===selectedDate).sort((a,b)=>String(a.time||'').localeCompare(String(b.time||'')));document.getElementById('day-lessons').innerHTML=ls.length?ls.map(l=>`<button onclick="openEditLesson('${esc(l.id)}')" class="w-full text-left border-b last:border-0 py-3 flex items-center gap-3 hover:bg-slate-50 rounded-xl px-2"><div class="w-16 font-bold">${esc(displayTime(l.time))}</div><div class="flex-1"><div class="font-semibold">${esc(l.student)}</div><div class="text-xs text-slate-500">${l.duration||60} мин · ${money(l.price)}</div></div><span class="status ${statusClass[l.status]||'bg-slate-100'}">${statusLabels[l.status]||l.status}</span></button>`).join(''):'<div class="py-8 text-center text-slate-400">На этот день занятий нет</div>'}

function openNewLessonForDate(date){fillStudentSelects();timeOptions();document.getElementById('edit-id').value='';document.getElementById('edit-date').value=date||selectedDate;document.getElementById('edit-duration').value='60';setTime('11:00');document.getElementById('edit-status').innerHTML=Object.entries(statusLabels).map(([k,v])=>`<option value="${k}">${v}</option>`).join('');document.getElementById('edit-status').value='pending';const s=students.find(x=>!x.archived);document.getElementById('edit-student').value=s?.name||'';document.getElementById('edit-price').innerHTML=priceOptions(s?.price??40);document.getElementById('recurring-box').classList.remove('hidden');document.getElementById('edit-recurring').checked=false;toggleRecurring();document.querySelectorAll('.rec-day').forEach(x=>x.checked=false);document.getElementById('lesson-modal-title').textContent='Новое занятие';document.getElementById('delete-one-btn').classList.add('hidden');document.getElementById('delete-follow-btn').classList.add('hidden');showModal('lesson-modal')}
function openEditLesson(id){const l=lessons.find(x=>String(x.id)===String(id));if(!l)return;fillStudentSelects();timeOptions();document.getElementById('edit-id').value=l.id;document.getElementById('edit-student').value=l.student;document.getElementById('edit-date').value=l.date;document.getElementById('edit-duration').value=String(l.duration||60);setTime(l.time||'11:00');document.getElementById('edit-price').innerHTML=priceOptions(l.price);document.getElementById('edit-status').innerHTML=Object.entries(statusLabels).map(([k,v])=>`<option value="${k}">${v}</option>`).join('');document.getElementById('edit-status').value=l.status||'pending';document.getElementById('recurring-box').classList.add('hidden');document.getElementById('delete-one-btn').classList.remove('hidden');document.getElementById('delete-follow-btn').classList.remove('hidden');document.getElementById('lesson-modal-title').textContent='Редактировать занятие';showModal('lesson-modal')}
function toggleRecurring(){document.getElementById('recurring-days').classList.toggle('hidden',!document.getElementById('edit-recurring').checked)}
async function saveLesson(){try{const id=document.getElementById('edit-id').value,student=document.getElementById('edit-student').value,date=document.getElementById('edit-date').value,time=getTime(),duration=Number(document.getElementById('edit-duration').value),price=Number(document.getElementById('edit-price').value),status=document.getElementById('edit-status').value;if(!student||!date)return showError(new Error('Выберите ученика и дату'));if(id){await db('/lessons?id=eq.'+encodeURIComponent(id),{method:'PATCH',headers:{...headers,Prefer:'return=minimal'},body:JSON.stringify({student,date,time,price,status,duration})})}else{const recurring=document.getElementById('edit-recurring').checked;if(recurring){let days=[...document.querySelectorAll('.rec-day:checked')].map(x=>Number(x.value));if(!days.length)days=[new Date(date+'T00:00:00').getDay()];let cur=new Date(date+'T00:00:00');for(let i=0;i<90;i++){if(days.includes(cur.getDay()))await db('/lessons',{method:'POST',headers:{...headers,Prefer:'return=minimal'},body:JSON.stringify({student,date:localISO(cur),time,price,status:'pending',duration})});cur.setDate(cur.getDate()+1)}}else await db('/lessons',{method:'POST',headers:{...headers,Prefer:'return=minimal'},body:JSON.stringify({student,date,time,price,status,duration})})}closeLessonModal();await loadData();renderWeek();renderDay()}catch(e){showError(e)}}
async function deleteLessonFromModal(){const id=document.getElementById('edit-id').value;if(!id)return;await deleteLesson(id);closeLessonModal()}
async function deleteLesson(id){if(!confirm('Удалить это занятие?'))return;try{await db('/lessons?id=eq.'+encodeURIComponent(id),{method:'DELETE',headers});await loadData();renderWeek();renderDay()}catch(e){showError(e)}}
async function deleteThisAndFollowingFromModal(){const id=document.getElementById('edit-id').value,l=lessons.find(x=>String(x.id)===String(id));if(!l)return;if(!confirm('Удалить это занятие и все следующие у этого ученика начиная с '+l.date+'?'))return;try{for(const x of lessons.filter(x=>x.student===l.student&&x.date>=l.date))await db('/lessons?id=eq.'+encodeURIComponent(x.id),{method:'DELETE',headers});closeLessonModal();await loadData();renderWeek();renderDay()}catch(e){showError(e)}}
function closeLessonModal(){closeModal('lesson-modal')}
function showModal(id){const e=document.getElementById(id);e.classList.remove('hidden');e.classList.add('flex')}
function closeModal(id){const e=document.getElementById(id);e.classList.add('hidden');e.classList.remove('flex')}

function renderStudents(){renderGroups();const show=document.getElementById('show-archived').checked,active=students.filter(s=>show||!s.archived);const c=document.getElementById('students-list');c.innerHTML=active.length?active.map(s=>studentRow(s)).join(''):'<div class="py-8 text-center text-slate-400">Учеников нет</div>'}
function studentRow(s){const st=studentStats(s),g=studentGroup(s.id),isArchived=!!s.archived,id=String(s.id);return `<div class="border rounded-2xl overflow-visible mb-2 ${isArchived?'opacity-60':''}"><div onclick="toggleStudentDetail('${esc(id)}')" class="p-4 flex items-center gap-3 cursor-pointer hover:bg-slate-50"><div class="flex-1 min-w-0"><div class="font-semibold">${esc(s.name)}</div><div class="text-xs text-slate-400">${esc(g?.name||'без группы')}${isArchived?' · архив':''}</div></div><div class="px-3 py-2 rounded-xl font-bold text-sm ${balanceClass(st.bal)}">${money(st.bal)}</div><div class="relative"><button onclick="event.stopPropagation();toggleStudentMenu('${esc(id)}')" class="w-9 h-9 rounded-xl bg-slate-100 text-xl">⋮</button><div id="menu-${esc(id)}" class="hidden absolute right-0 top-10 z-20 bg-white border rounded-2xl shadow-xl p-2 w-56"><button onclick="openStudentEdit('${esc(id)}')" class="block w-full text-left px-3 py-2 rounded-xl hover:bg-slate-100">Изменить</button><button onclick="addToGroup('${esc(id)}')" class="block w-full text-left px-3 py-2 rounded-xl hover:bg-slate-100">Включить в группу</button><button onclick="copyStudentLink('${esc(id)}')" class="block w-full text-left px-3 py-2 rounded-xl hover:bg-slate-100">Ссылка для ученика</button><button onclick="toggleArchive('${esc(id)}')" class="block w-full text-left px-3 py-2 rounded-xl hover:bg-slate-100">${isArchived?'Вернуть из архива':'Заархивировать'}</button><button onclick="removeStudent('${esc(id)}')" class="block w-full text-left px-3 py-2 rounded-xl hover:bg-red-50 text-red-600">Удалить ученика</button></div></div></div><div id="detail-${esc(id)}" class="hidden border-t bg-slate-50 p-4">${studentDetail(s)}</div></div>`}
function studentDetail(s){const st=studentStats(s),charges=st.ls.filter(l=>charge.has(l.status)).sort((a,b)=>(String(b.date)+String(b.time)).localeCompare(String(a.date)+String(a.time)));return `<div class="grid grid-cols-3 gap-2 text-sm mb-4"><div><span class="text-slate-400">Внесено</span><br><b>${money(st.income)}</b></div><div><span class="text-slate-400">Списано</span><br><b>${money(st.expenses)}</b></div><div><span class="text-slate-400">Баланс</span><br><b>${money(st.bal)}</b></div></div><div class="grid grid-cols-2 gap-2 text-sm mb-4"><div><span class="text-slate-400">Проведенных занятий</span><br><b>${st.ls.filter(l=>l.status==='conducted').length}</b></div><div><span class="text-slate-400">Стоимость за занятие</span><br><b>${money(s.price||0)}</b></div></div><h4 class="font-semibold mb-2">Списания за занятия</h4><div class="space-y-1 text-sm">${charges.map(l=>`<div class="flex justify-between"><span>${esc(l.date)}${l.time?' · '+esc(displayTime(l.time)):''}</span><b>-${money(l.price)}</b></div>`).join('')||'<span class="text-slate-400">Списаний нет</span>'}</div>`}
function toggleStudentDetail(id){document.getElementById('detail-'+id)?.classList.toggle('hidden')}
function toggleStudentMenu(id){document.querySelectorAll('[id^="menu-"]').forEach(x=>{if(x.id!=='menu-'+id)x.classList.add('hidden')});document.getElementById('menu-'+id)?.classList.toggle('hidden')}
async function openStudentEdit(id){const s=students.find(x=>String(x.id)===String(id));if(!s)return;document.getElementById('student-edit-id').value=id;document.getElementById('student-edit-name').value=s.name;document.getElementById('student-edit-pin').value=s.pin||'';document.getElementById('student-edit-price').innerHTML=priceOptions(s.price??40);showModal('student-modal')}
async function saveStudent(){try{const id=document.getElementById('student-edit-id').value,s=students.find(x=>String(x.id)===String(id)),name=document.getElementById('student-edit-name').value.trim(),pin=document.getElementById('student-edit-pin').value.trim(),price=Number(document.getElementById('student-edit-price').value);if(!s||!name)return;const old=s.name;if(old!==name){await db('/lessons?student=eq.'+encodeURIComponent(old),{method:'PATCH',headers:{...headers,Prefer:'return=minimal'},body:JSON.stringify({student:name})});await db('/payments?student=eq.'+encodeURIComponent(old),{method:'PATCH',headers:{...headers,Prefer:'return=minimal'},body:JSON.stringify({student:name})})}await db('/students?id=eq.'+encodeURIComponent(id),{method:'PATCH',headers:{...headers,Prefer:'return=minimal'},body:JSON.stringify({name,pin,price})});closeModal('student-modal');await loadData();renderStudents()}catch(e){showError(e)}}
async function copyStudentLink(id){const url=new URL(location.href);url.search='';url.searchParams.set('student',id);try{await navigator.clipboard.writeText(url.toString());alert('Ссылка для ученика скопирована.')}catch(e){prompt('Скопируйте ссылку:',url.toString())}}
async function toggleArchive(id){const s=students.find(x=>String(x.id)===String(id));if(!s)return;try{await db('/students?id=eq.'+encodeURIComponent(id),{method:'PATCH',headers:{...headers,Prefer:'return=minimal'},body:JSON.stringify({archived:!s.archived})});await loadData();renderStudents()}catch(e){showError(e)}}
async function removeStudent(id){const s=students.find(x=>String(x.id)===String(id));if(!s)return;const from=prompt('Если хотите удалить будущие занятия, укажите дату YYYY-MM-DD. Оставьте пусто, чтобы сохранить все занятия.');if(from===null)return;try{if(from.trim()){for(const l of lessons.filter(x=>x.student===s.name&&x.date>=from.trim()))await db('/lessons?id=eq.'+encodeURIComponent(l.id),{method:'DELETE',headers})}await db('/students?id=eq.'+encodeURIComponent(id),{method:'DELETE',headers});await loadData();renderStudents()}catch(e){showError(e)}}

function renderGroups(){const c=document.getElementById('groups-list');c.innerHTML=groups.length?groups.map(g=>{const members=students.filter(s=>String(s.group_id)===String(g.id)),total=members.reduce((a,s)=>a+studentStats(s).bal,0);return `<div class="border rounded-2xl overflow-hidden"><button onclick="toggleGroup('${esc(g.id)}')" class="w-full p-3 flex justify-between items-center hover:bg-slate-50"><span class="font-semibold">${esc(g.name)}</span><span class="text-sm font-bold px-2 py-1 rounded-lg ${balanceClass(total)}">${money(total)}</span></button><div id="group-${esc(g.id)}" class="${open?'':'hidden'} border-t bg-slate-50 p-3">${members.length?members.map(s=>`<div class="flex justify-between items-center py-2"><span>${esc(s.name)} <span class="text-xs text-slate-400">${money(studentStats(s).bal)}</span></span><button onclick="removeFromGroup('${esc(g.id)}','${esc(s.id)}')" class="text-xs text-red-600">Убрать</button></div>`).join(''):'<span class="text-sm text-slate-400">В группе пока нет учеников</span>'}</div></div>`}).join(''):'<div class="text-sm text-slate-400">Групп пока нет</div>'}
function toggleGroup(id){document.getElementById('group-'+id)?.classList.toggle('hidden')}
function openAdd(type){showModal('add-modal');showAddForm(type||'student')}
function showAddForm(type){const c=document.getElementById('add-form');if(type==='student')c.innerHTML=`<div class="space-y-3"><input id="add-student-name" class="soft-input w-full rounded-xl px-3 py-2" placeholder="Имя"><input id="add-student-pin" class="soft-input w-full rounded-xl px-3 py-2" placeholder="PIN"><label class="text-sm font-semibold">Группа<select id="add-student-group" class="soft-input mt-1 w-full rounded-xl px-3 py-2"><option value="">без группы</option>${groups.map(g=>`<option value="${esc(g.id)}">${esc(g.name)}</option>`).join('')}</select></label><button onclick="addStudent()" class="primary-btn w-full rounded-xl py-2 font-semibold">Добавить</button></div>`;if(type==='group')c.innerHTML=`<div class="space-y-3"><input id="add-group-name" class="soft-input w-full rounded-xl px-3 py-2" placeholder="Название группы"><button onclick="addGroup()" class="primary-btn w-full rounded-xl py-2 font-semibold">Создать группу</button></div>`;if(type==='payment'){fillStudentSelects();c.innerHTML=`<div class="space-y-3"><select id="add-payment-student" class="soft-input w-full rounded-xl px-3 py-2"></select><input id="add-payment-amount" type="number" step="0.01" class="soft-input w-full rounded-xl px-3 py-2" placeholder="Сумма"><input id="add-payment-date" type="date" value="${localISO(new Date())}" class="soft-input w-full rounded-xl px-3 py-2"><button onclick="addPayment()" class="primary-btn w-full rounded-xl py-2 font-semibold">Внести платеж</button></div>`;fillStudentSelects()}}
async function addStudent(){try{const name=document.getElementById('add-student-name').value.trim(),pin=document.getElementById('add-student-pin').value.trim(),gid=document.getElementById('add-student-group').value;if(!name||!pin)return showError(new Error('Введите имя и PIN'));await db('/students',{method:'POST',headers:{...headers,Prefer:'return=minimal'},body:JSON.stringify({name,pin,price:40,group_id:gid||null,archived:false})});closeModal('add-modal');await loadData();renderStudents()}catch(e){showError(e)}}
async function addGroup(){const name=document.getElementById('add-group-name').value.trim();if(!name)return;try{await db('/groups',{method:'POST',headers:{...headers,Prefer:'return=minimal'},body:JSON.stringify({name})});closeModal('add-modal');await loadData();renderStudents()}catch(e){showError(e)}}
function addToGroup(id){if(!groups.length)return alert('Сначала создайте группу');const f=document.getElementById('group-choice-form');f.innerHTML='<label class="text-sm font-semibold">Группа<select id="choose-group" class="soft-input mt-1 w-full rounded-xl px-3 py-3">'+groups.map(g=>'<option value="'+esc(g.id)+'">'+esc(g.name)+'</option>').join('')+'</select></label><div class="flex gap-2 mt-4"><button onclick="closeModal(\'group-choice-modal\')" class="flex-1 px-4 py-3 rounded-xl bg-slate-100">Отмена</button><button onclick="confirmAddToGroup(\''+id+'\')" class="flex-1 primary-btn rounded-xl py-3 font-semibold">Добавить</button></div>';showModal('group-choice-modal')}
async function confirmAddToGroup(id){const gid=document.getElementById('choose-group')?.value;if(!gid)return;try{await db('/students?id=eq.'+encodeURIComponent(id),{method:'PATCH',headers:{...headers,Prefer:'return=minimal'},body:JSON.stringify({group_id:gid})});closeModal('group-choice-modal');await loadData();renderStudents()}catch(e){showError(e)}}
async function removeFromGroup(gid,sid){try{await db('/students?id=eq.'+encodeURIComponent(sid),{method:'PATCH',headers:{...headers,Prefer:'return=minimal'},body:JSON.stringify({group_id:null})});await loadData();renderStudents()}catch(e){showError(e)}}
async function addPayment(){try{const student=document.getElementById('add-payment-student').value,amount=Number(document.getElementById('add-payment-amount').value),date=document.getElementById('add-payment-date').value;if(!student||!amount||!date)return showError(new Error('Заполните данные платежа'));await db('/payments',{method:'POST',headers:{...headers,Prefer:'return=minimal'},body:JSON.stringify({student,amount,date})});closeModal('add-modal');await loadData();renderStudents()}catch(e){showError(e)}}

function loginTeacher(){if(document.getElementById('teacher-password-input').value){localStorage.setItem('tutor_logged_in','true');closeModal('teacher-login-modal');loadData().then(()=>{renderWeek();renderDay()})}else document.getElementById('teacher-login-error').textContent='Введите пароль'}
function teacherLogout(){localStorage.removeItem('tutor_logged_in');location.reload()}
let publicStudent=null;
async function initPublicStudent(){const id=new URLSearchParams(location.search).get('student');if(!id)return false;document.getElementById('student-public-view').classList.remove('hidden');try{const d=await db('/students?id=eq.'+encodeURIComponent(id)+'&select=*');publicStudent=d?.[0];if(publicStudent)document.getElementById('student-public-name').textContent='Ученик: '+publicStudent.name;else document.getElementById('student-public-name').textContent='Ученик не найден'}catch(e){document.getElementById('student-public-error').textContent=e.message}return true}
async function openStudentCabinet(){if(!publicStudent)return;const pin=document.getElementById('student-public-pin').value.trim();if(pin!==String(publicStudent.pin||'')){document.getElementById('student-public-error').textContent='Неверный PIN';return}try{const ls=await db('/lessons?student=eq.'+encodeURIComponent(publicStudent.name)+'&select=id,date,time,price,status,duration'),ps=await db('/payments?student=eq.'+encodeURIComponent(publicStudent.name)+'&select=amount,date');const paid=ps.reduce((a,p)=>a+Number(p.amount||0),0),spent=ls.filter(l=>charge.has(l.status)).reduce((a,l)=>a+Number(l.price||0),0);document.getElementById('public-student-title').textContent=publicStudent.name;document.getElementById('public-paid').textContent=money(paid);document.getElementById('public-spent').textContent=money(spent);document.getElementById('public-balance').textContent=money(paid-spent);document.getElementById('public-lessons').innerHTML=ls.sort((a,b)=>(String(b.date)+String(b.time)).localeCompare(String(a.date)+String(a.time))).slice(0,200).map(l=>`<tr class="border-b"><td class="p-2">${esc(l.date)}</td><td class="p-2">${esc(displayTime(l.time))}</td><td class="p-2">${l.duration||60} мин</td><td class="p-2">${money(l.price)}</td><td class="p-2">${statusLabels[l.status]||l.status}</td></tr>`).join('');document.getElementById('student-public-login').classList.add('hidden');document.getElementById('student-public-content').classList.remove('hidden')}catch(e){document.getElementById('student-public-error').textContent=e.message}}
async function initApp(){if(await initPublicStudent())return;document.getElementById('teacher-app').classList.remove('hidden');if(localStorage.getItem('tutor_logged_in')==='true'){try{await loadData();renderWeek();renderDay()}catch(e){showError(e)}}else showModal('teacher-login-modal')}
document.addEventListener('click',e=>{if(!e.target.closest('[id^="menu-"]')&&!e.target.closest('button'))document.querySelectorAll('[id^="menu-"]').forEach(x=>x.classList.add('hidden'))});
document.addEventListener('DOMContentLoaded',initApp);
</script>
<script id="hide-student-lessons-block-v1">
(function(){
  function hideLessonsBlock(){
    const el=document.getElementById('tab-lessons');
    if(el) el.classList.add('hidden');
  }
  hideLessonsBlock();
  document.addEventListener('DOMContentLoaded',hideLessonsBlock);
  setTimeout(hideLessonsBlock,100);
  setTimeout(hideLessonsBlock,500);
  setTimeout(hideLessonsBlock,1000);
})();
</script>

</body></html>
