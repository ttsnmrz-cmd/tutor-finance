<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tutor Finance</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-50 min-h-screen flex flex-col items-center justify-center p-4 font-sans">

    <div id="app" class="max-w-4xl w-full">
        <!-- Контент рендерится динамически -->
    </div>

    <script>
        const SUPABASE_URL = 'https://dmasuczggcxzrxasgoov.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_9XV4TmmWv1OHVvbdei2jhA__Bu4FsQG';
        const { createClient } = supabase;
        const supabaseClient = createClient(SUPABASE_URL, SUPABASE_KEY);

        let currentUser = JSON.parse(sessionStorage.getItem('auth_user')) || null;
        let students = [], lessons = [], payments = [];

        async function loadData() {
            try {
                const [sRes, lRes, pRes] = await Promise.all([
                    supabaseClient.from('students').select('*'),
                    supabaseClient.from('lessons').select('*'),
                    supabaseClient.from('payments').select('*')
                ]);
                students = sRes.data || [];
                lessons = lRes.data || [];
                payments = pRes.data || [];
            } catch (err) {
                console.error("Ошибка загрузки данных из базы:", err);
            }
            render();
        }

        function render() {
            const app = document.getElementById('app');
            
            if (!currentUser) {
                app.innerHTML = `
                    <div class="bg-white p-8 rounded-3xl shadow-sm border border-slate-100 text-center max-w-md mx-auto">
                        <h1 class="text-2xl font-bold mb-2 text-slate-800">Tutor Finance</h1>
                        <p class="text-slate-400 text-sm mb-6">Система учета занятий</p>
                        <div class="space-y-3">
                            <button onclick="loginAsTutor()" class="w-full py-3 bg-indigo-600 text-white font-semibold rounded-xl hover:bg-indigo-700 transition cursor-pointer">Вход для преподавателя</button>
                            <button onclick="loginAsStudentPrompt()" class="w-full py-3 bg-slate-100 text-slate-700 font-semibold rounded-xl hover:bg-slate-200 transition cursor-pointer">Вход для ученика (PIN)</button>
                        </div>
                    </div>
                `;
                return;
            }

            if (currentUser.role === 'tutor') {
                app.innerHTML = `
                    <div class="bg-white p-8 rounded-3xl shadow-sm border border-slate-100">
                        <div class="flex justify-between items-center mb-8">
                            <div>
                                <h1 class="text-xl font-bold text-slate-800">Кабинет преподавателя</h1>
                                <p class="text-slate-400 text-sm">Добро пожаловать, ${currentUser.name}</p>
                            </div>
                            <button onclick="logout()" class="px-4 py-2 bg-slate-100 text-slate-600 rounded-xl text-sm font-medium hover:bg-slate-200 transition cursor-pointer">Выйти</button>
                        </div>
                        <div class="space-y-4">
                            <p class="text-slate-600">Панель управления активна. База данных подключена.</p>
                            <div class="p-4 bg-slate-50 rounded-2xl border border-slate-100">
                                <span class="text-xs text-slate-400 uppercase tracking-wider">Статистика</span>
                                <div class="grid grid-cols-2 gap-4 mt-2">
                                    <div>Учеников в базе: <b>${students.length}</b></div>
                                    <div>Всего занятий: <b>${lessons.length}</b></div>
                                </div>
                            </div>
                        </div>
                    </div>
                `;
            } else if (currentUser.role === 'student') {
                app.innerHTML = `
                    <div class="bg-white p-8 rounded-3xl shadow-sm border border-slate-100">
                        <div class="flex justify-between items-center mb-8">
                            <div>
                                <h1 class="text-xl font-bold text-slate-800">Кабинет ученика</h1>
                                <p class="text-slate-400 text-sm">Привет, ${currentUser.name}</p>
                            </div>
                            <button onclick="logout()" class="px-4 py-2 bg-slate-100 text-slate-600 rounded-xl text-sm font-medium hover:bg-slate-200 transition cursor-pointer">Выйти</button>
                        </div>
                        <p class="text-slate-600">Здесь отображается ваш прогресс и расписание.</p>
                    </div>
                `;
            }
        }

        async function loginAsTutor() {
            const emailInput = prompt("Введите email преподавателя:");
            if (!emailInput) return;
            const passwordInput = prompt("Введите пароль преподавателя:");
            if (!passwordInput) return;

            try {
                const { data, error } = await supabaseClient
                    .from('tutors')
                    .select('*')
                    .eq('email', emailInput.trim())
                    .eq('password', passwordInput.trim());

                if (error) throw error;

                if (data && data.length > 0) {
                    currentUser = { role: 'tutor', name: data[0].name || 'Преподаватель' };
                    sessionStorage.setItem('auth_user', JSON.stringify(currentUser));
                    render();
                } else {
                    alert("Неверный email или пароль!");
                }
            } catch (err) {
                console.error("Ошибка авторизации:", err);
                alert("Ошибка при проверке данных.");
            }
        }

        async function loginAsStudentPrompt() {
            // Проверка блокировки
            const blockUntil = localStorage.getItem('student_block_until');
            if (blockUntil) {
                const now = new Date().getTime();
                if (now < parseInt(blockUntil)) {
                    const minutesLeft = Math.ceil((parseInt(blockUntil) - now) / 60000);
                    alert(`Вход заблокирован из-за трех неверных попыток. Попробуйте через ${minutesLeft} мин.`);
                    return;
                } else {
                    localStorage.removeItem('student_block_until');
                    localStorage.removeItem('student_failed_attempts');
                }
            }

            const pinInput = prompt("Введите ваш PIN-код ученика:");
            if (!pinInput) return;

            try {
                const { data, error } = await supabaseClient
                    .from('students')
                    .select('*')
                    .eq('pin', pinInput.trim());

                if (error) throw error;

                if (data && data.length > 0) {
                    // Успешный вход — сбрасываем счетчик неудач
                    localStorage.removeItem('student_failed_attempts');
                    localStorage.removeItem('student_block_until');

                    currentUser = { role: 'student', name: data[0].name || 'Ученик', id: data[0].id };
                    sessionStorage.setItem('auth_user', JSON.stringify(currentUser));
                    render();
                } else {
                    // Неверный PIN — считаем попытки
                    let attempts = parseInt(localStorage.getItem('student_failed_attempts') || '0') + 1;
                    localStorage.setItem('student_failed_attempts', attempts);

                    if (attempts >= 3) {
                        const blockTime = new Date().getTime() + 15 * 60 * 1000; // 15 минут
                        localStorage.setItem('student_block_until', blockTime);
                        alert("Неверный PIN-код. Превышено количество попыток. Вход заблокирован на 15 минут.");
                    } else {
                        alert(`Неверный PIN-код. Осталось попыток: ${3 - attempts}`);
                    }
                }
            } catch (err) {
                console.error("Ошибка входа ученика:", err);
                alert("Ошибка при проверке PIN-кода.");
            }
        }

        function logout() { 
            currentUser = null; 
            sessionStorage.removeItem('auth_user');
            render(); 
        }

        loadData();
    </script>

<script id="hide-student-lessons-block-v1">
(function(){
  function hideLessonsBlock(){
    const el=document.getElementById('tab-lessons');
    if(el) el.classList.add('hidden');
  }
  hideLessonsBlock();
  document.addEventListener('DOMContentLoaded',hideLessonsBlock);
  setTimeout(hideLessonsBlock,100);
  setTimeout(hideLessonsBlock,500);
  setTimeout(hideLessonsBlock,1000);
})();
</script>

</body>
</html>
