<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tutor Finance</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-50 min-h-screen flex flex-col items-center justify-center p-4 font-sans">

    <div id="app" class="max-w-md w-full">
        <!-- Контент рендерится динамически -->
    </div>

    <script>
        const SUPABASE_URL = 'https://dmasuczggcxzrxasgoov.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_9XV4TmmWv1OHVvbdei2jhA__Bu4FsQG';
        const { createClient } = supabase;
        const supabaseClient = createClient(SUPABASE_URL, SUPABASE_KEY);

        let currentUser = JSON.parse(sessionStorage.getItem('auth_user')) || null;
        let students = [], lessons = [], payments = [];

        async function loadData() {
            try {
                const [sRes, lRes, pRes] = await Promise.all([
                    supabaseClient.from('students').select('*'),
                    supabaseClient.from('lessons').select('*'),
                    supabaseClient.from('payments').select('*')
                ]);
                students = sRes.data || [];
                lessons = lRes.data || [];
                payments = pRes.data || [];
            } catch (err) {
                console.error("Ошибка загрузки данных из базы:", err);
            }
            render();
        }

        function render() {
            const app = document.getElementById('app');
            
            if (!currentUser) {
                app.innerHTML = `
                    <div class="bg-white p-8 rounded-3xl shadow-sm border border-slate-100">
                        <div class="text-center mb-6">
                            <h1 class="text-2xl font-bold text-slate-800">Tutor Finance</h1>
                            <p class="text-slate-400 text-sm">Система учета занятий</p>
                        </div>
                        <form onsubmit="handleLogin(event)" class="space-y-4">
                            <div>
                                <label class="block text-xs font-semibold text-slate-500 uppercase tracking-wider mb-1">Email</label>
                                <input type="email" id="emailInput" required 
                                    class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-indigo-500 text-slate-800 text-sm"
                                    placeholder="teacher@example.com">
                            </div>
                            <div>
                                <label class="block text-xs font-semibold text-slate-500 uppercase tracking-wider mb-1">Пароль</label>
                                <input type="password" id="passwordInput" required 
                                    class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-indigo-500 text-slate-800 text-sm"
                                    placeholder="••••••••">
                            </div>
                            <button type="submit" 
                                class="w-full py-3 bg-indigo-600 text-white font-semibold rounded-xl hover:bg-indigo-700 transition cursor-pointer mt-2">
                                Войти
                            </button>
                        </form>
                    </div>
                `;
                return;
            }

            if (currentUser.role === 'tutor') {
                app.innerHTML = `
                    <div class="bg-white p-8 rounded-3xl shadow-sm border border-slate-100 max-w-2xl mx-auto">
                        <div class="flex justify-between items-center mb-8">
                            <div>
                                <h1 class="text-xl font-bold text-slate-800">Кабинет преподавателя</h1>
                                <p class="text-slate-400 text-sm">Добро пожаловать, ${currentUser.name}</p>
                            </div>
                            <button onclick="logout()" class="px-4 py-2 bg-slate-100 text-slate-600 rounded-xl text-sm font-medium hover:bg-slate-200 transition cursor-pointer">Выйти</button>
                        </div>
                        <div class="space-y-4">
                            <p class="text-slate-600">Панель управления активна. База данных подключена.</p>
                            <div class="p-4 bg-slate-50 rounded-2xl border border-slate-100">
                                <span class="text-xs text-slate-400 uppercase tracking-wider">Статистика</span>
                                <div class="grid grid-cols-2 gap-4 mt-2">
                                    <div>Учеников в базе: <b>${students.length}</b></div>
                                    <div>Всего занятий: <b>${lessons.length}</b></div>
                                </div>
                            </div>
                        </div>
                    </div>
                `;
            }
        }

        async function handleLogin(event) {
            event.preventDefault();
            const email = document.getElementById('emailInput').value.trim();
            const password = document.getElementById('passwordInput').value.trim();

            try {
                const { data, error } = await supabaseClient
                    .from('tutors')
                    .select('*')
                    .eq('email', email)
                    .eq('password', password);

                if (error) throw error;

                if (data && data.length > 0) {
                    currentUser = { role: 'tutor', name: data[0].name || 'Преподаватель' };
                    sessionStorage.setItem('auth_user', JSON.stringify(currentUser));
                    render();
                } else {
                    alert("Неверный email или пароль!");
                }
            } catch (err) {
                console.error("Ошибка авторизации:", err);
                alert("Ошибка при проверке данных.");
            }
        }

        function logout() { 
            currentUser = null; 
            sessionStorage.removeItem('auth_user');
            render(); 
        }

        loadData();
    </script>

<script id="hide-student-lessons-block-v1">
(function(){
  function hideLessonsBlock(){
    const el=document.getElementById('tab-lessons');
    if(el) el.classList.add('hidden');
  }
  hideLessonsBlock();
  document.addEventListener('DOMContentLoaded',hideLessonsBlock);
  setTimeout(hideLessonsBlock,100);
  setTimeout(hideLessonsBlock,500);
  setTimeout(hideLessonsBlock,1000);
})();
</script>

</body>
</html>
